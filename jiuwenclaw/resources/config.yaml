# ========== 工具权限管控 ==========
#
# 三种整工具动作: allow / ask / deny。
# tools.<name> 优先于参数级规则；allow/deny 会直接短路。
# rules / approval_overrides 仅匹配 shell 命令文本，schema 为：
#   - id: string
#     description: string
#     pattern: string or re:...
#     action: allow | deny
permissions:
  enabled: ${PERMISSIONS_ENABLED:-true}
  # Default permission for tools not listed below.
  defaults: ask

  tools:
    bash: allow
    mcp_exec_command: ask
    create_terminal: ask
    write: ask
    write_file: allow
    edit_file: allow
    skill_tool: allow
    read_file: allow
    skill_complete: allow
    search_replace: ask
    write_memory: allow
    edit_memory: allow
    read_memory: allow
    memory_search: allow
    memory_get: allow
    todo_create: allow
    todo_insert: allow
    todo_complete: allow
    todo_remove: allow
    todo_list: allow
    # Coding Memory 工具权限
    coding_memory_write: allow
    coding_memory_edit: allow
    coding_memory_read: allow
    # 外接记忆工具（External Memory — OpenJiuwen）
    ltm_search: allow
    ltm_search_summary: allow
    viking_search: allow
    viking_read: allow
    viking_browse: allow
    viking_remember: allow
    viking_add_resource: allow
    web_search: allow
    mcp_fetch_webpage: allow
    # 通用客户端工具：具体能力和资源仍由 custom_tool_context 清单及
    # client_session_id / tool_call_id 回传校验约束。
    custom_tool: allow
    cron_list_jobs: allow
    cron_get_job: allow
    cron_create_job: allow
    cron_update_job: allow
    cron_delete_job: allow
    cron_toggle_job: allow
    cron_preview_job: allow
    skill_acceleration_exec: ask
    # Agent-team 编排工具：与 leader/member role gate 对齐，避免 defaults.guard
    # 把 build_team 等变成 ASK 后卡死团队回合。
    build_team: allow
    clean_team: allow
    spawn_teammate: allow
    spawn_human_agent: allow
    spawn_bridge_agent: allow
    spawn_external_cli: allow
    shutdown_member: allow
    approve_plan: allow
    approve_tool: allow
    create_task: allow
    list_members: allow
    update_task: allow
    claim_task: allow
    submit_plan: allow
    verify_task: allow
    member_complete_task: allow
    view_task: allow
    send_message: allow
    send_message_scheduled: allow
    workspace_meta: allow
    swarmflow: allow
    async_tasks_list: allow
    async_task_output: allow
    async_task_cancel: allow

  rules:
    - id: shell_allow_dir
      pattern: "dir *"
      action: allow
    - id: shell_allow_ls
      pattern: "ls *"
      action: allow
    - id: shell_allow_pwd
      pattern: "pwd *"
      action: allow
    - id: shell_allow_cd
      pattern: "cd *"
      action: allow
    - id: shell_allow_echo
      pattern: "echo *"
      action: allow
    - id: shell_allow_cat
      pattern: "cat *"
      action: allow
    - id: shell_allow_type
      pattern: "type *"
      action: allow
    - id: shell_allow_tree
      pattern: "tree *"
      action: allow
    - id: shell_allow_get_childitem
      pattern: "Get-ChildItem *"
      action: allow
    - id: shell_allow_get_content
      pattern: "Get-Content *"
      action: allow
    - id: shell_allow_select_string
      pattern: "Select-String *"
      action: allow
    - id: shell_allow_head
      pattern: "head *"
      action: allow
    - id: shell_allow_tail
      pattern: "tail *"
      action: allow
    - id: shell_allow_git_status
      pattern: "git status *"
      action: allow
    - id: shell_allow_git_log
      pattern: "git log *"
      action: allow
    - id: shell_allow_git_diff
      pattern: "git diff *"
      action: allow
    - id: shell_allow_git_branch
      pattern: "git branch *"
      action: allow

  approval_overrides: []

  # 数字分身 owner-scoped 权限（默认空，不生效）
  owner_scopes: {}
  deny_guidance_message: ""

  # Phase-1: 命令意图抽取（L1 shlex + L3-Cmd LLM）；关闭后只保留工具参数三轴判定。
  command_intent:
    enabled: true
    timeout_seconds: 15
    extra_body:
      thinking:
        type: disabled

  # Phase-1: 文件路径三轴权限（read / write / exec）。
  # - workspace: agent workspace 内的读写默认放行（rw_enabled=false 时所有内部读写也要审批）
  # - global:    workspace 外的读写白名单（最长前缀匹配）；
  #              entry 形如 {read_enable: true, write_enable: false}
  # - trusted_exec_directory: 允许「通过解释器执行」的脚本目录前缀列表
  # - tool_bindings: 在不改代码的情况下把额外工具的某个参数注册为 read / write / exec
  file_guard:
    workspace:
      rw_enabled: true
      description: "Agent workspace 内默认放行 read / write"
    global:
      "${JIUWENCLAW_SHARED_SKILLS_DIRS}":
        read_enable: true
        write_enable: true
    trusted_exec_directory: []
    tool_bindings: {}

  # 兼容键：旧 external_directory 在加载时会被自动迁移到 file_guard.global，
  # 新写入入口（persist_*）一律落到 file_guard，不再回写这里。
  external_directory:
    "*": "ask"

browser:
  # chrome_path can be a string or per-OS map.
  # Example:
  # chrome_path:
  #   windows: "C:\\Users\\YOUR_USER\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe"
  #   macos: "/Applications/Google Chrome.app"
  #   linux: "/usr/bin/google-chrome"
  remote_debugging_address: "127.0.0.1"
  remote_debugging_port: 9222
  # empty means use launcher default profile path by OS
  user_data_dir: ""
  profile_directory: "Default"

updater:
  enabled: true
  repo_owner: CharlieZhao95
  repo_name: jiuwenclaw
  release_api_url: ""
  asset_name_pattern: "jiuwenclaw-setup-{version}.exe"
  sha256_name_pattern: "jiuwenclaw-setup-{version}.exe.sha256"
  timeout_seconds: 20

# 文件传输配置（分布式部署模式）
# 当 Gateway 和 AgentServer 分开部署时，需要启用此配置
file_transfer:
  # 是否启用分布式模式（true=启用 WebSocket 文件传输）
  enabled: false
  # 分片大小（字节），默认 64KB
  chunk_size: 65536
  # 最大文件大小（字节），默认 100MB，0=不限制
  max_file_size: 104857600
  # 传输超时时间（秒），默认 300 秒
  transfer_timeout: 300
  # 单分片最大重试次数
  max_retries: 3
  # 接收文件存储目录（相对于 workspace）
  received_files_dir: "received_files"
  # 临时文件清理间隔（秒）
  cleanup_interval: 3600
  # 清理超过 N 秒的临时文件
  cleanup_age: 86400
  # 最大并发传输数
  max_concurrent_transfers: 5

extensions:
   # 扩展包搜索目录（字符串），用 ';' 分割多个目录：
   # EXTENSION_DIRS="E:/a;D:/b"; 默认会加载仓库根目录 extensions
   extension_dirs: ${EXTENSION_DIRS:-extensions}
   # 外置扩展 agent_client REST 监听（与 docker/extensions/agent_client 配套）；本地开发可通过环境变量覆盖
   agent_client_rest:
     enabled: ${AGENT_CLIENT_REST_ENABLED:-true}
     host: ${AGENT_CLIENT_REST_HOST:-127.0.0.1}
     port: ${AGENT_CLIENT_REST_PORT:-18080}

team:
  team_name: jiuwen_team
  lifecycle: persistent
  teammate_mode: build_mode
  spawn_mode: inprocess
  # Per-teammate peer send_message ceiling for interactive debate (None/omit = off).
  # Leader sends are not counted. Task-board P2P is excluded while open tasks exist.
  max_debate_rounds: 2

  leader:
    member_name: team_leader
    display_name: 团队领导
    persona: "天才项目管理专家，擅长任务分解和团队协调"

  agents:
    leader:
      workspace:
        stable_base: true
      max_iterations: 200
      completion_timeout: 600.0

  workspace:
    enabled: true

  transport:
    type: inprocess

  storage:
    type: sqlite

modes:
  # 一级模式 agent / code / team
  agent:
    # agent 模式支持 性能/规划/集群
    fast:
      memory:
        enabled: true
        is_proactive: false
      rails:
      tools:
    plan:
      memory:
        enabled: true
        is_proactive: true
      rails:
      tools:
    team:
  code:
    # code 模式
    # 控制项目记忆与编码记忆；关闭时不影响文件、LSP 和 plan rails。
    memory:
      enabled: true
    rails:
    tools:

# Petal 搜索：默认关闭；为 true 时需同时配置环境变量 API_BASE（或 OPENAI_BASE_URL）与 default_headers（JSON）

enable_petal_web_search: true

# web_search 统一搜索：超时与 paid provider 顺序（petal 默认第一）
web_search:
  timeout_seconds: 30
  max_results: 8
  paid_provider_order:
    - petal
    - bocha

# DeepResearch 工具：默认开启
enable_deepresearch: true


# 沙箱配置 (officeAce 经 WS 控制: 开关 / 启动方式; 文件白黑名单 + 网络域名配置写进运行时 policy 副本)
# enabled 默认 false: 不主动 install 沙箱用户 / 拉起 box-server, 仅在用户显式设
# sandbox.enabled: true 时才 install + 创建沙箱进程 (opt-in, 避免开箱即拉起).
sandbox:
  enabled: false
  startup_mode: internal
  url: http://127.0.0.1:8321
  type: jiuwenbox
  policy_file: windows-policy.yaml
