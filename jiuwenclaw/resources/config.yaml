# 配置架构版本（用户 override 首次写入 version 时从本模板拷贝；迁移脚本可比对）
version: 1.0

# 前端显示语言：zh（中文）/ en（英文），与 Web 界面语言切换同步
preferred_language: zh

# 日志目录：~/.jiuwenclaw/agent/.logs/
# gateway.log / channel.log / agent_server.log 按源码路径分流；full.log 为汇总。
# level：未单独指定时的默认级别。console_level：控制台；可省略则用 level。
# 环境变量 LOG_LEVEL 仅覆盖控制台级别（不覆盖各日志文件）。
logging:
  level: INFO
  console_level: INFO
  gateway: INFO
  channel: INFO
  agent_server: INFO
  full: INFO

  # === 新增日志系统配置（日志系统迁移 - JSON格式化 + user_visible标记） ===

  # 统一输出格式控制（控制台 + 文件）
  # text：控制台文本 + 文件仅 .log（文本格式）
  # json：控制台 JSON + 文件仅 .json（JSON 格式）
  # dual：控制台文本 + 文件双模式（.log + .json 同时生成）
  # format: text  # 默认：text（开发环境）
  # format: json  # 生产环境：仅 JSON 格式
  # format: dual  # 混合环境：文本控制台 + 双模式文件
  format: text

  # 日志输出开关（正交控制输出目标）
  console_enabled: true   # 控制台日志开关（true：启用终端输出；false：关闭终端输出）
  file_enabled: true      # 文件日志开关（true：启用文件输出含 permissions.log；false：关闭文件输出）

  
  # JSON 格式详细配置（⚠️ 配置项已添加，功能待实现）
  json:
    # 时间戳格式
    timestamp_format: text  # 使用文本格式时间戳 "2026-05-07 11:33:22.537"
    # timestamp_format: iso8601  # ISO 8601 格式 "2026-05-07T11:33:22.537Z"（可选）

    # 字段配置
    include_component: true  # 自动添加组件分类字段（gateway/channel/agent_server）

    # 敏感数据脱敏
    sanitize_sensitive_data: true  # 自动应用 SensitiveDataFilter 脱敏

    # 异常信息处理
    exc_info_style: simple  # 仅包含异常类型和消息 "TypeError: xxx"
    # exc_info_style: full  # 包含完整堆栈信息（可选）

  # 用户可见日志 Tag 配置
  # 控制日志中 [USER] 和 [USER_PROGRESS] Tag 的显示
  tags:
    user_visible: true           # 启用 [USER] Tag（关键用户操作）
    user_progress_visible: true   # 启用 [USER_PROGRESS] Tag（进度信息）

# ============================================================
# 对象存储接口配置（AgentServer内部存储服务）
# ============================================================
storage:
  # ============================================================
  # 对象存储配置（AgentServer 内部使用）
  # ============================================================
  # 存储后端类型：local（本地文件系统）, huawei-obs（华为云OBS）, aliyun-oss（阿里云OSS）
  # 或自定义类型（需配合 backend_class 配置）
  type: ${STORAGE_TYPE:-local}

  # 自定义 Backend 类路径（可选）
  # 格式："module_path.ClassName"
  # 示例："myapp.storage.MyObsBackend"
  # 当配置此字段时，SDK 会自动加载并注册自定义 Backend 类
  # backend_class: ${STORAGE_BACKEND_CLASS:-}

  # 本地文件系统存储配置（开源版本、开发环境）
  # SDK 内置 LocalStorageBackend，无需 backend_class 配置
  local:
    # root_path: ${STORAGE_LOCAL_ROOT_PATH:-/tmp/jiuwenclaw-storage}
    # 旧字段兼容（已弃用，建议使用 root_path）
    base_dir: ${STORAGE_LOCAL_BASE_DIR:-~/.jiuwenclaw/storage/local}
    upload_dir: ${STORAGE_LOCAL_UPLOAD_DIR:-~/.jiuwenclaw/uploads}

  # 华为云 OBS 配置（商用版本、生产环境）
  # 需用户自行实现 ObsStorageBackend 或配置 backend_class
  huawei_obs:
    access_key: ${OBS_ACCESS_KEY:-}
    secret_key: ${OBS_SECRET_KEY:-}
    endpoint: ${OBS_ENDPOINT:-obs.cn-north-4.myhuaweicloud.com}
    bucket: ${OBS_BUCKET:-}
    # backend_class: "myapp.storage.ObsStorageBackend"  # 示例

  # 阿里云 OSS 配置（商用版本、生产环境）
  # 需用户自行实现 OssStorageBackend 或配置 backend_class
  aliyun_oss:
    access_key: ${OSS_ACCESS_KEY:-}
    secret_key: ${OSS_SECRET_KEY:-}
    endpoint: ${OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
    bucket: ${OSS_BUCKET:-}
    # backend_class: "myapp.storage.OssStorageBackend"  # 示例

memory:
  # ============================================================
  # 记忆系统配置
  # ============================================================
  # 两个正交开关：
  #   1) engine — 挂载哪套 rail（内置 / 外接 / 都挂 / 都不挂）
  #   2) mode   — 内置记忆的存储位置（local | cloud），不影响外接
  #
  # 外接 rail 的启用 = (engine ∈ {external, both}) AND (external.provider 非空)
  # 内置 rail 的启用 = (engine ∈ {builtin, both})  AND (mode=local)
  #                    AND modes.agent.<当前 mode>.memory.enabled=true
  # ============================================================

  mode: ${MEMORY_MODE:-local}            # 内置记忆存储位置：local | wiki | cloud
  # wiki - 使用子agent对记忆文件进行索引，不需要embedding
  # 记忆引擎总开关：builtin | external | both | none
  #   builtin  — 仅内置记忆（默认，兼容旧配置）
  #   external — 仅外接记忆（LTM / 插件）
  #   both     — 内置 + 外接并存
  #   none     — 全部关闭
  engine: ${MEMORY_ENGINE:-none}
  forbidden_memory_definition:
    enabled: false
    patterns: []
    description:
      zh: "以下内容禁止记忆：密码、API密钥、Secret、Token、信用卡号、身份证号、手机号等敏感信息"
      en: "The following content is forbidden to remember: passwords, API keys, secrets, tokens, credit card numbers, ID numbers, phone numbers and other sensitive information"

  # ------------------------------------------------------------
  # 外接记忆（External Memory）
  # ------------------------------------------------------------
  # 启用方式（任选一种）：
  #
  # 【方案 1：YAML 直接改】
  #   memory.engine: external   # 或 both
  #   memory.external.provider: openjiuwen   # 选一个：openjiuwen | <plugin-name>
  #   # 然后在下方对应的 openjiuwen 子段填 api_key
  #
  # 【方案 2：环境变量覆盖】
  #   export MEMORY_ENGINE=external
  #   export MEMORY_EXTERNAL_PROVIDER=openjiuwen
  #
  # 【关闭外接记忆】
  #   把 memory.engine 改回 builtin 或 none；
  #   或把 memory.external.provider 留空（两者任一生效即可禁用）
  #
  # 【挂载模式常见组合】
  #   ┌─────────────┬───────────────┬──────────────────────────────────────┐
  #   │ engine      │ provider      │ 效果                                 │
  #   ├─────────────┼───────────────┼──────────────────────────────────────┤
  #   │ builtin     │ *             │ 只挂内置（默认；外接即使填了也不挂）    │
  #   │ external    │ openjiuwen    │ 只挂外接 LTM                         │
  #   │ external    │ <plugin-name> │ 只挂用户安装的插件                    │
  #   │ both        │ 任一          │ 内置 + 外接同时挂（LLM 两套工具并列）   │
  #   │ none        │ *             │ 全关，任何记忆 rail 都不挂             │
  #   └─────────────┴───────────────┴──────────────────────────────────────┘
  #
  # 说明：
  # - 外接记忆 mode-independent：配置一次，plan / fast 模式全程生效，
  #   跨 config 热重载持久存活（保留 prefetch 缓存、电路断路器、会话状态）
  # - 单 provider 策略：同一时刻 provider 只能选一个
  # - 失败降级：provider 构建失败或网络异常不阻塞主流程
  external:
    # 选哪家 provider。空字符串 = 禁用外接（等价于 engine=builtin）
    provider: ${MEMORY_EXTERNAL_PROVIDER:-openjiuwen}   # '' | openjiuwen| <plugin-name>
    # 数据隔离标识（所有 provider 共用）
    user_id: ${MEMORY_USER_ID:-__default__}
    scope_id: ${MEMORY_SCOPE_ID:-__default__}

    # -- OpenJiuwen LTM（本地长期记忆：KV + 向量 + DB）--
    # 生效条件：provider='openjiuwen'
    # 依赖顶层 embed 段提供 embedding 配置（不单独配置 api_key）
    openjiuwen:
      kv_type: shelve                                    # shelve | in_memory | sqlite
      kv_path: ${MEMORY_KV_PATH:-}                       # 空则落租户 workspace/memory/ltm/kv；非空原样用（上游保证隔离）
      vector_type: chroma                                # chroma
      vector_persist_dir: ${MEMORY_VECTOR_DIR:-}         # 空则 .../memory/ltm/chroma；非空原样用
      db_type: sqlite
      db_path: ${MEMORY_DB_PATH:-}                       # 空则 .../memory/ltm/ltm.db；非空原样用

# models.*.model_client_config 超时说明：
#   timeout — 非流式 invoke；流式未配置 stream_timeout 时也使用此值（整包响应上限）
#   stream_timeout — 可选，仅 stream 使用；未配置则回退 timeout
#     （httpx read：等首包 / chunk 间最长空闲，不是 SSE 整段总时长上限）
# models.defaults 列表项可选 tier: lite | pro（每个 tier 只能配置在一个模型上，供 subagent 按等级选模型）
models:
  # defaults:
  #   - tier: pro
  #     model_client_config:
  #       api_base: ${API_BASE}
  #       api_key: ${API_KEY}
  #       model_name: ${MODEL_NAME}
  #       client_provider: ${MODEL_PROVIDER}
  #       timeout: 1800
  #       max_retries: 1
  #       verify_ssl: false
  #     model_config_obj:
  #       temperature: 0.6
  #   - tier: lite
  #     model_client_config:
  #       api_base: ${API_BASE}
  #       api_key: ${API_KEY}
  #       model_name: ${MODEL_NAME}
  #       client_provider: ${MODEL_PROVIDER}
  #       timeout: 1800
  #       max_retries: 1
  #       verify_ssl: false
  #     model_config_obj:
  #       temperature: 0.6
  default:
    model_client_config:
      api_base: ${API_BASE}
      api_key: ${API_KEY}
      model_name: ${MODEL_NAME:-xiaomi/mimo-v2-omni}
      client_provider: ${MODEL_PROVIDER}
      timeout: 1800
      stream_timeout: 60       # 可选，仅流式
      max_retries: 1           # OpenAI SDK 内部 HTTP 重试；0=关闭
      verify_ssl: false
    model_config_obj:
      temperature: 0.6
  video:
    model_client_config:
      api_base: ${VIDEO_API_BASE}
      api_key: ${VIDEO_API_KEY}
      model_name: ${VIDEO_MODEL_NAME:-xiaomi/mimo-v2-omni}
      client_provider: ${VIDEO_PROVIDER}
      timeout: 1800
      max_retries: 1
      verify_ssl: false
    model_config_obj:
      temperature: 0.6
  audio:
    model_client_config:
      api_base: ${AUDIO_API_BASE}
      api_key: ${AUDIO_API_KEY}
      model_name: ${AUDIO_MODEL_NAME:-openai/gpt-4o-audio-preview}
      client_provider: ${AUDIO_PROVIDER}
      verify_ssl: false
      timeout: 1800
      max_retries: 1
    model_config_obj:
      temperature: 0.6
  vision:
    model_client_config:
      api_base: ${VISION_API_BASE}
      api_key: ${VISION_API_KEY}
      model_name: ${VISION_MODEL_NAME:-bytedance-seed/seed-2.0-mini}
      client_provider: ${VISION_PROVIDER}
      verify_ssl: false
      timeout: 1800
      max_retries: 1
    model_config_obj:
      temperature: 0.6
  image_gen:
    model_client_config:
      api_base: ${IMAGE_GEN_API_BASE}
      api_key: ${IMAGE_GEN_API_KEY}
      model_name: ${IMAGE_GEN_MODEL_NAME:-}
      client_provider: ${IMAGE_GEN_PROVIDER}
      timeout: 1800
      max_retries: 1
      verify_ssl: false
    model_config_obj:
      temperature: 0.6

# 生成代码可读性：Prompt 约束 + Python 源码 \uXXXX 兜底转换（仅 .py/.pyw）
# 设为 false 可紧急关闭整套能力
code_generation:
  unicode_readable: true

telemetry:
  enabled: false                    # 总开关（环境变量 OTEL_ENABLED 优先）
  exporter: otlp                    # otlp / console / none
  endpoint: http://localhost:4317   # OTLP endpoint
  protocol: grpc                    # grpc / http
  headers: {}                       # 公共 OTLP headers，可被 traces/metrics 覆盖
  log_messages: true                # 是否在 span event 中记录完整消息内容
  service_name: jiuwenclaw
  provider_factory:                 # 自定义 provider factory，格式：module:function
  traces:
    exporter:                       # trace exporter，默认回退到 telemetry.exporter
    endpoint:                       # trace endpoint，默认回退到 telemetry.endpoint
    protocol:                       # trace protocol，默认回退到 telemetry.protocol
    headers: {}                     # trace headers，默认回退到 telemetry.headers
  metrics:
    exporter:                       # metrics exporter，默认回退到 telemetry.exporter
    endpoint:                       # metrics endpoint，默认回退到 telemetry.endpoint
    protocol:                       # metrics protocol，默认回退到 telemetry.protocol
    headers: {}                     # metrics headers，默认回退到 telemetry.headers

perf:
  summary:
    enabled: true
    bottleneck_top_n: 3
    include_tasks: true
    include_errors: false

react:
  agent_name: main_agent
  max_iterations: 100
  model_name: ${MODEL_NAME:-deepseek-chat}
  skill_mode: all
  # 禁用的工具列表，添加 fork_agent 可避免并行调用触发 API 限流
  # 禁用后用户需使用 spawn_subagent 替代
  # plan 模式 Todo 进度提醒：每 N 次工具调用后，在下一次 model 调用前注入当前 todo 快照
  # 支持两种配置方式（二选一）：
  #   1) YAML：enable_progress_repeat: false
  #   2) 环境变量：enable_progress_repeat: ${TODO_PROGRESS_REPEAT:-true}
  #      在 .env 中设置 TODO_PROGRESS_REPEAT=false 可关闭
  task_planning:
    enable_progress_repeat: ${TODO_PROGRESS_REPEAT:-true}
    list_tool_call_interval: 20
  # 支持两种配置方式（同一字段，二选一）：
  #   1) YAML 列表：disabled_tools: ["bash", "fork_agent"]
  #   2) 环境变量：disabled_tools: ${DISABLED_TOOLS:-}
  #      在 .env 文件中设置：DISABLED_TOOLS=bash,fork_agent（逗号/分号分隔）
  # disabled_tools: ["fork_agent"]
  disabled_tools: ${DISABLED_TOOLS:-}
  # Tool Calling Guard：对不支持 function calling 的模型，在 LLM API 层剥离 tools/tool_choice。
  # 默认关闭；嵌入场景通过 env 启用。
  tool_calling_guard:
    enabled: ${TOOL_CALLING_GUARD_ENABLED:-false}
    limited_models:
      - qwen3-32b
      - qwen3-30b-a3b
  # 禁用的技能列表（黑名单）：列表中的技能不会被 Agent 加载或使用
  # 支持两种配置方式（同一字段，二选一）：
  #   1) YAML 列表：disabled_skills: ["dangerous_skill"]
  #   2) 环境变量：disabled_skills: ${DISABLED_SKILLS:-}
  #      在 .env 文件中设置：DISABLED_SKILLS=dangerous_skill,deprecated_skill（逗号/分号分隔）
  # disabled_skills: ["dangerous_skill"]
  disabled_skills: ${DISABLED_SKILLS:-}
  # Skill 认证信息注入：skill_name → env dict
  # 当指定 skill 处于激活状态时，对应的环境变量会自动注入到 shell 工具（mcp_exec_command / bash）
  # 的子进程中，skill 脚本可通过 os.getenv() 读取认证信息。
  # 值支持 ${ENV_VAR:-default} 语法，由框架的 resolve_env_vars 统一解析。
  # 空对象 {} 只是占位符：catalog 注入的 skill_envs 热重载时不得被它覆盖。
  # 清空凭证时 catalog 会带技能名和空字符串，例如 hwocr: { HWOCR_AK: "" }。
  # 示例：
  # skill_envs:
  #   akg-agents:
  #     AKG_API_KEY: ${AKG_API_KEY:-}
  #     AKG_BASE_URL: ${AKG_BASE_URL:-https://api.example.com}
  #   search-workflow:
  #     SEARCH_API_KEY: ${SEARCH_API_KEY:-}
  skill_envs: {}
  # code_agent / research_agent 默认不启用；只有显式配置 enabled: true 才会显示并可被 task_tool 调用
  # browser_agent 保持原行为，仍由浏览器 runtime 开关决定是否默认注册；这里只支持覆盖其参数
  subagents:
    code_agent:
      enabled: false
      # max_iterations: 15
    research_agent:
      enabled: false
      # max_iterations: 15
  answer_chunk_size: 500
  stream_chunk_threshold: 50
  stream_character_threshold: 2000
  # 上下文窗口展示用上限（token）：前端占用条的分母，需与所用模型官方窗口对齐填写；百分比分子为单次调用的输入+输出（并与 total 取较大值）
  context_window_limit_tokens: 128000
  context_engine_config:
    # ---------- 关停 / 切链开关 ----------
    # 整体关闭上下文工程（链 A/B 全部不挂载，仅 default_window_round_num 滑动窗口）：
    #   enabled: false
    # 关闭 KV cache 释放（推理后端亲和优化）：
    #   enable_kv_cache_release: false
    # 关闭 reload 工具（模型不能再调 reload_original_context_messages 拉回 offload 内容）：
    #   enable_reload: false
    # 切回链 A（DialogueCompressor / MessageSummaryOffloader / CurrentRoundCompressor /
    # RoundLevelCompressor 4 类）—— 显式关 SessionMemory：
    #   session_memory: false
    # 关链 B 中的某一层（不切链）：
    #   ⚠ 链 B 是 preset 注入，yaml 里删 key 或写空 dict 仍按预置默认启用，无法物理移除。
    #   调测时把阈值调到极大即等价于不触发：
    #     tool_result_budget.tokens_threshold: 99999999
    #     micro_compact.trigger_threshold: 99999  + keep_recent_per_tool: 99999
    #     full_compact.trigger_total_tokens: 99999999
    #   彻底物理移除某层须改 agent-core 的 _merge_processors 预置或切链 A。
    #
    # ============ Session 级 QA 块（qa_block）============
    # 职责：一次 invoke = 一个 QA 块；Freeze 落盘 L0；每轮注入全量 L1 Catalog；
    #       Selector 按用户问题 preload 部分历史 QA 原文；仅主 agent.plan session 启用。
    # 关闭：enabled: false → 不 Freeze/Assembly，行为回退链 B 整窗压缩。
    qa_block:
      enabled: true                    # 总开关；subagent spawn/fork 在代码层强制 false

      # --- L1 目录（写入 registry，供 [QA_BLOCK_CATALOG] 与 Selector）---
      l1_inline_max_chars: 500         # Q+A 合计 ≤ 此值：Catalog 直接存原文（l1_source=inline）
      l1_summary_max_chars: 300        # 超长时 L1 目标长度上限（截断或 LLM 摘要）
      l1_llm_min_chars: 1500           # Q+A ≥ 此值且走 persist 阶段才调 LLM 摘要；commit 阶段仅截断
      excerpt_max_chars: 200           # registry 中 user/answer 短摘录（Catalog pending 时兜底展示）

      # --- L0 热缓存与落盘 ---
      history_qa_buffer_size: 6        # 进程内保留最近 N 个 QA 的 L0 全文；超出则 hydrate 读盘
      async_freeze_persist: true       # true= L0 写盘与 L1 定稿异步；cancel 路径仍同步 persist
      freeze_overview_await_s: 3.0     # freeze 前等待 overview；显式传入 await_pending_overview

      # --- 默认加载近期块（不依赖 selector，确保最近 tool_result 全文始终可见）---
      default_hydrate_recent_blocks: 3  # 始终 hydrate 最近 N 块完整 L0；0=禁用
      max_total_hydrate_blocks: 9       # 默认 + selector 合并上限（3 + 6）
      hydrate_max_tokens: 30000         # token 预算安全网；超限从最旧块开始丢弃

      # --- Catalog LRU 淘汰（块很多、目录超 token 预算时从最旧开始淘汰，不改 qa_id/handle）---
      # catalog_max_tokens: 8000       # [QA_BLOCK_CATALOG] 总 token 超此值触发 LRU 淘汰（默认 8000）
      # catalog_short_max_chars: 150     # 已废弃（LRU 淘汰替代旧截断策略），保留仅为配置兼容

      # --- Selector：决定哪些历史 QA 的 L0  preload 进窗（块级；块内索引用 load_qa_index）---
      selector_enabled: true           # false= 不调 selector，仅 hydrate 默认近期块（default_hydrate_recent_blocks）
      selector_mode: llm               # llm | rule | hybrid（hybrid= LLM 失败必走 rule）
      max_preload_blocks: 6             # 每轮最多 preload 几个历史 QA
      selector_rule_fallback: true     # LLM 调用/解析失败时是否回退 rule 选块
      selector_fallback: last_n        # LLM+rule 仍为空：last_n=续作语义时 preload 最近 1 块；none=不兜底
      selector_min_relevance: 0.12     # rule 模式：query 与 Catalog 文本 token 重叠率下限
      # selector_fallback_on_empty: false  # true= 无续作语义时仍 preload 最近 1 块（默认 false）

      # --- Hydrate：preload 时若该 QA 已有 qa_artifact 产物，直接注入概览+目录而非全文 ---
      # hydrate_artifact_aware: true     # 默认 true；false= 始终回灌 L0 原文

    # ============ 单 QA 卸载/引用（qa_artifact）============
    # 职责：对已 preload 进窗的历史 QA 生成「概览 + 逐 message 目录 + reload 句柄」；
    #       三级触发（单块 / 整窗 / full compact 安全网）；须配合 qa_block + session_memory（链 B）。
    # 注意：启用 qa_artifact 且 yaml 未配 full_compact_processor_config 时，运行时会自动注入
    #       FullCompactProcessor（挂载 qa_artifact 安全网）；仅写 qa_artifact.enabled 不会单独生效于链 A。
    # 工具：load_qa_index(qa_id) 展开块内目录；reload_original_context_messages 按句柄取 round 原文。
    # 阈值须严格递增：history_block_compact_tokens < session_memory.trigger_tokens
    #                < full_compact_target_tokens < full_compact.trigger_total_tokens
    qa_artifact:
      enabled: true

      # --- 触发 1：单历史 QA 块过大，异步生成产物（概览+目录）---
      history_block_compact_tokens: 8000   # 窗内该 QA「未覆盖原文」token ≥ 此值 → 异步压该块

      # --- 触发 2：整窗达 session_memory 阈值时，扫剩余 RAW 历史 + 预生成当前 QA（STAGED）---
      qa_min_worth_tokens: 2000            # 低于此 token 的 QA 不参与压块/安全网候选

      # --- 触发 3 / FullCompact 安全网：同步把总窗压到目标以下 ---
      full_compact_target_tokens: 92000    # 单轮 full compact 目标总窗 token（须 < trigger_total_tokens）
      # full_compact_max_qas: 4            # 每波最多并发压缩几个 QA（默认 4）
      # full_compact_max_waves: 8            # 单轮最多循环几波；仍超则整窗兜底（默认 8）
      # active_qa_keep_tail: 2               # 压当前 QA 时保留最近 N 条原文（默认 2）

      # --- 块内目录（catalog.json）生成 ---
      catalog_long_message_tokens: 800     # 单 round 超此值 → offload + 一行摘要；否则原文进目录
      # catalog_summary_max_tokens: 80       # 每条长 round LLM 摘要长度上限（默认 80）

      # --- 健壮性（同步压块 / 与异步线撞车时）---
      # degrade_max_retries: 2             # 同步生成失败重试次数，超过则降级为保留尾部原文（默认 2）
      # await_products_max_polls: 20         # 安全网等待异步产物就绪的最大轮询次数（默认 20）
      # await_products_poll_interval_s: 0.1  # 上述轮询间隔秒（默认 0.1）

    enable_kv_cache_release: false
    enable_reload: true
    # 关闭 SDK 默认英文 reload prompt；中文版由 JiuClawContextEngineeringRail 注入。
    enable_reload_prompt: false
    enabled: true                  # 总开关：false = 链 A/B 全关，仅默认窗口生效
    # 不按轮数/消息数强行截断，上下文长度完全交给链 B 处理器管理。
    # null → _deep_agent_context_engine_config 的 model_copy(update=...) 覆盖类默认(10)，使
    # _get_window_messages 的 round/message 截断分支均不进入。
    default_window_round_num: null
    default_window_message_num: null
    # 同时刻可 pin 进 LLM 上下文的 active skill 正文条数（默认 1）。>1 时才可在 load 多技能时
    # 都保留 [ACTIVE SKILL BODY]；为 1 时再 load 会驱逐前一个（trace 里 [ACTIVE SKILL EVICTED]）。
    # max_active_skill_bodies: 1

    # ============ 一键切链（链 B 默认 / 链 A 备选）============
    # 当前：链 B = SessionMemory + ToolResultBudget + MicroCompact + FullCompact
    # 切链 A = MessageSummaryOffloader + DialogueCompressor + CurrentRoundCompressor + RoundLevelCompressor
    #
    #   切链 A：把下方 `session_memory: { ... }` dict 整段注释掉，然后取消下一行：
    # session_memory: false
    #         ↑ 取消注释这行 + 注释掉下方 dict，即切到链 A
    #         同时取消文件底部"链 A 备选块"4 个 *_config 的注释（按需调参）。
    #
    #   切回链 B：把上面两步反过来即可（恢复 dict + 注释回这行）。
    #
    # 顺序约束（小 → 大）：
    #   session_memory.trigger_tokens
    #     < tool_result_budget.tokens_threshold (单 round tool 总和)
    #     < full_compact.trigger_total_tokens   (整窗口总 token)
    # 数值面向 200k 窗口；128k 模型需整体下调。
    # ===========================================================

    session_memory:
      # 滚动写"会话笔记"到工作区文件（不在 trace 里）；FullCompact 走 session_memory 路径会用。
      trigger_tokens: 85000        # 首次写笔记：窗口 token ≥ 此值开始写
      trigger_add_tokens: 80000     # 增量节奏：每多 N token 追写一次（应 ≤ trigger_tokens）
      tool_min_: 5                 # 两次笔记间至少 N 次工具调用，避免抖动；≥1
      incremental_mode: true       # true=增量扫描（仅处理上次更新后的新消息，节省 token）/ false=全量扫描
      # update_mode: agent_edit             # agent_edit=ReActAgent 编辑 / direct_replace=整体重写
      # direct_replace_max_retries: 2       # direct_replace 失败重试次数
      # model / model_client:               # 写笔记的 LLM；不设则继承默认模型

    tool_result_budget_processor_config:
      # 单 round 内 ToolMessage 总 token 超阈值，且单条 > large_message_threshold 时，
      # 把该条替换为 OffloadToolMessage：<persisted-output>...preview...</persisted-output>。
      tokens_threshold: 15000        # 单 round tool 结果总 token 阈值；relay-claw 实测峰值 ~58k、典型一轮 4 个 fetch_webpage ≈ 16k 即触发；200k 窗口默认 50000，128k 模型建议 25000~30000
      large_message_threshold: 5000  # 单条 ToolMessage 算"大"的门槛（候选）；< tokens_threshold；源码默认 10000，5000 让 5k+ 的 webpage 优先被 offload
      # trim_size: 3000                      # offload 后 preview 字符数；应 << 原文长度
      tool_name_allowlist:           # 保护名单：下列工具结果永不 offload；null/空 = 全部允许
        - read_file
      # offload_message_type: ["tool"]       # 当前仅支持 tool
      # messages_threshold: null             # 备用消息计数阈值；当前主走 tokens 路径
      # messages_to_keep: null               # 备用：保留尾部 N 条不动
      adaptive_per_tool_budget: true         # S5: 启用按工具信息密度自适应预算；效果1—按密度分配每工具token预算，效果2—排序时低密度工具优先 offload
      density_profiles:                      # S5: Budget 专用密度配置（tools 分类须与 micro_compact 一致）
        high:                                # 高密度：预算权重放大，分得更多token份额
          tools: [web_search, grep, glob, list_files, list_directory, free_search, mcp_free_search]
          budget_multiplier: 2.0
        medium:                              # 中密度：基准
          tools: [read_file, fetch_webpage, mcp_fetch_webpage]
          budget_multiplier: 1.0
        low:                                 # 低密度：预算权重缩小，优先被offload
          tools: [bash, shell, exec, mcp_exec_command, spawn_subagent]
          budget_multiplier: 0.4

    micro_compact_processor_config:
      # 同一工具调用次数 > trigger_threshold + keep_recent_per_tool 时，
      # 把"较旧的那 keep_recent_per_tool 条之外"的全部替换为 cleared_marker。
      trigger_threshold: 5           # 触发额度（在 keep 之上还能堆多少条）
      keep_recent_per_tool: 10        # 每工具保留最近 N 条原文，源码默认 15。
      # cleared_marker: "[Old tool result content cleared]"   # 替换后的占位文案
      # compactable_tool_names: 白名单（精确匹配 ToolMessage.name），不在名单的工具完全忽略。
      # 选取标准：本 harness 真实出现 + 单条返回较大 + 历史可丢（再要时可重新调用）。
      # 提醒：bash 输出常含执行证据（错误堆栈、产物路径），spawn_subagent 是已消耗 token 的成果，
      # 折叠后无法回溯。本配置纳入是基于 relay-claw 实测 bash/spawn_subagent 多用于查询性命令、
      # 单条体积大且压缩收益高；如果你的场景里 bash 主要做有副作用的执行，请把它移出白名单。
      compactable_tool_names:
        - fetch_webpage
        - mcp_fetch_webpage
        - web_search
        - bash
        - shell
        - exec
        - mcp_exec_command
        - spawn_subagent
        - grep
        - glob
        - list_files
        - list_directory
        - free_search
        - mcp_free_search
        - read_file
      adaptive_per_tool_budget: true         # S5: 启用按工具信息密度自适应 keep 条数
      density_profiles:                      # S5: MicroCompact 专用密度配置（tools 分类须与 tool_result_budget 一致）
        high:                                # 高密度：输出紧凑、信息丰富（搜索结果、文件列表），多保留
          tools: [web_search, grep, glob, list_files, list_directory, free_search, mcp_free_search]
          keep_recent_per_tool: 15
        medium:                              # 中密度：代码/网页内容，信息密度中等
          tools: [read_file, fetch_webpage, mcp_fetch_webpage]
          keep_recent_per_tool: 10
        low:                                 # 低密度：冗长输出（命令日志、子agent），优先压缩
          tools: [bash, shell, exec, mcp_exec_command, spawn_subagent]
          keep_recent_per_tool: 5            # S3实现后可降至2~3

    tool_result_dedup_processor_config:
      # S8: 工具结果语义去重与错误折叠
      # 当同一工具的多次调用产生重复结果时，自动折叠/去重以节省上下文 token
      error_folding: true                    # S8a: 启用错误结果折叠（连续失败→旧错误折叠为标记，最新完整保留）
      error_fold_min_consecutive: 2          # 同一工具连续≥N次错误才触发折叠
      # error_pattern_max_length: 100        # 错误模式摘要最大字符数
      success_dedup: true                    # S8b: 启用成功结果语义去重（完全相同→引用标记，高重叠→差异提取）
      # dedup_similarity_threshold: 0.85     # 行级Jaccard相似度阈值，≥此值视为高重叠
      # dedup_window_per_tool: 20            # 每工具去重窗口：只在最近N条结果中查找重复
      # dedup_max_content_length: 50000      # 超过此长度的结果不做去重比较（避免性能开销）
      # dedup_max_diff_chars: 500            # 高重叠时差异部分最大字符数

    full_compact_processor_config:
      # 整窗口 token 超阈值时，调一次 LLM 把历史压成
      # [FULL_COMPACT_BOUNDARY] + summary，并在尾部 reinject 最近 skill/file/task_status 等关键状态。
      trigger_total_tokens: 100000   # 整窗口 token 阈值；202k 窗口下预留 ~22k 给压缩调用本身；128k 模型建议 100000
      # compression_call_max_tokens: 200000   # 压缩调 LLM 时的最大上下文预算
      # messages_to_keep: 10                  # 保留最近 N 条；buffer < 此值时不会"删历史"，只新增 summary
      # keep_tool_message_pairs: true         # 保留区里成对的 (tool_call ↔ tool_result) 不被截断
      # state_snapshot_max_chars: 4000        # state 快照（plan/task/skills/todos）正文最大字符
      # reinject_todos: true                  # 压缩后在 summary 后 reinject 活跃 todo 关键字段
      # reinject_recent_skills: 3             # summary 后重注最近 N 个 skill
      # reinject_file_tool_names:             # 在 summary 末尾重注这些工具的最近调用（默认列表）
      #   ["read_file","write_file","edit_file","glob","grep"]
      # reinject_tool_result_hint_names:      # 同上，针对 tool 结果的提示
      #   ["read_file","write_file","edit_file","glob","grep"]
      # marker: "[FULL_COMPACT_BOUNDARY]"     # 系统消息分界 marker
      # state_marker: "[FULL_COMPACT_STATE]"  # state 块 marker
      # synthetic_user_marker: "[earlier conversation truncated for compaction retry]"
      # session_memory_enabled: true          # 优先用 session_memory 笔记替换历史；放不下再走 LLM 全量压
      # session_memory_marker: "[SESSION_MEMORY_BOUNDARY]"
      # summary_intro / recent_messages_notice / session_memory_intro:   # 文案，一般不改
      # model / model_client:                 # 全量压缩的 LLM；不设则继承默认模型
    # ----------------------------------------------------------------------------------
    # ---------- 预置链 A（仅当 session_memory: false 时生效；与链 B 二选一）----------
    # 取消下方注释 + 顶部加 `session_memory: false` 即切回链 A。
    # 数值参考 develop 分支默认档（200k 窗口）；其余字段均按源码默认。
    # message_summary_offloader_config:        # offload 大工具结果到摘要
    #   tokens_threshold: 60000                # 总 token 超过即触发
    #   large_message_threshold: 20000         # 单条算"大消息"的门槛
    #   protected_tool_names: ["read_file:*SKILL.md", "reload_original_context_messages"]
    # dialogue_compressor_config:              # 对话级摘要压缩
    #   tokens_threshold: 100000
    #   messages_to_keep: 10                   # 保留最近 N 条
    #   compression_target_tokens: 1800        # 摘要目标 token
    # current_round_compressor_config:         # 当前 round 内压缩
    #   tokens_threshold: 100000
    #   messages_to_keep: 6
    #   compression_target_tokens: 4000
    # round_level_compressor_config:           # round 级递归压缩（兜底）
    #   trigger_total_tokens: 230000           # 触发总 token；> target_total_tokens
    #   target_total_tokens: 160000            # 压缩后目标总 token
    #   keep_recent_messages: 6                # 末尾保护区
  # SkillToolkit：search_skill（SkillNet/ClawHub）/ install_skill / uninstall_skill
  skill_toolkit:
    # false = 不向 agent 注册 search_skill（install_skill、uninstall_skill 仍注册）
    search_skill_enabled: ${SEARCH_SKILL_ENABLED:-false}

  # 工具渐进可见：tools schema 固定为 eager_tools，其余工具按需通过 meta 工具访问
  # 常驻可见工具直接出现在 schema；按需可见工具通过 tools_search + invoke_tool 调用
  tool_lazy_load:
    enabled: true              # true | false；启用后模型侧 tools schema 固定
    # 仅对白名单内 model_name 子串匹配启用渐进可见（如 glm）；空列表 = 所有模型均启用
    enable_for_models:
      - glm
    # 常驻可见（eager_tools）：每轮模型调用都带完整 schema，可直接调用
    # 必须包含 tools_search 和 invoke_tool（系统会自动补齐）
    eager_tools:
      - tools_search           # 搜索按需可见工具并返回 schema
      - invoke_tool            # 按 schema 调用按需可见工具
      - web_search
      - fetch_webpage
      - ask_user_question
      - fork_agent
      - spawn_subagent
      - send_file_to_user
      - list_files
      - read_file
      - write_file
      - edit_file
      - glob
      - grep
      - bash
      - code
      - skill_tool
      - skill_complete
      - todo_create
      - todo_list
      - todo_modify
      - reload_original_context_messages
      - load_qa_index                 # 展开指定 QA 块内「概览+逐 round 目录」；非 Selector 选块
      - deepresearch_run_task
      - skill_acceleration_exec
    subagents:
      enabled: true
      inherit_parent_eager_tools: true
      eager_tools:
        - tools_search
        - invoke_tool

  # Skills 在线自演进配置
  evolution:
    enabled: true             # true = 启用在线 Skills 自演进
    auto_save: true           # true = 每轮对话后自动保存演进经验
    skill_base_dir: "agent/skills"  # Skill 根目录

  skill_turbo:
    # 开启后 agent 模式请求会先尝试 SkillTurbo，未命中/失败自动回落现有 DeepAgent。
    enabled: true
    # [TEMP-EXTERNAL-SKILL] PPT skill 的外部目录名（与原版 pptx-craft 区分）。
    # 测试在 skill_root 下放入该名称的 skill 子目录即可。
    skill_name: pptx-craft
    # [TEMP-EXTERNAL-SKILL] 外部 skill 目录的 SHA256 校验值。
    # 转测前由开发计算并填写，校验失败时打 WARNING 日志但不阻塞执行。
    # 计算方法（注意：导入 environment 而非 pipeline_init；Windows 路径需用 r'' 原始字符串）：
    #   python -c "from jiuwenclaw.agentserver.skill_turbo.environment import _compute_dir_checksum; print(_compute_dir_checksum(r'<skill_root>\pptx-craft-skill_turbo'))"
    skill_checksum: 03fdacfcc92207294e226671066e5c6b8c7b64187ce6d47f1844d59f2a90a0dc

  # LLM 调用重试配置（应用层；OpenAI SDK 重试见 models.*.model_client_config.max_retries）
  llm_retry:
    enabled: true              # 重试开关
    max_attempts: 3            # 失败后额外重试次数（不含首次）
    initial_backoff: 10.0      # 初始等待时间（秒）
    max_backoff: 60.0          # 最大等待时间（秒）
    backoff_factor: 2.0        # 等待倍率
    retry_on_rate_limit: true  # 是否重试 429 限流

  # 同轮多个受控 tool 的批次内并发
  concurrency:
    enabled: true
    tool_limits:
      spawn_subagent: 10
      web_search: 10
tools:
  - todo
  - skill

email_settings:
  email_address: ${EMAIL_ADDRESS}
  token: ${EMAIL_TOKEN}
  smtp_server: ${SMTP_SERVER:-smtp.gmail.com}
  port: ${EMAIL_PORT:-587}

embed:
  embed_api_key: ${EMBED_API_KEY}
  embed_base_url: ${EMBED_API_BASE}
  embed_model: ${EMBED_MODEL}

task_memory:
  # Set enabled: true to activate TaskMemoryService skill tools
  # (experience_retrieve, experience_learn, experience_clear)
  enabled: false
  # Override defaults below if task memory uses a different model/key than the main agent
  llm_model: ${TASK_MEMORY_LLM_MODEL}
  embedding_model: ${TASK_MEMORY_EMBED_MODEL}
  api_key: ${TASK_MEMORY_API_KEY}
  api_base: ${TASK_MEMORY_API_BASE}
  # Retrieval and summary algorithms: ACE | ReasoningBank | ReMe
  retrieval_algo: ACE
  summary_algo: ACE

gateway:
  # AgentServer client mode.
  # websocket: default ws client
  # yuanrong: provided by AgentServerClientExtension
  agent_client:
    type: websocket # websocket | yuanrong
    frontend_endpoint:
    function_version_urn:
    concurrency: 1
    invoke_timeout_s: 60

  # SessionMap 用于多 bot 场景（如 channels.feishu.<bot_key>）：将平台身份映射为 Agent 的 session_id。
  # 取值：per_chat_bot（默认，同 chat+bot 共享会话）, per_chat_bot_user（按 user 分会话）
  session_map_scope: per_chat_bot
  # 会话列表存储模式：local（默认）或 remote。
  # local：session.list 直接扫描本机 sessions 目录（适用于同机部署）。
  # remote：Gateway 在本地维护最多 10 条会话索引，适用于 Gateway 与 Agent 分机部署时。
  # 分机部署时请设置为 remote，否则 session.list 将读取网关本机目录（通常为空）。
  web_session_storage: local

heartbeat:
  # 心跳间隔（秒），默认 60
  every: 3600
  # 心跳结果回传的 channel（如 "web"），
  target: web
  # 心跳生效时间段（本地时间），start <= now < end 时心跳生效
  active_hours:
    start: 08:00
    end: 22:00

# Agent RAS 整体配置
agent_ras:
  # 总开关。默认开启；显式 enabled: false 时不注册 AgentRASRail
  enabled: true
  detectors:
    # 工具循环检测
    repeat_tool:
      enabled: true
      # circuit_breaker_recovery: 相同工具+参数重复达到该次数时告警（LOW）
      warning_threshold: 5
      # ping-pong 交替轮次达到该次数时告警（LOW，不要求 no_progress）
      critical_threshold: 10
      # 全局兜底：连续相同调用且无进展达到该次数时 CRITICAL 断路
      global_breaker_threshold: 10
      # 未知/错误工具连续失败达到该次数时 CRITICAL（WARNING 为阈值一半）
      unknown_tool_threshold: 10
    # LLM 文本/思考死循环检测（门槛单位：字符）
    llm_thinking_loop:
      enabled: true
      # 默认启用 L3 语义 Judge；显式 false 才关闭（关闭后仅 L1/L2 字面检测）
      semantic_content_enabled: true
      # 累计字符达到该门槛后才开始 L1/L2/L3 检测
      detection_start_chars: 30000
      # L1/L2 近窗大小 = 扫描间隔 = 最小可检长度（FIFO 截断最旧内容）
      window_max_chars: 2000
      # suffix_cycle / similar_clauses 重复次数阈值
      loop_repeat_threshold: 5
      # 分句相似度阈值（0~1，越高越严格）
      similar_clause_sim_threshold: 0.95
      # 启动后，自上次 L3 eval 起新增字符达到该门槛才触发语义检测
      semantic_eval_chars: 10000
  # 恢复侧通用配置
  recovery:
    # LOW 警告时是否向用户推送可见 notice（steering 始终按 policy 执行）
    notify_user_on_warning: true

