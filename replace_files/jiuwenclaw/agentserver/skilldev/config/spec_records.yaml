html-builder:
  name: html-builder
  description: |
    当需要生成html时，可参考本skill。交付可直接打开使用的高质量单文件 HTML（内联 CSS/JS），适用于小游戏、可视化看板、攻略、小工具等场景。
  files:
  - path: SKILL.md
    content: |
      ## 总目标
      根据用户任务，生成**高质量、健壮、触控友好、手机渲染优先**的单文件HTML：
      - 默认适配移动端竖屏
      - 交互顺滑、视觉精致、信息结构清晰
      - 尽量不依赖后端；需要数据时提供可替换的数据导入方案
      ---

      ## 核心原则（强约束）
      ### 1) 单文件交付
      - **必须**输出完整 `<!doctype html>...`，CSS/JS 全部内联在同一文件中。
      - **不得**拆分成多文件，不得要求用户额外构建步骤。
      - **必须**包含：`<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">`

      ### 2) 严禁手写复杂渲染/算法（尽量用成熟库）
      - 地图/图表/复杂动画/富交互：优先用成熟库（例如 **ECharts**）。
      - 不要手搓地图投影、图表坐标系、复杂布局引擎。
      - 小游戏可以原生实现，但若涉及复杂物理/渲染，优先用轻量库（能用就用，别硬写难维护逻辑）。
      - CSS 样式：建议使用 Tailwind CSS
      - 交互逻辑：简单页面用原生CSS+CSS变量；复杂交互用Vue/Alpine CDN/Tailwind

      ### 3) 外部资源与兼容性（必须可在手机与 file:// 尽量工作）
      - 任何外部资源必须使用**绝对 URL 且带 `https:`**，严禁相对路径。
      - 优先国内 CDN：
        - 通用 JS/CSS：`https://cdn.staticfile.org/...`
        - npm/GitHub 文件：`https://cdn.jsdmirror.com/...`
      - 若依赖外部库，则：
        - 提供加载失败的降级提示（例如“库加载失败，请检查网络”）
        - 关键库可提供备用CDN地址做自动fallback
        - 尽量减少依赖数量与体积
      - 避免需要服务端的特性；如必须 `fetch` 外部数据，需说明可能受 CORS/网络影响，并提供“本地粘贴/导入数据”的备用方案。
      - 若使用 Tailwind CSS，必须通过<script src="https://cdn.tailwindcss.com"></script>引入。禁止在 <style> 中使用 @apply 等需要构建的语法，直接写 Utility Class

      ### 4) 移动端响应式与布局规则
      - 手机优先（320px 起），自适应。
      - 主容器 `max-width` 居中（如 980px/1100px），**严禁固定像素宽度布局**。
      - 当页面需要同时展示多个独立模块（任意 `div/section/article` 等容器）时：
        - **必须纵向顺序排布**
        - 每个模块**独占一行并占满可用宽度**
        - **禁止左右并排**
      - 表格必须移动端可用：外层容器横向滚动 `overflow:auto`。
      - 触控友好：主要点击区域≥44px；关键信息不可只靠 `:hover`。

      ### 5) UI/UX 质量底线
      - 视觉现代、简洁、高对比度、可读性强（字号/行高合理）。
      - 有明确的信息层级（标题/副标题/正文/辅助信息）。
      - 必须有状态反馈：加载中、空状态、错误提示、成功提示。
      - 可访问性：表单 `label`、按钮可读文本、对比度、`aria-*` 在关键控件上可用。
      - 性能：避免无意义的大图与重阴影；动画注意节制，优先 transform/opacity。

      ### 6) 场景分类执行策略

      #### A. 小游戏类
      - 画面渲染优先用 `<canvas>`（棋类/像素类可用 DOM + Grid）。
      - 游戏循环使用 `requestAnimationFrame`，不用 `setInterval`。
      - 通常需要有：开始界面 → 游戏中 → 结束/结算，状态机清晰。
      - AI 对手（如五子棋）：实现基础策略即可（贪心/Minimax 浅层），不要试图实现完整搜索树。
      - 必须有得分/计时/步数等反馈，结算页提供"再来一局"。
      - 涉及状态/进度/分数的场景，默认写入`sqlite`这个skill内部提供的后端接口，刷新不丢失。
      - 绝对尺寸： 游戏主棋盘（Board）必须显式指定高度。建议使用 width: 90vw; height: 90vw; (保持正方形) 或者 max-width: 500px; max-height: 500px;。不要只写 width: 100% 而不写 height。
      - 居中显示： 使用 Flexbox 让游戏区域在屏幕中央垂直水平居中。
      - Grid 布局： 如果使用 CSS Grid，请确保父容器有具体的高度，防止高度塌陷。

      #### B. 学习/效率工具类
      - 输入框在移动端弹出键盘时，页面布局不能崩：
        使用 `visualViewport` API 或固定底部输入栏的方式适配。
      - 背单词等工具：支持进度指示（如 3/50）、正确率统计。
      - 涉及大量文本数据（单词库等）：直接内联为 JS 数组/JSON，
        不要拆到外部文件；若数据量极大（>500KB），提供 `<textarea>` 粘贴导入方案。

      #### C. 数据可视化/看板类
      - 图表库统一用 ECharts（CDN），不要混用多个图表库。
      - 数据直接内嵌在 `<script>` 中作为 JS 变量，并加注释标明数据来源和更新时间。
      - 图表必须设置 `renderer: 'svg'`（移动端清晰度更好）或根据数据量选择。
      - 图表容器高度用 `vw` 单位或 JS 动态计算，不要固定px导致手机上过大/过小。
      - 提供数据说明/脚注（来源、统计口径、时间范围）。

      ### 7) 端侧拍照识别类场景
      - 当用户需求属于以下6类场景时，先加载对应skill，再读取对应配置后再生成HTML。
      - 先调用 `get_skill(skill_name)` 获取完整skill指引，再调用 `view_skill_detail` 读取配置项细则。
      - 配置读取映射如下：
          - 拍照识物背单词 → skill: `word-snap-card`，config_name: `skills.md.word-snap-card`
                                       - 识花草百科记录卡片 → skill: `flower-wiki-card`，config_name: `skills.md.flower-wiki-card`
                                       - OOTD穿搭日记 → skill: `ootd-diary`，config_name: `skills.md.ootd-diary`
                                       - 建筑探索图鉴 → skill: `architecture-explorer`，config_name: `skills.md.architecture-explorer`
                                       - 卡路里计算器 → skill: `calorie-tracker`，config_name: `skills.md.calorie-tracker`
                                       - 文物鉴赏图鉴 → skill: `artifact-wiki`，config_name: `skills.md.artifact-wiki`
      - 一旦命中上述场景，以场景skill规范为最高优先级；与本skill通用规则冲突时，优先遵循场景skill。

      ---
      ## 设计执行
      - 在生成HTML之前，先思考设计方案：1. 页面类型与布局选择2. 配色方案 3. 核心交互/功能列表。然后再生成完整HTML代码。
      - 必须选定一个明确的设计方向并贯彻（例如：杂志排版、游戏机像素风、卡片式极简、拟物、赛博等）。
      - 用 CSS 变量统一主题（颜色/圆角/阴影/间距）。
      - 允许适度动效（页面进入、按钮反馈、模块切换），但不喧宾夺主。
      - 字体：优先系统字体栈以保证加载与中文渲染；如使用外链字体必须可选且有回退。
      ---

