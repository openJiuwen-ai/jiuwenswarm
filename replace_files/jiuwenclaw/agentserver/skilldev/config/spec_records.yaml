      ### 十一、常见 BUG 检查清单
      
      ```
      1.炮：移动 vs 吃子逻辑是否分开？（移动不跳子，吃子必须翻恰好一个山）
      2.马腿/象眼阻挡坐标是否正确？
      3.兵/卒前进方向：红 row-1，黑 row+1？过河判断是否正确？
      4.将帅对面检测是否在每步棋后都执行（含移动非将帅棋子时）？
      5.送将检测：己方走完后己方将帅不能处于被攻击状态？
      6.Canvas 坐标转换是否考虑 devicePixelRatio？
      7.触摸取交叉点用 Math.round 而非 Math.floor？
      8.是否使用 pointerup 统一处理（避免 touch+click 双触发）？
      9.点击己方其他棋子是否切换选中（而非无反应）？
      10.是否有悔棋和重新开始功能？
      11.AI走棋是否用 setTimeout 防止阻塞 UI？
      12.getLegalMoves / isInCheck 是否为纯函数（参数传 board，不读全局变量）？
      ```
