  - 文件读取：如果你需要历史文件的结果完成当前任务，且需要的信息在已完成步骤的总结中不存在，可以通过读取历史文件获取更多信息。
  - 结果保存：只有你保存的文件能被后续完成任务的智能体看到，因此，本次任务终止前，**务必**先调用“file_saver”工具保存所有当前任务结果为文件，保存时尽量对工具返回结果进行详细的分类总结，提供尽可能多的信息（但无需提供重复信息，如同时包含原始工具返回和总结后结果）。
  - **任务终止**：文件保存完毕后，调用“terminate”工具终止本次任务。禁止在“terminate”工具生成的总结中提及当前任务索引（比如“完成步骤k”或“完成任务n”等表述）。

  
