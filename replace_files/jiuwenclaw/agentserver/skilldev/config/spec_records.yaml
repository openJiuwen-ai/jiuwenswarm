gesture-motion:
  name: gesture-motion
  description: |
    创建一个通过摄像头进行手势交互的网页，利用MediaPipe实时识别手势，实现对网页元素的直观操控。当需要「通过摄像头识别手势」与网页交互时使用这个技能。
  files:
  - path: SKILL.md
    content: |
      # npm CDN规范
      - **禁止**使用jsdelivr，必须使用jsdmirror作为CDN，如"https://cdn.jsdmirror.com/npm/@mediapipe/hands/hands.js"

      # 默认交互逻辑
      - 摄像头画面（Video）及其上方的绘制层（Canvas）必须同步进行水平镜像，以确保识别关键点与视频画面完全重合
      - 仅使用MediaPipe的Camera工具包初始化摄像头
      - 优化移动端性能：模型复杂度默认0；渲染器像素比上限为2

      # Hands手部追踪模型
      - 识别手部姿态与手指关节运动
      - 缩放：使用单手拇指与食指的距离变化。需设置防抖阈值
      - 旋转：使用单手食指的 X/Y 坐标控制目标对象绕Y/X轴旋转。旋转方向需严格符合物理拖拽直觉，需对X轴坐标差值（deltaX）乘以-1后再用于旋转计算，或使用`-=`；Y轴坐标差值不需要乘以-1。
      - 手指伸展判断通用逻辑：
        1. 四指（食/中/无名/小指）：指尖（Tip）到手腕（0）距离 > 第二关节（PIP）到手腕距离，则判定为伸出
        2. 拇指：如果拇指尖（4）到小指根部（17）的距离 > 拇指关节（3）到小指根部（17）的距离，则判定为伸出
      - 动画过渡：所有缩放与旋转数值的应用，必须使用Lerp平滑
      - 防丢帧：未检测到手部时，必须重置上一帧的距离与位置缓存，防止手部重新进入画面时发生瞬移
      - 离散事件（如猜拳、手势指令）触发：必须使用"状态锁/就绪标志位"控制单次判定（严禁判断"是否与上一帧不同"）。触发后立即锁定，且在所有逻辑分支（含无效/无变化结果）结束时释放该锁，严防状态死锁

      # Face Detection面部检测模型
      - 轻量级的人脸定位。不能用于识别表情、眨眼、视线方向或嘴巴开合度

      # Face Mesh面部网格模型
      - 用于高精度面部拓扑与微表情分析（开启 refineLandmarks 可追踪瞳孔）

      # Pose姿态估计模型
      - 人体躯干与四肢动作捕捉
csv:
  name: csv
  description: ''
  files:
  - path: analyze.md
    content: |
      # CSV数据总结

      ## analyze.py代码
      ```python
      import pandas as pd
      import matplotlib.pyplot as plt
      import seaborn as sns
      from pathlib import Path

      def summarize_csv(file_path):
          """
          Comprehensively analyzes a CSV file and generates multiple visualizations.

          Args:
              file_path (str): Path to the CSV file

          Returns:
              str: Formatted comprehensive analysis of the dataset
          """
          df = pd.read_csv(file_path)
          summary = []
          charts_created = []

          # Basic info
          summary.append("=" * 60)
          summary.append("DATA OVERVIEW")
          summary.append("=" * 60)
          summary.append(f"Rows: {df.shape[0]:,} | Columns: {df.shape[1]}")
          summary.append(f"\nColumns: {', '.join(df.columns.tolist())}")

          # Data types
          summary.append(f"\n DATA TYPES:")
          for col, dtype in df.dtypes.items():
              summary.append(f"  • {col}: {dtype}")

          # Missing data analysis
          missing = df.isnull().sum().sum()
          missing_pct = (missing / (df.shape[0] * df.shape[1])) * 100
          summary.append(f"\n DATA QUALITY:")
          if missing:
              summary.append(f"Missing values: {missing:,} ({missing_pct:.2f}% of total data)")
              summary.append("Missing by column:")
              for col in df.columns:
                  col_missing = df[col].isnull().sum()
                  if col_missing > 0:
                      col_pct = (col_missing / len(df)) * 100
                      summary.append(f"  • {col}: {col_missing:,} ({col_pct:.1f}%)")
          else:
              summary.append(" No missing values - dataset is complete!")

          # Numeric analysis
          numeric_cols = df.select_dtypes(include='number').columns.tolist()
          if numeric_cols:
              summary.append(f"\n NUMERICAL ANALYSIS:")
              summary.append(str(df[numeric_cols].describe()))

              # Correlations if multiple numeric columns
              if len(numeric_cols) > 1:
                  summary.append(f"\n CORRELATIONS:")
                  corr_matrix = df[numeric_cols].corr()
                  summary.append(str(corr_matrix))

                  # Create correlation heatmap
                  plt.figure(figsize=(10, 8))
                  sns.heatmap(corr_matrix, annot=True, cmap='coolwarm', center=0,
                             square=True, linewidths=1)
                  plt.title('Correlation Heatmap')
                  plt.tight_layout()
                  plt.savefig('correlation_heatmap.png', dpi=150)
                  plt.close()
                  charts_created.append('correlation_heatmap.png')

          # Categorical analysis
          categorical_cols = df.select_dtypes(include=['object']).columns.tolist()
          categorical_cols = [c for c in categorical_cols if 'id' not in c.lower()]

          if categorical_cols:
              summary.append(f"\n CATEGORICAL ANALYSIS:")
              for col in categorical_cols[:5]:  # Limit to first 5
                  value_counts = df[col].value_counts()
                  summary.append(f"\n{col}:")
                  for val, count in value_counts.head(10).items():
                      pct = (count / len(df)) * 100
                      summary.append(f"  • {val}: {count:,} ({pct:.1f}%)")

          # Time series analysis
          date_cols = [c for c in df.columns if 'date' in c.lower() or 'time' in c.lower()]
          if date_cols:
              summary.append(f"\n TIME SERIES ANALYSIS:")
              date_col = date_cols[0]
              df[date_col] = pd.to_datetime(df[date_col], errors='coerce')

              date_range = df[date_col].max() - df[date_col].min()
              summary.append(f"Date range: {df[date_col].min()} to {df[date_col].max()}")
              summary.append(f"Span: {date_range.days} days")

              # Create time-series plots for numeric columns
              if numeric_cols:
                  fig, axes = plt.subplots(min(3, len(numeric_cols)), 1,
                                          figsize=(12, 4 * min(3, len(numeric_cols))))
                  if len(numeric_cols) == 1:
                      axes = [axes]

                  for idx, num_col in enumerate(numeric_cols[:3]):
                      ax = axes[idx] if len(numeric_cols) > 1 else axes[0]
                      daily_data = df.groupby(date_col)[num_col].agg(['mean', 'sum', 'count'])
                      daily_data['mean'].plot(ax=ax, label='Average', linewidth=2)
                      ax.set_title(f'{num_col} Over Time')
                      ax.set_xlabel('Date')
                      ax.set_ylabel(num_col)
                      ax.legend()
                      ax.grid(True, alpha=0.3)

                  plt.tight_layout()
                  plt.savefig('time_series_analysis.png', dpi=150)
                  plt.close()
                  charts_created.append('time_series_analysis.png')

          # Distribution plots for numeric columns
          if numeric_cols:
              n_cols = min(4, len(numeric_cols))
              fig, axes = plt.subplots(2, 2, figsize=(12, 10))
              axes = axes.flatten()

              for idx, col in enumerate(numeric_cols[:4]):
                  axes[idx].hist(df[col].dropna(), bins=30, edgecolor='black', alpha=0.7)
                  axes[idx].set_title(f'Distribution of {col}')
                  axes[idx].set_xlabel(col)
                  axes[idx].set_ylabel('Frequency')
                  axes[idx].grid(True, alpha=0.3)

              # Hide unused subplots
              for idx in range(len(numeric_cols[:4]), 4):
                  axes[idx].set_visible(False)

              plt.tight_layout()
              plt.savefig('distributions.png', dpi=150)
              plt.close()
              charts_created.append('distributions.png')

          # Categorical distributions
          if categorical_cols:
              fig, axes = plt.subplots(2, 2, figsize=(14, 10))
              axes = axes.flatten()

              for idx, col in enumerate(categorical_cols[:4]):
                  value_counts = df[col].value_counts().head(10)
                  axes[idx].barh(range(len(value_counts)), value_counts.values)
                  axes[idx].set_yticks(range(len(value_counts)))
                  axes[idx].set_yticklabels(value_counts.index)
                  axes[idx].set_title(f'Top Values in {col}')
                  axes[idx].set_xlabel('Count')
                  axes[idx].grid(True, alpha=0.3, axis='x')

              # Hide unused subplots
              for idx in range(len(categorical_cols[:4]), 4):
                  axes[idx].set_visible(False)

              plt.tight_layout()
              plt.savefig('categorical_distributions.png', dpi=150)
              plt.close()
              charts_created.append('categorical_distributions.png')

          # Summary of visualizations
          if charts_created:
              summary.append(f"\n VISUALIZATIONS CREATED:")
              for chart in charts_created:
                  summary.append(f"   {chart}")

          summary.append("\n" + "=" * 60)
          summary.append(" COMPREHENSIVE ANALYSIS COMPLETE")
          summary.append("=" * 60)

          return "\n".join(summary)


      if __name__ == "__main__":
          # Test with sample data
          import sys
          if len(sys.argv) > 1:
              file_path = sys.argv[1]
          else:
              file_path = "resources/sample.csv"

          print(summarize_csv(file_path))
      ```


      ## 使用示例query

      ### 基础汇总
      ```
      分析 sample.csv
      ```

      ### 使用自定义 CSV 文件
      ```
      这是我的 sales_data.csv 文件，可以帮我汇总一下吗？
      ```

      ### 聚焦特定分析维度
      ```
      这个数据集中的收入趋势是怎样的？
      ```

      ## 预期输出

      分析将提供以下内容：

      1. **数据集维度** - 行数和列数
      2. **列信息** - 列名和数据类型
      3. **汇总统计** - 数值列的均值、中位数、标准差、最小/最大值
      4. **数据质量** - 缺失值检测与计数
      5. **可视化图表** - 当存在日期列时生成时间序列图

      ## 自定义配置
      为适应具体使用场景，可参考analyze.py代码，自行写代码进行分析。
word-snap-card:
  name: word-snap-card
  description: 生成拍照识别物品学单词的HTML应用
  files:
  - path: SKILL.md
    content: |
      # 拍照识物背单词应用

      生成一个精美的单文件 HTML 应用，用于拍照识别物品并学习对应的英文单词。
      生成健壮、保守、可直接运行的单文件 HTML。重点是识图、翻转卡、历史回看和去重流程不能出错，视觉精致排在稳定性之后。

      ## 必须遵守的实现原则
      1. 只用原生 HTML、CSS、JavaScript；不要引入外部 CDN、框架、字体。
      2. 禁止任何 demo/mock/sample 数据，首屏必须从空状态开始。
      3. 点击拍照按钮后直接调用 `window.HarmonyBridge.camera.takePhoto()`；不要自造相机页、不要使用 `getUserMedia`、不要黑屏取景页。
      4. 识图只允许使用 `executeResult.imageUrl`；如果缺失，直接报错并结束流程，禁止回退到 base64 做识图。
      5. 任何失败都要停在当前步骤并给出可理解提示；禁止继续写入错误数据。

      ## 页面结构
      1. 首页：标题栏 + 2 列历史卡片 + 底部居中拍照按钮。
      2. 识别结果弹层：中间是固定高度的翻转卡。
      3. 翻转卡正面：原图、英文单词、音标、发音按钮。
      4. 翻转卡背面：中文释义、例句、状态按钮“待复习 / 已掌握”。
      5. 历史卡片点击后必须重新打开同一个翻转卡弹层，允许再次翻转、发音、修改状态。

      ## HarmonyBridge API（retCode=0成功）
      拍照: await window.HarmonyBridge.camera.takePhoto()
      返回: {retCode:0, executeResult:{base64, imageUrl, width, height}}
      识图入参必须使用 executeResult.imageUrl（若缺失则报错，禁止回退到 base64）

      识图: await window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
      prompt: 'Identify object. Return JSON: {"word":"apple","phonetic":"/ˈæpl/","definition":"苹果","example":"I eat an apple."}}'
      返回: {retCode:0, executeResult:{word, phonetic, definition, example}}

      抠图: await window.HarmonyBridge.ai.segmentImage(imageUrl);
      返回: {retCode:0, executeResult:{base64}}

      发音: await window.HarmonyBridge.tts.speak(text)

      ## HarmonyBridge 调用
      ```javascript
      const APP_ONLY_TOAST_TEXT = '该功能暂无法使用，请在小艺APP内体验完整功能';

      function getExecuteResult(res) {
        const value = res?.executeResult;
        if (value && typeof value === 'object') return value;
        if (typeof value === 'string') {
          try { return JSON.parse(value); } catch { return null; }
        }
        return null;
      }

      async function takePhoto() {
        if (!window.HarmonyBridge?.camera?.takePhoto) throw new Error(APP_ONLY_TOAST_TEXT);
        return await window.HarmonyBridge.camera.takePhoto();
      }

      async function cutOut(imageUrl) {
        if (!window.HarmonyBridge?.ai?.segmentImage) throw new Error(APP_ONLY_TOAST_TEXT);
        return await window.HarmonyBridge.ai.segmentImage(imageUrl);
      }

      async function recognizeWord(imageUrl) {
        if (!window.HarmonyBridge?.ai?.invokeMultimodalModel) throw new Error(APP_ONLY_TOAST_TEXT);
        const prompt = 'Identify object. Return JSON: {"word":"apple","phonetic":"/ˈæpl/","definition":"苹果","example":"I eat an apple."}';
        return await window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt);
      }

      //cutoutJson为window.HarmonyBridge.ai.segmentImage(imageUrl)函数抠图后获得的Json，其中包含成功码retCode和base64图片，与原图区别是抠图后的图片仅保留主题失去背景信息。
      //recognizeJson为window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)识别之后的Json，其中包含成功码retCode和子Json包含word、phonetic、definition和example。
      const [cutoutJson, recognizeJson] = await Promise.all([
                        // 抠图函数，返回
                        cutOut(imageUrl),
                        // 模型识别
                        recognizeWord(imageUrl)
                    ]);
      ```

      ## 流程状态机
      只允许这 5 个状态：`idle -> capturing -> recognizing -> reviewing -> idle`

      关键规则：
      1. 点击拍照立刻进入 `capturing` 并显示 loading。
      2. `takePhoto` 返回 `retCode !== 0` 时视为取消，静默回到 `idle`。
      3. 拍照成功后先校验 `executeResult.imageUrl`，再进入 `recognizing`，同步进行抠图。
      4. 识图成功后才渲染翻转卡并进入 `reviewing`，原图不再展示，仅展示抠图后的图片。
      5. 用户点“待复习/已掌握”后才写入 `sqlite`这个skill提供的数据库接口。数据库中仅保存抠图后的图片。
      6. 从历史列表点击卡片时，也进入 `reviewing` 并打开同一套翻转卡，而不是只展示静态列表。

      ## 翻转卡防错约束
      1. 外层容器固定高度，推荐 `height: 500px`，不要 `auto`。
      2. 必须使用 `.flip-container > .flipper > .front/.back` 结构。
      3. `.front` 和 `.back` 必须绝对定位、同尺寸、`backface-visibility:hidden`。
      4. 所有可点击按钮放在卡面内部固定区域，不要让文字撑高卡片。
      5. 历史回看与新识别结果必须复用同一套翻转卡 DOM 和交互，不要维护两套详情 UI。

      ## UI 约束
      1. 页面最大宽度 480px，主容器用 `min-height: 100svh`。
      2. 底部拍照按钮 72px 圆形，按钮点击区域不少于 44px。
      3. 配色保持温暖简洁：背景 `#F7F5EF`，强调色 `#FF6B00`，掌握 `#34C759`。
      4. 只用系统字体栈，避免字体加载失败导致偏移。
      5. 历史列表如果使用 CSS grid，必须显式设置 `align-items:start` 或给卡片设置 `align-self:start`，禁止网格项被默认 stretch 拉成超长卡片。

      ## 存储与异常
      1. 所有 API 必须 `try/catch`。
      2. loading 要覆盖 `takePhoto` 、识图和抠图等待期。
      3. 发音按钮失败只提示，不影响已生成卡片。
      4. 禁止预置任何历史卡片。
      5. 每条记录都必须带稳定 `id`，推荐使用 `word.toLowerCase()` 或 `word.toLowerCase()+phonetic` 作为去重键。
      6. 保存逻辑必须是 upsert：识别出已存在单词时更新原记录并移动到顶部，禁止直接 `unshift` 导致同词两张卡。
      7. 历史列表点击打开详情时，状态按钮必须能更新原记录，不允许再次生成重复项。
      
      ## 输出前自检
      1. 拍照按钮的命中目标必须是按钮本体；外环、光晕、伪元素等装饰层不拦截点击。
