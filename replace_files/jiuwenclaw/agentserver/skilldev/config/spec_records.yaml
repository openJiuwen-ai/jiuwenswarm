flower-wiki-card:
  name: flower-wiki-card
  description: 拍摄花草后自动识别品种，生成花草百科卡片，支持翻转卡片手动补充观察记录
  files:
  - path: SKILL.md
    content: |
      # 花草百科记录卡片应用

      生成单文件HTML，运行在端侧WebView，已注入window.HarmonyBridge。

      ## 重要约束（必须遵守）
      1. 只用原生 HTML、CSS、JavaScript，禁止外部 CDN、框架和在线字体。
      2. 禁止任何 mock/demo/fallback 数据，禁止浏览器文件上传兜底，Bridge 缺失时只 toast 并中断。
      3. 点击拍照按钮后直接调用 `HarmonyBridge.camera.takePhoto()`；不要创建额外相机页，不要 `input[type=file]`，不要 `getUserMedia`。
      4. 加载状态必须从用户点击开始覆盖 `takePhoto` 和 AI 全流程。
      5. 图生图失败只能静默回退原图，识图失败则整个流程失败，禁止写入半成品卡片。
      6. 首页展示的卡片应使用图生图产生的风格化图片作为封面，而非原图。

      ## 核心功能
      1. 拍摄花草 → AI自动识别品种
      2. 正面卡片：自动生成花草百科信息（学名、科属、生长习性、花期、基础介绍）
      3. 背面卡片：支持手动补充观察记录（生长环境、开花状态、养护心得）
      4. 通过window.HarmonyBridge.sqlite提供的建表增删改查接口进行数据存储

      ## 交互流程
      1. 首页：顶部Header(标题+记录数) + 中间瀑布流历史记录 + 底部拍照按钮
      2. 无记录时显示空状态提示（树叶图标 + "还没有记录，点击下方按钮开始"）
      3. 点击拍照按钮 → 调用相机 → 显示扫描动画 → 先识图和抠图，再图生图 → 优先进入“书籍展开预览”（若预览渲染失败可直达详情）
      4. 书籍展开预览：
         - 左页：序号+植物名称+原图缩略图
         - 右页：图生图后的植物图鉴封面
         - 支持“重拍 / 查看详情”操作
      5. 详情卡片支持 **3D翻转**（点击翻转查看背面笔记）：
         - 正面：花草图片 + 科属标签 + 中文名 + 拉丁学名
         - 背面：观察笔记表单（日期、环境、状态、心得）
      6. 点击"保存笔记"按钮 → 保存数据库 → 翻回正面
      7. 首页卡片点击 → 弹出详情查看/编辑
      8. 详情弹层必须有明确关闭出口：正面和背面都要有可见的“关闭/返回列表”按钮，不能只依赖点遮罩空白区退出
      9. 任何 CTA 按钮和详情弹层都不得共用同一个 `id`；例如“查看详情”按钮 id 与详情 overlay id 必须不同，否则点击和显隐会串掉

      ## HarmonyBridge API（retCode=0成功）
      返回值兼容规则：优先按对象读取 executeResult；仅当 executeResult 是字符串时才尝试 JSON.parse，禁止无条件 JSON.parse(result.executeResult)。
      拍照: await window.HarmonyBridge.camera.takePhoto()
      返回: {retCode:0, executeResult:{base64, imageUrl, width, height}}
      识图入参必须使用 executeResult.imageUrl（若缺失则报错，禁止回退到 base64）

      识图: await window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
      prompt: '识别图中花草植物。返回JSON: {"name":"牡丹","latin":"Paeonia suffruticosa","family":"毛茛科·芍药属","intro":"形态特征描述","habits":"生长习性描述","bloomPeriod":"花期信息"}'
      返回: {retCode:0, executeResult:{name, latin, family, intro, habits, bloomPeriod}}

      抠图: await window.HarmonyBridge.ai.segmentImage(imageUrl);
      返回: {retCode:0, executeResult:{base64}}

      图生图: await window.HarmonyBridge.ai.generateImage(imageUrl或base64, prompt)
      prompt: '将原图转换为植物图鉴插画风：保留花枝主体构图和轮廓，背景处理为浅灰蓝雾感的边框，不改变花枝主体形态前提下铺满边框内空间，而且还要探出边框顶端，超出约5~10%，以实现“探出/溢出”的效果。整体米色纸张质感，笔触柔和、低饱和、光线通透，不要文字水印'
      返回: {retCode:0, executeResult:{base64}}

      发音: await window.HarmonyBridge.tts.speak(text)

      ## 推荐实现骨架
      1. 维护单一状态机：`idle | capturing | recognizing | previewing | detail`。
      2. 只有在 `recognizeResult.retCode === 0` 且拿到有效对象后才能创建新记录。
      3. 图生图必须在识图和抠图成功后再调用；量化模型更容易把错误处理写乱。
      4. `takePhoto` 若 `retCode !== 0`，视为用户取消，静默回到 `idle`，不要弹“识别失败”。
      5. 创建记录前必须校验：`name`、`latin`、`family`、`intro` 至少兜底成稳定文案，`imageUrl` 必须保留原图。
      6. `generateImage` 返回的 base64 若没有 `data:image/` 前缀，需要补齐后再赋值给 `img.src`。

      ## UI设计规范
      整体风格: 自然、典雅、文艺的植物图鉴风格，但布局优先稳定，避免过多绝对定位。

      背景: 深色渐变(#0f172a到#000) + 两个模糊光晕装饰球
      卡片: 纸张质感(#F5F1E8) + 书页翻转效果 + 左侧阴影模拟书脊

      配色:
      - 主色调: 深绿#1b4332
      - 强调色: 金色#D4AF37
      - 纸张色: #F5F1E8
      - 文字: #2c2c2e

      首页布局:
      - 顶部: 英文艺术标题"Botanic" + 中文副标题"花草图鉴·拾遗" + 记录数徽章
      - 中间: 2列瀑布流(masonry)，卡片高度交错(220px/160px)
      - 底部: 圆形拍照按钮(白色内圆+半透明外环)

      书籍展开预览:
      - 背景: 雾绿色纯色背景，聚焦中心卡片
      - 卡片: 三层叠页效果（左右偏移浅色底页 + 中央主书页）
      - 中央主书页: 左页信息(序号/名称/原图)，右页显示图生图结果
      - 底部操作: “重拍 / 查看详情”双按钮

      详情卡片:
      - 尺寸: max-width:340px, aspect-ratio:3/5
      - 正面上半部: 花草图片 + 科属标签(深绿底)
      - 正面下半部: 中文名(大号衬线) + 拉丁名(斜体) + 分隔线 + 形态特征 + 生长习性
      - 背面: 笔记表单(日期、环境、状态、心得) + 保存按钮

      ## 关键实现
      1. **调用时检测Bridge（重要！）**：
         - 禁止在页面加载/初始化时检测：不要写 `if(window.HarmonyBridge)` 或 `const isNative = !!window.HarmonyBridge` 这样的初始化检测
         - 禁止定义全局的 `isNativeEnv` 变量
         - 正确做法：在每次调用API时使用可选链检测，因为Bridge是异步注入的
      2. **API封装示例（必须按此模式实现）**：
         - 先定义 `APP_ONLY_TOAST_TEXT` 与 `showAppOnlyToast()`，Bridge缺失时统一toast并中断
         ```javascript
         function getExecuteResult(res) {
           const value = res?.executeResult;
           if (value && typeof value === 'object') return value;
           if (typeof value === 'string') {
             try { return JSON.parse(value); } catch { return null; }
           }
           return null;
         }
         async function takePhoto() {
           // 每次调用时检测，不要提前检测
           if (window.HarmonyBridge?.camera?.takePhoto) {
             return await window.HarmonyBridge.camera.takePhoto();
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         async function recognizeImage(imageUrl) {
           if (window.HarmonyBridge?.ai?.invokeMultimodalModel && window.HarmonyBridge?.ai?.segmentImage) {
             return await Promise.all([
                        // 抠图函数，输出Json内容为{retCode:0, executeResult:{base64}}
                        window.HarmonyBridge.ai.segmentImage(imageUrl),
                        // 模型识别，输出Json内容为{retCode:0, executeResult:{name, latin, family, intro, habits, bloomPeriod}}
                        window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
                    ]);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         //这里的base64为抠图后输出的空白背景的base64，仅保留主体，方便后续转换为风格化的图片
         async function generateStylizedImage(base64) {
           if (window.HarmonyBridge?.ai?.generateImage) {
             return await window.HarmonyBridge.ai.generateImage(base64, stylePrompt);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         ```
      3. **Bridge缺失处理（必须）**：当Bridge不可用时，禁止任何 Mock 拍照、识图、图生图、TTS、文件上传降级，统一 toast 提示："该功能暂无法使用，请在小艺APP内体验完整功能"。
      4. **3D翻转实现规范（防止高度塌陷）**：
         - **Container**: `width: 320px; height: 520px; perspective: 1500px;` (必须定高)
         - **Flipper**: `width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s;`
         - **Face**: `position: absolute; width: 100%; height: 100%; backface-visibility: hidden;`
         - **Back**: `transform: rotateY(-180deg);`
         - **Shadow**: 正面左侧、背面右侧添加渐变阴影伪元素模拟书脊
      5. 首页瀑布流: CSS `column-count:2 + break-inside:avoid`
      6. 扫描动画: 半透明光束从上到下扫过图片
      7. 笔记表单: 输入框使用常规 block 布局，不要依赖 transform 叠压
      8. 历史记录默认空数组，禁止预插入植物样本

      ## 移动端适配（必须实现）
      1. viewport设置: width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover
      2. 安全区域适配: padding-top使用env(safe-area-inset-top), padding-bottom使用env(safe-area-inset-bottom)
      3. 触摸优化: -webkit-tap-highlight-color:transparent, touch-action:manipulation
      4. 禁止长按菜单: -webkit-touch-callout:none, -webkit-user-select:none
      5. 响应式布局: 使用 `min-height:100svh`，max-width约束在420px
      6. 字体适配: 使用系统衬线/无衬线字体栈，不依赖在线字体

      ## 异常处理（必须实现）
      1. 错误提示UI: 当API调用失败时，显示居中的错误提示弹窗
      2. 网络错误: 显示"网络连接失败，请检查网络后重试"
      3. 相机错误: 显示"无法访问相机，请检查权限设置"
      4. 识别错误: 显示"识别失败，请重新拍摄清晰的花草图片"
      5. `takePhoto` 取消: 静默关闭 loading，不显示失败
      6. API调用超过10秒显示超时提示

      ## 输出前自检
      1. 底部 FAB 的白色内圆才是点击目标；外环、脉冲圈、书页装饰层都不拦截点击。
      2. 拍照流程只能从一个入口函数进入；不要出现“打开相机页后再二次触发 takePhoto”的链路。
      3. 预览页和详情页的隐藏态不会拦截首页点击；可见性只由统一 class 控制。
      4. 首页可居中，书籍预览和详情编辑必须回到正常文档流，不制造额外空白。
