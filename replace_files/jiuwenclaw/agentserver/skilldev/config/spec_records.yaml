                        // 抠图函数，输出Json内容为{retCode:0, executeResult:{base64}}
                        window.HarmonyBridge.ai.segmentImage(imageUrl),
                        // 模型识别，输出Json内容为{retCode:0, executeResult:{style, colors, items, desc}}
                        window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
                    ]);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         //这里的base64为抠图后输出的空白背景的base64，仅保留主体，方便后续转换为风格化的图片
         async function generateStylizedImage(base64) {
           if (window.HarmonyBridge?.ai?.generateImage) {
             return await window.HarmonyBridge.ai.generateImage(base64, stylePrompt);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }         
         ```
      3. **Bridge缺失处理（必须）**：当Bridge不可用时，禁止任何Mock拍照/识图/图生图/TTS降级，统一toast提示："该功能暂无法使用，请在小艺APP内体验完整功能"。
      4. 拍立得效果: 白色padding + box-shadow + transform:rotate(-3deg)
      5. 胶带装饰: 伪元素 + 半透明白色 + rotate(45deg)
      6. 书本效果: flex双列 + 中间书脊渐变阴影
      7. AI请求串行: 先识图，后图生图
      8. 图生图降级: 如果generateImage失败，使用原图
      9. 编辑弹窗: position:fixed + bottom:0 + slideUp动画
      10. Bridge缺失时不提供Mock识别结果，统一toast并中断功能调用
      11. 历史记录默认空数组，禁止写入示例穿搭
      12. 禁止在 `DOMContentLoaded`、页面切换函数、扫描动画结束回调里再次调用 `takePhoto()`；只能由用户点击拍照按钮触发一次。

      ## 移动端适配（必须实现）
      1. viewport设置: width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover
      2. 安全区域适配: padding-top使用env(safe-area-inset-top), padding-bottom使用env(safe-area-inset-bottom)
      3. 触摸优化: -webkit-tap-highlight-color:transparent, touch-action:manipulation
      4. 禁止长按菜单: -webkit-touch-callout:none, -webkit-user-select:none
      5. 响应式布局: 使用 `min-height:100svh`，max-width约束在420px
      6. 字体适配: 使用系统字体栈，标题使用本地衬线体

      ## 异常处理（必须实现）
      1. 错误提示UI: 半透明遮罩 + 居中白色弹窗 + 警告图标 + 错误信息 + 关闭按钮
      2. 网络错误: 显示"网络错误异常，请检查网络连接或稍后重试"
      3. 相机错误: 显示"相机启动失败"
      4. AI识别错误: 显示"AI服务异常"，禁止降级使用默认穿搭数据
      5. 图生图失败: 静默降级使用原图，不中断流程
      6. 重试机制: 错误弹窗包含"知道了"按钮关闭

      ## 输出前自检
      1. 相机 FAB 点击后直接进入原生拍照；不要出现 `openCamera -> handleTakePhoto -> takePhoto` 之类的双阶段链路。
      2. `takePhoto()` 在整页代码里只被一个入口函数调用一次；`DOMContentLoaded`、动画结束、页面切换都不能再触发。
      3. 图鉴页可以沉浸式排版，但结果页与编辑弹层不能继承相机页/首页的居中壳。
      4. 底部按钮、贴纸、胶带、装饰浮层不会挡住真正可点控件。
architecture-explorer:
  name: architecture-explorer
  description: 拍摄建筑后AI识别建筑信息，生成建筑百科卡片，支持分类归档和语音朗读
  files:
  - path: SKILL.md
    content: |
      # 建筑探索图鉴应用

      生成单文件HTML，运行在端侧WebView，已注入window.HarmonyBridge。

      ## 重要约束（必须遵守）
      1. 只用原生 HTML、CSS、JavaScript，禁止外部库。
      2. 点击首页拍照按钮后，直接调用 `HarmonyBridge.camera.takePhoto()`；不要先切去“自定义相机页”，这会制造黑屏假相机。
      3. 允许有“扫描中”全屏遮罩，但它只是 loading，不是相机预览页。
      4. 所有 API 调用必须 `try/catch`，并区分“取消拍照”和“真实失败”。
      5. 禁止 mock/demo 数据和演示兜底，首屏只能是空状态或真实历史。
      6. 页面显隐必须完全由统一 class 控制；未激活页面不能通过额外 CSS `display:flex/block` 再次变成可见。
      7. 预览态中的临时记录在用户点击“保存”前不能写入 `list`，也不能参与删除真实历史记录。
      8. 首页展示的卡片应使用图生图产生的风格化建筑图鉴作为封面，而非原图

      ## 核心功能
      1. 拍摄建筑 → AI自动识别建筑信息（名称、风格、年代）
      2. 图生图生成建筑图鉴封面（失败时回退原图）
      3. 支持手动补充拍摄地点、时间、随笔
      4. 按建筑风格分类筛选（中式古典/欧式/现代等）
      5. 语音朗读建筑介绍

      ## 交互流程
      1. 首页(画廊页)：
         - 顶部：标题"建筑图鉴" + 英文副标题
         - 筛选Tab：全部/中式古典/欧式风情/现代地标
         - 两列网格卡片列表（图片+序号+名称+年代）
         - 底部：悬浮圆形拍照按钮
      2. 拍照动作：
         - 点击 FAB 后直接唤起原生拍照
         - 页面只显示全屏扫描遮罩，不切换到伪相机页面
      3. 结果预览页（书籍展开）：
         - 背景使用暖棕色纯底
         - 必须是真双页书本结构，只保留左页和右页两个内容面板
         - 左页展示序号/名称/原图缩略图，右页展示图生图封面与年代
         - 底部按钮：“重拍 / 查看详情”
      4. 详情页：
         - 沉浸式大图(55%屏幕高度)
         - 浮动导航栏(返回+朗读按钮)
         - 底部信息卡片(圆角上滑浮层)
         - 大序号装饰 + 拼音 + 中文名 + 风格标签
         - 介绍文本 + 输入框组(地点/时间/随笔)
         - 底部操作栏：删除/保存按钮

      ## HarmonyBridge API（retCode=0成功）
      返回值兼容规则：优先按对象读取 executeResult；仅当 executeResult 是字符串时才尝试 JSON.parse，禁止无条件 JSON.parse(result.executeResult)。
      拍照: await window.HarmonyBridge.camera.takePhoto()
      返回: {retCode:0, executeResult:{base64, imageUrl, width, height}}
      识图入参必须使用 executeResult.imageUrl（若缺失则报错，禁止回退到 base64）

      识图: await window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
      prompt: '识别图中建筑。返回JSON: {"name":"建筑名称","pinyin":"PINYIN","style":"建筑风格","era":"建造年代","description":"详细介绍100-150字"}'
      返回: {retCode:0, executeResult:{name, pinyin, style, era, description}}

      抠图: await window.HarmonyBridge.ai.segmentImage(imageUrl);
      返回: {retCode:0, executeResult:{base64}}

      图生图: await window.HarmonyBridge.ai.generateImage(imageUrl或base64, prompt)
      prompt: '将建筑照片转换为复古图鉴插画风：保留建筑主体结构与透视，整体暖金色与褐色调，边缘柔和、轻微颗粒感、纸张质感背景，不要文字水印。建筑背景为灰色圆形倒角的卡片，建筑填充整个卡片内容的同时，顶部要探出卡片5到10%，已达到“探出”的效果。'
      返回: {retCode:0, executeResult:{base64}}

      发音: await window.HarmonyBridge.tts.speak(text)

      ## 推荐实现骨架
      1. 单一状态机：`idle | capturing | recognizing | previewing | detail`。
      2. `takePhoto` 成功后立即保存 `photo.imageUrl` 作为原图来源，再继续识图。
      3. 先识图和抠图，后图生图；图生图失败回退原图。
      4. 详情编辑区只存在于详情页底部信息卡中，不要在多页面之间来回复制表单。
      5. 增加 `detailSource = 'preview' | 'list'`，返回按钮必须按来源返回到正确页面，不能固定跳转。
      6. 增加 `isDraft` 或 `currentIndex === -1` 的草稿语义；草稿态只允许“保存为新记录/放弃”，不允许删除最后一条真实记录。
      7. `takePhoto` 返回 `retCode !== 0` 时按“用户取消”处理，直接回到 `idle`，不要抛“拍照失败”。
      8. 图生图返回值若已经是 `data:image/...` URL 则直接使用；只有纯 base64 时才补前缀。

      ## UI设计规范
      整体风格: 新中式/复古纸质感，温润雅致的东方美学

      配色:
      - 鎏金色: #C6A87C(装饰强调)
      - 墨色: #2B2623(主文字)
      - 宣纸白: #F7F5F0(卡片背景)
      - 底色: #EBE6D8(页面背景)
      - 印泥红: #B23A3A(警示操作)
      - 次要文字: #8A847C

      首页布局:
      - 居中标题(中文+英文副标题)
      - 筛选Tab：胶囊按钮，激活时反色(深色底白字)
      - 两列网格(grid-template-columns: repeat(2, 1fr))
      - 卡片：白底圆角+阴影，图片3:4比例，左上角大序号(斜体)
      - 底部FAB：白底金边大圆形，固定在页面正下方居中，不要放在右下角
      - 所有按钮内部禁止使用 emoji 或表情字符，图标仅允许 SVG、CSS 图形或纯文字

      拍照加载态:
      - 深色半透明遮罩
      - 中间取景框轮廓 + 金色扫描线
      - 仅用于反馈“正在拍照/识别”，不承担预览功能

      详情页:
      - 顶部大图55%高度，渐变遮罩导航栏
      - 信息卡片：大圆角(30px)浮层，从中部上滑
      - 装饰性大序号(80px斜体，低透明度)
      - 拼音(金色小字) + 中文名(36px粗体)
      - 风格标签：边框圆角小标签
      - 输入框组：图标+输入框，白底圆角
      - 底部操作栏：删除(白底红字) + 保存(深底金字)
      - 详情页根节点必须 `position:relative; min-height:100svh; overflow:hidden;`
      - 信息卡片必须相对详情页定位，不要挂到 viewport；底部按钮条若需要安全区偏移，使用 `calc(env(safe-area-inset-bottom) + 12px)`
      - 详情页底部主操作按钮也保持水平居中，不要让主操作偏向单侧

      书籍展开预览页:
      - 背景：暖棕色纯底，弱纹理
      - 中央：一本展开的双页书，不要额外悬浮第三页
      - 左页：序号/标题/原图缩略图
      - 右页：图生图结果大图 + 建筑名称 + 年代
      - 按钮：底部双按钮（重拍、查看详情）
      - 预览页默认隐藏，不允许单独给 `#preview` 写 `display:flex`

      ## 关键实现
      1. **调用时检测Bridge（重要！）**：
         - 禁止在页面加载/初始化时检测：不要写 `if(window.HarmonyBridge)` 或 `const isNative = !!window.HarmonyBridge` 这样的初始化检测
         - 禁止定义全局的 `isNativeEnv` 变量
         - 正确做法：在每次调用API时使用可选链检测，因为Bridge是异步注入的
      2. **API封装示例（必须按此模式实现）**：
         - 先定义 `APP_ONLY_TOAST_TEXT` 与 `showAppOnlyToast()`，Bridge缺失时统一toast并中断
         ```javascript
         function getExecuteResult(res) {
           const value = res?.executeResult;
           if (value && typeof value === 'object') return value;
           if (typeof value === 'string') {
             try { return JSON.parse(value); } catch { return null; }
           }
           return null;
         }
         async function takePhoto() {
           // 每次调用时检测，不要提前检测
           if (window.HarmonyBridge?.camera?.takePhoto) {
             return await window.HarmonyBridge.camera.takePhoto();
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         async function recognizeBuilding(imageUrl) {
           if (window.HarmonyBridge?.ai?.invokeMultimodalModel && window.HarmonyBridge?.ai?.segmentImage) {
             return await Promise.all([
                        // 抠图函数，输出Json内容为{retCode:0, executeResult:{base64}}
                        window.HarmonyBridge.ai.segmentImage(imageUrl),
                        // 模型识别，输出Json内容为{retCode:0, executeResult:{name, pinyin, style, era, description}}
                        window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
                    ]);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         //这里的base64为抠图后输出的空白背景的base64，仅保留主体，方便后续转换为风格化的图片
         async function generateStylizedImage(base64) {
           if (window.HarmonyBridge?.ai?.generateImage) {
             return await window.HarmonyBridge.ai.generateImage(base64, stylePrompt);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         async function speak(text) {
           if (window.HarmonyBridge?.tts?.speak) {
             return await window.HarmonyBridge.tts.speak(text);
           }
           showAppOnlyToast();
           throw new Error(APP_ONLY_TOAST_TEXT);
         }
         ```
      3. **Bridge缺失处理（必须）**：当Bridge不可用时，禁止任何 Mock 拍照、识图、图生图、TTS 降级，统一toast提示："该功能暂无法使用，请在小艺APP内体验完整功能"。
      4. 筛选功能: 按 `style` 字段过滤数组
      5. 图生图失败: 静默降级使用原图，不中断主流程
      6. 首页无记录时显示空状态，不要渲染演示建筑
      7. 页面切换使用 class 切换显隐，不要依赖多层绝对定位叠屏
      8. 预览页、详情页都只能在 `switchPage()` 后显示；禁止在组件 CSS 中再次覆盖 `.page{display:none}`
      9. 删除按钮在草稿态下应执行“放弃本次识别并返回首页”，不能删历史数组最后一项
      10. 新记录只有在用户点击保存后才 `unshift` 到数组；查看详情本身不应落盘
      11. `fillDetail()` 显示序号时，草稿态不要显示 `0`，可以显示空字符串或“NEW”
      12. 详情页返回逻辑：
          - 从列表进入详情：返回首页
          - 从预览进入详情：返回预览页
      13. 封面图兼容逻辑：
          - `base64` 以 `data:image/` 开头则直接赋值
          - 否则补成 `data:image/jpeg;base64,${base64}`
      14. 建议内置开发开关：检测 `window.__MOCK_HARMONY_BRIDGE__` 时允许使用本地 mock Bridge，便于桌面回归验证，但默认关闭
      15. 预览页禁止使用“左页 + 中间悬浮页 + 右侧空白页”的三层覆盖布局；这会让 mock 数据看起来像 UI 错位

      ## 移动端适配（必须实现）
      1. viewport设置: width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover
      2. 安全区域适配: padding-top使用env(safe-area-inset-top), padding-bottom使用env(safe-area-inset-bottom)
      3. 触摸优化: -webkit-tap-highlight-color:transparent, touch-action:manipulation
      4. 禁止长按菜单: -webkit-touch-callout:none, -webkit-user-select:none
      5. 响应式布局: 使用 `min-height:100svh`，避免 `100vh` 抖动
      6. 字体适配: 使用宋体(Songti SC, serif)营造文化感

      ## 异常处理（必须实现）
      1. 加载状态: 全屏遮罩，点击拍照后立即显示，覆盖takePhoto等待期和AI分析期
      2. 相机取消: 静默处理，不显示错误
      3. AI服务异常: 显示错误提示，支持重试
      4. 图生图失败: 静默降级使用原图
      5. 返回格式兼容失败: 若 executeResult 非对象且字符串解析失败，则降级使用原始文本作为描述
      6. `imageUrl` 缺失时提示"拍照结果无有效图片，无法识别"
      7. 任何草稿放弃操作都不能影响已保存历史

      ## 输出前自检
      1. 首页 FAB 点击后直接拍照，只允许 loading 覆层；不要生成伪相机页或多层叠屏。
      2. 预览页和详情页的显隐只由统一页面状态控制；隐藏层不继续接收点击。
      3. 详情页根节点负责高度，信息卡片与底部操作条相对详情页排版，不挂到 viewport 乱漂。
      4. 装饰性封面、书页、扫描线不覆盖真正的操作按钮。
calorie-tracker:
  name: calorie-tracker
  description: 拍摄食物后AI识别并计算卡路里，生成手账风格的饮食记录卡片
  files:
  - path: SKILL.md
    content: |
      # AI卡路里计算器应用

      生成单文件HTML，运行在端侧WebView，已注入window.HarmonyBridge。

      ## 重要约束（必须遵守）
      1. 只用原生 HTML、CSS、JavaScript，禁止外部库。
      2. 禁止 demo/mock/sample 数据，禁止“默认菜品”“随机热量”兜底。
      3. 点击拍照后直接调用原生拍照，不要自造相机页或相册入口。
      4. 识图失败时不得生成记录；只有识别成功后才允许进入结果页。
      5. 备注编辑和“记录到卡片本”必须在同一结果页内完成，避免多页状态丢失。
      6. 禁止结果页出现大面积无意义留白；结果页内容必须从顶部自然排布，不能复用首页的整屏居中布局。

      ## 核心功能
      1. 拍摄食物 → AI识别菜名、预估热量
      2. 生成拍立得风格的饮食记录卡片
      3. 支持编辑备注（少油、去皮等）
      4. AI提供营养建议
      5. 历史记录统计每日摄入总热量

      ## 交互流程
      1. 首页：
         - 居中大卡片(拍立得效果)：美食封面图
         - 标题"一拍得" + 副标题"AI智能饮食手账"
         - 拍摄按钮 + 卡片本入口
      2. 拍照动作：直接唤起原生拍照，仅展示 loading
      3. 结果页：
         - 拍立得照片(右下角手写体热量数字)
         - 编辑区：食物名称、备注输入框
         - AI建议提示框
         - 底部大按钮"记录到卡片本"
      4. 历史页：
         - 深棕色背景
         - 顶部每日汇总(今日共摄入XXX kcal)
         - 拍立得卡片垂直堆叠(轻微旋转)
         - 点击卡片弹出详情弹窗
         - 底部清空按钮

      ## HarmonyBridge API（retCode=0成功）
      返回值兼容规则：优先按对象读取 executeResult；仅当 executeResult 是字符串时才尝试 JSON.parse，禁止无条件 JSON.parse(result.executeResult)。
      拍照: await window.HarmonyBridge.camera.takePhoto()
      返回: {retCode:0, executeResult:{base64, imageUrl, width, height}}
      识图入参必须使用 executeResult.imageUrl（若缺失则报错，禁止回退到 base64）

      识图: await window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
      prompt: '你是专业营养师。识别图片食物。返回JSON: {"dishName":"菜名","calories":热量数值,"suggestion":"30字内建议"}'
      返回: {retCode:0, executeResult:{dishName, calories, suggestion}}

      ## 推荐实现骨架
      1. 单一状态机：`idle | capturing | recognizing | editing | history`。
      2. `takePhoto` 成功后先校验 `imageUrl`，再调用识图。
      3. `calories` 必须转成数字并校验为有限值；无效时兜底为 `0`，但仍保留识别结果。
      4. 保存记录时写入 `{dishName, calories, suggestion, note, imageUrl, createdAt}`。
      5. 历史汇总只基于真实记录求和，不要预置今日摄入数字。
      6. 只允许首页是“纵向居中封面”; 结果页与历史页必须 `justify-content:flex-start`，禁止沿用首页 `home-view` 的居中样式。
      7. `min-height:100svh` 只放在应用外层容器，禁止给每个 `.view` 或结果页子容器都再加一层 `min-height:100vh`。
      8. 结果页、历史页都必须提供显式返回入口；点击“记录到卡片本”后进入历史页，也必须能一键回首页或结果页。

      ## UI设计规范
      整体风格: 温润的日系手账风 + 拟物化拍立得风格

      配色:
      - 背景色: 米色/奶油色#F2EFE6(纸张质感)
      - 历史页背景: 深棕色#5D4037(沉浸感)
      - 强调色: 焦糖橙#E67E22(重点数据和按钮)
      - 主文字: #2C2C2C
      - 次要文字: #888888

      首页布局:
      - 居中大卡片(轻微旋转-2deg)
      - 白色边框8px模拟拍立得
      - 封面图55%高度
      - 标题区：衬线体大标题 + 副标题
      - 按钮：深色圆角胶囊 + 阴影

      结果页:
      - 拍立得照片框(白色padding + 阴影 + 轻微旋转)
      - 热量数字：手写体(Bradley Hand风格)，浮在照片右下角
      - 编辑区：白底圆角卡片
      - AI建议：黄色背景提示框(#FFF8E1)
      - 底部按钮：焦糖橙色，圆角胶囊

      历史页:
      - 深棕色背景
      - 每日汇总：居中，手写体大数字(金色#FFCC80)
      - 卡片堆叠：白底拍立得，交替旋转(-1deg/1.5deg)
      - 卡片内容：图片+菜名+热量+备注+时间+AI标签
      - 详情弹窗：白底圆角，展示完整建议

      ## 关键实现
      1. **调用时检测Bridge（重要！）**：
         - 禁止在页面加载/初始化时检测：不要写 `if(window.HarmonyBridge)` 或 `const isNative = !!window.HarmonyBridge` 这样的初始化检测
         - 禁止定义全局的 `isNativeEnv` 变量
         - 正确做法：在每次调用API时使用可选链检测，因为Bridge是异步注入的
      2. **API封装示例（必须按此模式实现）**：
         - 先定义 `APP_ONLY_TOAST_TEXT` 与 `showAppOnlyToast()`，Bridge缺失时统一toast并中断
         ```javascript
         function getExecuteResult(res) {
           const value = res?.executeResult;
           if (value && typeof value === 'object') return value;
           if (typeof value === 'string') {
             try { return JSON.parse(value); } catch { return null; }
           }
           return null;
         }
         async function takePhoto() {
           // 每次调用时检测，不要提前检测
           if (window.HarmonyBridge?.camera?.takePhoto) {
             return await window.HarmonyBridge.camera.takePhoto();
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         async function recognizeFood(imageUrl) {
           if (window.HarmonyBridge?.ai?.invokeMultimodalModel) {
             return await window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         ```
      3. **Bridge缺失处理（必须）**：当Bridge不可用时，禁止任何Mock拍照/识图/朗读降级，统一toast提示："该功能暂无法使用，请在小艺APP内体验完整功能"。
      4. 拍立得效果: 白色padding + box-shadow + transform:rotate
      5. 手写体热量: font-family:'Bradley Hand','Chalkboard SE',cursive
      6. 卡片堆叠: 交替旋转角度，模拟真实照片堆叠
      7. 视图切换: CSS class控制显隐 + opacity过渡
         记录数仍限制20条防止溢出
      8. 每日统计: 遍历记录累加calories
      9. 详情弹窗: 半透明遮罩 + 居中白卡片 + fadeIn动画
      10. 结果页主内容区使用常规文档流，自上而下排布；如果底部有 fixed 操作栏，只允许加与按钮高度相当的 `padding-bottom`，禁止额外 80px 以上留白。
      11. 禁止通过 `.view.active { display:block } + .view { min-height:100vh }` 叠加把结果页撑满两屏；页面高度由外层壳和内容本身决定。

      ## 移动端适配（必须实现）
      1. viewport设置: width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover
      2. 安全区域适配: padding-top使用env(safe-area-inset-top), padding-bottom使用env(safe-area-inset-bottom)
      3. 触摸优化: -webkit-tap-highlight-color:transparent, touch-action:manipulation
      4. 禁止长按菜单: -webkit-touch-callout:none, -webkit-user-select:none
      5. 响应式布局: `max-width:480px` 居中，主容器使用 `min-height:100svh`
      6. 字体适配: 标题衬线体，数字手写体，正文系统字体

      ## 异常处理（必须实现）
      1. 加载状态: 全屏遮罩 + spinner，点击拍照后立即显示，覆盖takePhoto等待期和AI识别期
      2. 识别失败: 显示"无法识别该图片，请确保拍摄的是食物"
      3. 存储溢出: 自动删除最旧记录，提示"存储空间不足"
      4. 返回格式兼容失败: 先做类型判断再解析；若字符串解析失败，使用稳定兜底文案，禁止使用Mock菜品
      5. 清空确认: confirm弹窗"确定要清空所有记录吗？此操作无法撤销"

      ## 输出前自检
      1. 首页封面可以垂直居中，但结果页和历史页必须从顶部自然排布，不能复用首页整屏居中壳。
      2. 除应用外层外，不要再给 `.view`、结果页子容器、历史页子容器叠加 `min-height:100vh/100svh`。
      3. 拍照入口只有一个；不要再加相机页、相册兜底或第二个快门按钮。
      4. 底部保存按钮如果是 fixed，只补足一屏内必要的 `padding-bottom`，不要制造大面积留白。
artifact-wiki:
  name: artifact-wiki
  description: 拍摄文物后AI识别并生成文物百科卡片，支持分类筛选和语音朗读
  files:
  - path: SKILL.md
    content: |
      # 文物鉴赏图鉴应用

      生成单文件HTML，运行在端侧WebView，已注入window.HarmonyBridge。

      ## 重要约束（必须遵守）
      1. 只用原生 HTML、CSS、JavaScript，禁止外部库。
      2. 禁止任何 mock/demo/sample/演示模式数据；页面初始只能展示真实后端数据库历史或空状态。
      3. 点击拍照按钮后直接调用原生拍照；Bridge 缺失时只提示，不允许走 Web 文件上传或模拟识别。
      4. 详情必须使用稳定的翻转卡结构；正面是封面/大图，背面是详情与编辑区，交互效果要类似单词卡的 front/back 翻转。
      5. 编辑表单直接放在翻转卡背面，不允许“先翻转再点编辑再翻一次”这种二次切换链路。
      6. 删除和保存按钮必须在背面详情区直接可见且可点击，保存后立即刷新当前详情内容。
      7. 背面文案区和编辑表单必须分块展示，表单字段只能纵向堆叠，不允许横向挤压成多列小方块。
      8. 首页展示的卡片应使用图生图产生的风格化文物图片作为封面，而非原图。

      ## 核心功能
      1. 拍摄文物 → AI识别文物信息（名称、年代、材质、分类）
      2. 图生图生成风格化文物图鉴封面（失败时回退原图）
      3. 按类型分类筛选（青铜器/陶瓷/书画/玉器）
      4. 语音朗读文物介绍
      5. 详情翻转卡查看、编辑、删除完整信息

      ## 交互流程
      1. 首页：
         - 顶部：标题"一拍得·文物"
         - 筛选Tab：全部/青铜器/陶瓷/书画/玉器
         - 卡片列表：图片+名称+年代材质+简介
         - 底部：圆形拍照FAB按钮
      2. 拍照：仅调用原生相机
      3. 详情弹窗：
         - 全屏半透明遮罩 + 毛玻璃效果
         - 居中固定尺寸翻转卡：必须使用 `.flip-shell > .flip-card > .flip-face.front/.back`
         - 正面：封面大图 + 名称 + 年代标签 + “点击翻面查看详情”提示
         - 背面：简介、分类、朗读按钮、名称/年代/分类/简介编辑表单 + 保存/删除/返回正面按钮

      ## HarmonyBridge API（retCode=0成功）
      返回值兼容规则：优先按对象读取 executeResult；仅当 executeResult 是字符串时才尝试 JSON.parse，禁止无条件 JSON.parse(result.executeResult)。
      拍照: await window.HarmonyBridge.camera.takePhoto()
      返回: {retCode:0, executeResult:{base64, imageUrl, width, height}}
      识图入参必须使用 executeResult.imageUrl（若缺失则报错，禁止回退到 base64）

      识图: await window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
      prompt: '识别图中文物。返回JSON: {"name":"文物名称","era":"年代和材质","desc":"50字内简介","type":"分类(青铜器/陶瓷/书画/玉器/其他)"}'
      返回: {retCode:0, executeResult:{name, era, desc, type}}

      抠图: await window.HarmonyBridge.ai.segmentImage(imageUrl);
      返回: {retCode:0, executeResult:{base64}}

      图生图: await window.HarmonyBridge.ai.generateImage(imageUrl或base64, prompt)
      prompt: '将文物照片转为国风博物馆插画风：保留文物主体轮廓和细节，背景为温润米色宣纸质感，青铜/陶瓷材质要有柔和光泽，低饱和，不要文字水印'
      返回: {retCode:0, executeResult:{base64}}

      发音: await window.HarmonyBridge.tts.speak(text)

      ## 推荐实现骨架
      1. 维护 `viewState = list | capturing | detail`；不要再额外拆成靠 display 切换的 `view/edit` 双面板。
      2. 首页卡片点击打开详情；详情弹窗默认展示正面，点击卡片空白区或“查看详情”按钮翻到背面。
      3. 背面同时承担“查看详情 + 直接编辑”，用户修改字段后点击保存即可，不需要再切额外子状态。
      4. 删除操作删除当前项后关闭弹窗并刷新列表。
      5. 识图成功前绝对不要 `artifacts.unshift(...)`，避免出现用户未拍摄的文物卡片。
      6. 翻转动作必须复用单词卡那种稳定 3D 结构，不要用多个 `display:none/block` 面板伪装翻页。

      ## UI设计规范
      整体风格: 新中式博物馆风，典雅温润

      配色:
      - 背景色: 米色/宣纸色#FDF6E3
      - 卡片背景: 浅暖灰#F4EEDF
      - 主文字: 深褐灰#3E3832
      - 次要文字: 棕灰色#8A8478
      - 强调色: 青铜绿#5D6B5F
      - 年代标注: 朱砂红#8B3A3A

      首页布局:
      - 顶部Header：标题
      - 筛选Tab：横向滚动，胶囊按钮，激活时深色底
      - 卡片列表：flex布局，图片88x88圆角 + 右侧信息
      - 卡片信息：名称(18px粗体) + 年代(朱砂红) + 简介(2行截断)
      - 底部FAB：深色圆形 + 白色边框 + 内圆装饰

      详情弹窗:
      - 全屏遮罩：rgba(0,0,0,0.85) + backdrop-filter:blur(5px)
      - 翻转卡：宽度 88%，max-width 360px，高度固定 72vh 左右，不要 auto 高度
      - 正面：大图、名称、年代、轻提示文案，视觉像博物馆卡片封面
      - 背面：上部简介卡片 + 分类信息 + 朗读按钮 + 纵向表单区 + 固定底部操作按钮
      - 所有按钮放在背面底部固定区域，避免点击表单时误翻转

      ## 关键实现
      1. **调用时检测Bridge（重要！）**：
         - 禁止在页面加载/初始化时检测：不要写 `if(window.HarmonyBridge)` 或 `const isNative = !!window.HarmonyBridge` 这样的初始化检测
         - 禁止定义全局的 `isNativeEnv` 变量
         - 正确做法：在每次调用API时使用可选链检测，因为Bridge是异步注入的
      2. **API封装示例（必须按此模式实现）**：
         - 先定义 `APP_ONLY_TOAST_TEXT` 与 `showAppOnlyToast()`，Bridge缺失时统一toast并中断
         ```javascript
         function getExecuteResult(res) {
           const value = res?.executeResult;
           if (value && typeof value === 'object') return value;
           if (typeof value === 'string') {
             try { return JSON.parse(value); } catch { return null; }
           }
           return null;
         }
         async function takePhoto() {
           // 每次调用时检测，不要提前检测
           if (window.HarmonyBridge?.camera?.takePhoto) {
             return await window.HarmonyBridge.camera.takePhoto();
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         async function recognizeArtifact(imageUrl) {
           if (window.HarmonyBridge?.ai?.invokeMultimodalModel && window.HarmonyBridge?.ai?.segmentImage) {
             return await Promise.all([
                        // 抠图函数，输出Json内容为{retCode:0, executeResult:{base64}}
                        window.HarmonyBridge.ai.segmentImage(imageUrl),
                        // 模型识别，输出Json内容为{retCode:0, executeResult:{name, era, desc, type}}
                        window.HarmonyBridge.ai.invokeMultimodalModel(imageUrl, prompt)
                    ]);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         //这里的base64为抠图后输出的空白背景的base64，仅保留主体，方便后续转换为风格化的图片
         async function generateStylizedImage(base64) {
           if (window.HarmonyBridge?.ai?.generateImage) {
             return await window.HarmonyBridge.ai.generateImage(base64, stylePrompt);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         async function speak(text) {
           if (window.HarmonyBridge?.tts?.speak) {
             return await window.HarmonyBridge.tts.speak(text);
           } else {
             showAppOnlyToast(); throw new Error(APP_ONLY_TOAST_TEXT);
           }
         }
         ```
      3. **Bridge缺失处理（必须）**：当Bridge不可用时，禁止任何 Mock 拍照、识图、图生图、TTS、文件上传、演示数据降级，统一toast提示："该功能暂无法使用，请在小艺APP内体验完整功能"。
      4. 筛选功能: 按type字段过滤数组
      5. 弹窗动画: `display:flex + opacity过渡 + transform:translateY`
      6. 图片展示: `object-fit:contain` 完整显示
      7. 类型校验: `checkType` 函数确保 `type` 在预设范围内
      8. 图生图失败: 静默降级使用原图，不中断主流程
      9. 首页无记录时显示空状态，不允许预置司母戊鼎、兵马俑等演示卡片

      ## 移动端适配（必须实现）
      1. viewport设置: width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover
      2. 安全区域适配: padding-top使用env(safe-area-inset-top), padding-bottom使用env(safe-area-inset-bottom)
      3. 触摸优化: -webkit-tap-highlight-color:transparent, touch-action:manipulation
      4. 禁止长按菜单: -webkit-touch-callout:none, -webkit-user-select:none
      5. 响应式布局: 使用百分比和vw/vh单位
      6. 字体适配: 使用宋体(Songti SC, serif)营造文化感

      ## 异常处理（必须实现）
      1. 加载状态: 全屏遮罩 + 旋转spinner，点击拍照后立即显示，覆盖takePhoto等待期和AI识别期
      2. 相机取消: 静默处理，隐藏loading
      3. AI服务异常: 显示全屏错误页 + 重试按钮
      4. 图生图失败: 静默降级使用原图
      5. 返回格式兼容失败: 若 executeResult 非对象且字符串解析失败，则降级使用原始文本作为描述
      6. 编辑保存失败: 保持在编辑态，不要自动关闭弹窗

      ## 输出前自检
      1. 翻转卡背面的保存/删除/返回按钮区域必须稳定可点；装饰层和毛玻璃遮罩不拦截这些操作。
      2. 拍照入口只保留首页 FAB 一个；详情弹窗、翻面、筛选切换都不会再次触发 `takePhoto()`。
      3. 翻转卡高度固定，背面表单纵向堆叠；不要为了视觉装饰再叠额外隐藏面板。
      4. 所有详情按钮、弹窗根节点、筛选标签 `id` 唯一，避免显隐和点击串线。
chinese-checkers-html-builder:
  name: chinese-checkers-html-builder
  description: |
    生成跳棋时可参考本skill。专用于生成可在移动端浏览器完美运行的HTML5跳棋游戏，适配手机竖屏，包含完整逻辑（连跳、AI、回退）。
  files:
  - path: SKILL.md
    content: |
      # 1. 核心规范

      为了保证游戏在手机上完美运行，请严格遵守以下技术规范：
      ## 核心架构与渲染
      - **单文件交付**：HTML, CSS, JS 全部包含在一个文件中。
      - **渲染引擎**：必须使用 `<canvas>` 进行渲染，不要使用大量的 DOM 元素，以保证移动端的流畅度和对齐精度。
      - **响应式布局**：
      - 使用 `<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">` 禁止缩放。
      - Canvas 宽度应自适应屏幕宽度（`window.innerWidth`），高度自动计算。
      - 交互按钮（悔棋、重开、模式切换）需固定在底部或顶部，高度至少 44px 以适应手指点击。

      ## 棋盘坐标系统（重要）
      - 跳棋是六角星形棋盘，**严禁**使用直角坐标系（x,y 矩阵）。
      - **必须使用**【轴向坐标系 (Axial Coordinates)】或【立方体坐标系 (Cube Coordinates)】。
        - 推荐轴向坐标 `(q, r)`。
        - 像素转换公式参考：
        `x = size * 3/2 * q`
        `y = size * sqrt(3) * (r + q/2)`
      - 棋盘数据结构应为一个 Map 或 2D 数组，存储每个坐标点的状态（空、玩家1、玩家2）。

      ## 游戏逻辑要求
      - **基本移动**：移动到相邻空位。
      - **跳跃逻辑（难点）**：
      - 必须支持**隔子跳**。
      - 必须支持**连续跳跃（Chain Jump）**。
      - 在玩家选中棋子后，需高亮显示所有可到达的位置（包括通过连跳到达的位置）。
      - 使用递归或 BFS (广度优先搜索) 来计算所有合法的连跳落点。
      - **胜利条件**：当一方所有棋子全部进入对角的目标区域时获胜。

      ## 功能模块
      - **模式选择**：提供“人人对战”和“人机对战”切换开关。
      - **AI 算法（人机模式）**：
        - 简单的贪心算法 + 距离评估。
        - AI 总是优先选择能让自己棋子最接近目标角落的移动路径。
        - 避免 AI 思考时间过长导致浏览器卡顿。
      - **状态管理**：
      - **悔棋 (Undo)**：使用栈（Stack）记录每一步后的棋盘快照（Deep Copy），点击悔棋时弹栈。
      - **重新开始**：重置棋盘和所有变量。

      ## 交互体验
      - **点击判定**：计算触摸点与每个棋子中心的欧几里得距离，小于半径则判定为选中。
      - **视觉反馈**：
      - 选中棋子时显示光圈。
      - 可移动路径显示小圆点提示。
      - 移动时要有简单的平滑动画（可选，若实现困难可直接瞬移，但必须更新画面）。

      # 2. 核心代码参考

      ## A. 六角网格坐标与构建

      构建逻辑参考如下：

      ```javascript
      // 轴向坐标系设置
      const HEX_SIZE = 15; // 六边形半径
      // 六角星的逻辑地图：key 为 "q,r", value 为 playerID (0:空, 1:P1, 2:AI/P2)
      let boardMap = new Map();

      // 初始化标准的六角星棋盘 (以中心为0,0)
      function initBoard() {boardMap.clear();
        // 遍历生成六角星形状 (半径为4的六角星通常范围是 -4 到 4)
        // 这里使用一个简化的生成逻辑，判定坐标是否在星形内
        for (let q = -4; q <= 4; q++) {
            for (let r = -4; r <= 4; r++) {
                let s = -q - r;
                // 判断是否在六角星范围内
                if (Math.abs(q) <= 4 && Math.abs(r) <= 4 && Math.abs(s) <= 4) {
                     // 进一步裁剪掉多余的角，只保留星形
                     // 逻辑：如果距离中心太远则不是星形的一部分，或者使用特定区域判定
                     if (isValidHex(q, r, s)) {
                         // 设置初始棋子位置
                         let player = 0;
                         if (q === 0 && r <= -5) player = 0; // 修正逻辑根据实际星形大小
                         // 简单示例：P1在底部(r=4), P2在顶部(r=-4)
                         if (r > 1 && q+r > 1) player = 1; // 底部三角
                         if (r < -1 && q+r < -1) player = 2; // 顶部三角

                         boardMap.set(`${q},${r}`, player);
                     }
                }
            }
        }
      }

      // 像素转换
      function hexToPixel(q, r) {
        const x = canvas.width/2 + HEX_SIZE * 3/2 * q;
        const y = canvas.height/2 + HEX_SIZE * Math.sqrt(3) * (r + q/2);
        return {x, y};
      }
      ```

      ## B. 寻路与连跳逻辑

      这是最容易出 Bug 的地方。提供BFS连跳逻辑供参考：

      ```javascript
      function getPossibleMoves(startQ, startR, board) {
        let moves = new Set(); // 存储 "q,r" 字符串
        let directions = [
            {dq: 1, dr: 0}, {dq: 1, dr: -1}, {dq: 0, dr: -1},
            {dq: -1, dr: 0}, {dq: -1, dr: 1}, {dq: 0, dr: 1}
        ];

        // 1. 检查相邻移动 (仅一步，不能连续)
        directions.forEach(d => {
            let nq = startQ + d.dq;
            let nr = startR + d.dr;
            if (board.has(`${nq},${nr}`) && board.get(`${nq},${nr}`) === 0) {
                moves.add(`${nq},${nr}`);
            }
        });

        // 2. 检查跳跃 (递归或广度搜索)
        // visited用于防止无限循环跳跃
        let visited = new Set();
        visited.add(`${startQ},${startR}`);

        let queue = [{q: startQ, r: startR}];

        while(queue.length > 0) {
            let curr = queue.shift();

            directions.forEach(d => {
                // 检查跳跃：相邻位置有子，且对称位置为空
                let midQ = curr.q + d.dq;
                let midR = curr.r + d.dr;
                let jumpQ = curr.q + d.dq * 2;
                let jumpR = curr.r + d.dr * 2;

                let midKey = `${midQ},${midR}`;
                let jumpKey = `${jumpQ},${jumpR}`;

                // 逻辑：中间有子 且 落点在棋盘内 且 落点为空 且 未访问过
                if (board.has(midKey) && board.get(midKey) !== 0 &&
                    board.has(jumpKey) && board.get(jumpKey) === 0 &&
                    !visited.has(jumpKey)) {

                    visited.add(jumpKey);
                    moves.add(jumpKey); // 添加合法落点
                    queue.push({q: jumpQ, r: jumpR}); // 入队继续检测连跳
                }
            });
        }

        return Array.from(moves).map(str => {
            let [q, r] = str.split(',').map(Number);
            return {q, r};
        });
      }
      ```

      ## C. 简单的AI决策

      ```javascript
      function makeAIMove() {
        // 目标：P2的目标是底部 (假设目标中心是 q=0, r=4)
        // 简单的启发式：落点距离目标越近，分数越高
        let bestScore = -Infinity;
        let bestMove = null;
        let aiPieces = []; // 获取所有AI棋子坐标

        // 遍历棋盘找到所有P2棋子...

        for (let piece of aiPieces) {
            let moves = getPossibleMoves(piece.q, piece.r, boardMap);
            for (let move of moves) {
                // 计算移动后的距离增益
                let currentDist = getDistanceToTarget(piece.q, piece.r);
                let nextDist = getDistanceToTarget(move.q, move.r);
                // 基础分：距离减少量
                let score = currentDist - nextDist;

                // 策略：尽量往前走，鼓励长距离跳跃
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = {from: piece, to: move};
                }
            }
        }

        if (bestMove) {
            executeMove(bestMove.from, bestMove.to);
        }
      }
      ```

      ## D. 移动端触控处理

      防止 Canvas 上的点击坐标偏移：

      ```javascript
      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault(); // 防止滚动
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;

        handleInput(x, y); // 处理游戏逻辑
      }, {passive: false});
      ```
gomoku-html-generator:
  name: gomoku-html-generator
  description: |
    生成五子棋时可参考本skill。专用于生成可在移动端浏览器完美运行的HTML5五子棋游戏。要求代码单一文件（Single-file HTML）、响应式布局、包含完整游戏逻辑（胜负判定、简单的评分式AI）及交互功能。
  files:
  - path: SKILL.md
    content: |
      **核心指令/约束条件：**

      1.  **移动端适配 (Critical)：**
      *   必须包含 `<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">` 以禁止缩放。
      *   Canvas 宽度应动态计算（例如屏幕宽度的 90% - 95%），高度自适应。
      *   CSS 中必须设置 canvas `{ touch-action: none; }` 以防止在棋盘上操作时触发页面滚动。
      *   棋盘点击/触摸事件需处理 Canvas 的 `getBoundingClientRect()` 偏移，确保落子位置准确。

      2.  **游戏逻辑：**
      *   棋盘标准为 **15x15** 线。
      *   数据结构使用二维数组 `board[15][15]`，0表示空，1表示黑（玩家），2表示白（AI/玩家2）。
      *   **胜负判定：** 每次落子后，检查横、竖、左斜、右斜四个方向是否有连续5子。

      3.  **功能实现：**
      *   **人人/人机切换：** 提供按钮切换模式。默认人机。
      *   **AI 算法：** 不要使用复杂的极大极小值算法（容易写错或导致卡顿），**强制使用“位置评分法”**。即遍历所有空位，计算该点对自己和对手的“威胁度/价值”，选择分数最高点落子。
      *   **悔棋 (Undo)：** 使用一个栈（Array）记录每一步的坐标 `{x, y, role}`。悔棋时 `pop` 最近的一步（人人）或两步（人机），并清空棋盘对应位置，重新绘制。
      *   **重新开始：** 重置数组和标志位，清空画布，重绘网格。

      4.  **视觉与交互：**
      *   背景色建议使用 `#DEB887` (木纹色)。
      *   落子要有简单的UI提示（如显示最后一手的位置）。
      *   使用 `requestAnimationFrame` 优化渲染（可选，但推荐）。

      ---

      ### 核心代码参考

      #### 1. 移动端 Canvas 初始化与坐标转换
        这是最容易写错的地方，导致点击位置漂移。参考代码如下：

      ```javascript
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const GRID_SIZE = 15;
      let CELL_SIZE; // 动态计算
      let offset;    // 边距

      function resize() {
        // 移动端适配核心：让 canvas 宽度占屏幕绝大部分
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
        canvas.width = size;
        canvas.height = size;
        // 留出半个格子的边缘
        CELL_SIZE = size / GRID_SIZE;
        offset = CELL_SIZE / 2;
        drawBoard(); // 重新绘制
      }

      // 转换触摸/点击坐标为数组索引
      function getClickIndex(e) {
        const rect = canvas.getBoundingClientRect();
        // 兼容 touch 和 mouse 事件
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        // Math.round 确保点击格子附近也能吸附
        const col = Math.round((x - offset) / CELL_SIZE);
        const row = Math.round((y - offset) / CELL_SIZE);

        if (col < 0 || col >= GRID_SIZE || row < 0 || row >= GRID_SIZE) return null;
        return { row, col };
      }
      ```

        #### 2. 人机对战逻辑
        生成Minimax算法经常会出现递归深度过深导致浏览器崩溃，或者评估函数写错。推荐使用基于权重的贪心算法。参考代码如下：

        ```javascript
        // 简单的评分权重
      const scoreTable = {
          "11111": 100000, // 连五
          "011110": 10000, // 活四
          "011112": 1000,  // 冲四 (被堵一边)
          "01110": 1000,   // 活三
          "011010": 500,   // 跳活三
          "001112": 100,   // 眠三
          // ... 可以自行补充更多模式
      };

      // 这里的 role: 2 是电脑(白), 1 是玩家(黑)
        function computerMove() {
          let maxScore = -1;
          let bestPoints = [];

          // 遍历所有空位
          for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c] !== 0) continue;

          // 评估该点：既要考虑自己进攻(attack)，也要考虑拦截玩家(defend)
          // 通常防守的分数要给高一点，防止电脑"贪吃"输掉
          let attackScore = evaluatePoint(r, c, 2);
          let defendScore = evaluatePoint(r, c, 1);

          // 综合评分，防守权重稍微大一点点
          let currentScore = attackScore + defendScore * 1.2;

          if (currentScore > maxScore) {
            maxScore = currentScore;
            bestPoints = [{r, c}];
          } else if (currentScore === maxScore) {
            bestPoints.push({r, c});
            }
          }
        }

        // 从最佳点中随机选一个，避免AI走法太死板
        if (bestPoints.length > 0) {
          const move = bestPoints[Math.floor(Math.random() * bestPoints.length)];
          placePiece(move.r, move.c, 2);
        }
      }

        // 核心评估函数
        // 检查该点在四个方向上能形成什么棋型，累加分数
        function evaluatePoint(row, col, role) {
          let score = 0;
          // 模拟落子
          board[row][col] = role;
          // 检查4个方向：横、竖、左斜、右斜
          // 提取线条字符串，例如 "01112"
          // 匹配 scoreTable
          // ... (具体实现略)

          // 还原
          board[row][col] = 0;
          return score;
      }
        ```

        #### 3. 悔棋逻辑 (Undo)
        人机对战的悔棋需要特殊处理（撤销两步），人人对战撤销一步。

        ```javascript
        let history = []; // 栈：[{r, c, role}, ...]

        function undo() {
          if (history.length === 0) return;

          if (isPvE) {
            // 人机模式，如果当前轮到玩家下（说明电脑刚下完），通常不允许在电脑思考时悔棋
            // 如果游戏结束了或者轮到玩家下，悔棋通常意味着要悔掉【玩家的一步 + 电脑的一步】
            // 或者简单的逻辑：只要 history >= 2 就弹两次
            if (history.length >= 2) {
              let last = history.pop();
              board[last.r][last.c] = 0;
              last = history.pop();
              board[last.r][last.c] = 0;
            }
        } else {
          // 人人模式，回退一步
          let last = history.pop();
          board[last.r][last.c] = 0;
          // 切换回上一个下棋的人
          currentPlayer = (currentPlayer === 1) ? 2 : 1;
      }
        drawBoard(); // 重绘
        drawPieces(); // 重绘所有棋子
        gameOver = false;
      }
        ```
military-chess-html-generator:
  name: military-chess-html-generator
  description: |
    生成军棋/陆战棋时可参考本skill。专用于生成可在移动端浏览器完美运行的HTML5军棋游戏。
  files:
  - path: SKILL.md
    content: |
      # Skill: 军棋 (Land Battle Chess) HTML Game

      ## 1. 游戏概述
        生成一个可在手机浏览器运行的单HTML文件军棋游戏，包含人机对战模式。

      ## 2. 棋盘结构 (Critical)

      ### 2.1 棋盘拓扑
      - 棋盘为 5列(0-4) × 12行(0-11) 的网格
      - 行0-5 属于上方玩家(红方/先手)，行6-11 属于下方玩家(蓝方/后手)
      - 行5和行6之间有"山界"分隔（纯视觉，不占行号）
      - 总共60个位置节点

      ### 2.2 特殊位置 - 行营(Camp) - 5个/方，共10个
      行营坐标（棋子在行营中不可被攻击）:
        - 上方: (1,1),(3,1),(2,2),(1,3),(3,3)
        - 下方: (1,8),(3,8),(2,9),(1,10),(3,10)

      ### 2.3 特殊位置 - 大本营(HQ) - 2个/方，共4个
      大本营坐标（军旗必须放在大本营，大本营中的棋子不能移动[军旗本身不能动]）:
        - 上方: (1,0),(3,0)
        - 下方: (1,11),(3,11)

        ### 2.4 路线类型

        #### 公路(Road)
        - 棋盘内部非铁路的连接线段
        - 所有棋子在公路上每次只能移动一步（上下左右或对角线到行营）

      #### 铁路(Railroad)
      铁路线位置:
        - 左侧纵线: 列0, 行1到行10
        - 右侧纵线: 列4, 行1到行10
        - 上方横线: 行1, 列0到列4
        - 下方横线: 行10, 列0到列4
        - 中间上横线: 行5, 列0到列4
        - 中间下横线: 行6, 列0到列4

      铁路规则:
        - 非工兵：在铁路上可以沿铁路直线行走任意步（不能拐弯，中间不能有棋子）
        - 工兵：在铁路上可以沿铁路任意拐弯行走（中间不能有棋子，BFS寻路）

      ### 2.5 连接关系（邻接表）
        除了常规上下左右连接外，行营有斜线连接：
      - 行营(1,1)连接: (0,0),(2,0),(0,2),(2,2)  [斜向]
      - 行营(3,1)连接: (2,0),(4,0),(2,2),(4,2)  [斜向]
      - 行营(2,2)连接: (1,1),(3,1),(1,3),(3,3)  [斜向]
      - 行营(1,3)连接: (0,2),(2,2),(0,4),(2,4)  [斜向]
      - 行营(3,3)连接: (2,2),(4,2),(2,4),(4,4)  [斜向]
      - 下方行营同理(y+7): (1,8),(3,8),(2,9),(1,10),(3,10)

      ## 3. 棋子系统

      ### 3.1 棋子配置（每方）
        | 棋子   | 数量 | 等级 |
        |--------|------|------|
        | 司令   | 1    | 9    |
        | 军长   | 1    | 8    |
        | 师长   | 2    | 7    |
        | 旅长   | 2    | 6    |
        | 团长   | 2    | 5    |
        | 营长   | 2    | 4    |
        | 连长   | 3    | 3    |
        | 排长   | 3    | 2    |
        | 工兵   | 3    | 1    |
        | 炸弹   | 2    | 0    |
        | 地雷   | 3    | -1   |
        | 军旗   | 1    | -2   |
        合计每方25枚

      ### 3.2 棋子约束
      - 地雷：只能放在后两行（己方最后2行），不能移动
      - 军旗：必须放在大本营中，不能移动
      - 炸弹：不能放在第一行（最前线）

      ### 3.3 吃子规则
      - 大吃小：等级高的吃等级低的，大的留下
      - 同级：同归于尽，双方都移除
      - 炸弹：与任何棋子（除军旗）同归于尽
      - 地雷：任何棋子撞地雷同归于尽，但工兵挖地雷则地雷消失工兵存活
      - 军旗：任何棋子都可以扛军旗，扛到军旗则获胜

      ### 3.4 胜负条件
      - 扛掉对方军旗 → 获胜
      - 对方所有可移动棋子被消灭 → 获胜（对方只剩地雷和军旗）
      - 无棋可走 → 判负

      ## 4. 移动规则详解

      ### 4.1 普通移动(公路)
        只能向相邻节点移动一步（包括行营的斜线连接）

      ### 4.2 铁路移动
      铁路节点判定函数:
        ```javascript
        function isOnRailroad(x, y) {
        if (x === 0 && y >= 1 && y <= 10) return true;  // 左侧纵线
        if (x === 4 && y >= 1 && y <= 10) return true;  // 右侧纵线
        if (y === 1 && x >= 0 && x <= 4) return true;   // 上横线
        if (y === 5 && x >= 0 && x <= 4) return true;   // 中上横线
        if (y === 6 && x >= 0 && x <= 4) return true;   // 中下横线
        if (y === 10 && x >= 0 && x <= 4) return true;  // 下横线
        return false;
      }
        ```

      ### 4.3 不可移动棋子
      - 地雷、军旗不能移动

      ### 4.4 行营保护
      - 行营中的棋子不能被任何棋子攻击
      - 但行营中的棋子可以主动出击

      ## 5. UI设计要求（手机优先）

      ### 5.1 布局
      - 采用竖屏布局，棋盘占据主要区域
      - 棋盘上方显示对手信息，下方显示己方信息
      - 底部工具栏：模式切换、悔棋、重新开始
      - 使用CSS Grid或精确计算实现棋盘

      ### 5.2 棋盘绘制
      - 使用Canvas绘制棋盘线路和棋子
      - 棋盘底色浅黄/木色
      - 铁路线用双线(粗线)表示，公路用单线(细线)表示
      - 行营用三角/圆形虚线标记
      - 大本营用斜线标记
      - 山界区域显示文字"* 山 界 *"

      ### 5.3 棋子样式
      - 圆角矩形或圆形棋子
      - 红方：红底白字 / 蓝方：蓝底白字
      - 棋子大小适配手机触控（最小44px）
      - 选中棋子高亮显示（发光/边框）
      - 可移动位置显示提示点

      ### 5.4 交互
      - 点击选中己方棋子 → 高亮可移动位置 → 点击目标位置移动
      - 点击已选中棋子取消选中
      - 支持触摸事件(touch)，防止300ms延迟
      - 添加 touch-action: manipulation 和 viewport meta

      ### 5.5 动画效果
      - 棋子移动动画(200ms)
      - 吃子动画(闪烁/爆炸效果)
      - 胜负弹窗动画

      ## 6. 人机对战AI

      ### 6.1 AI策略(中等难度)
      使用评分系统:
        - 能吃子：优先吃高价值棋子
        - 保护军旗：军旗周围保持防守
        - 地雷防线：保持地雷阵型完整性
        - 工兵价值：后期工兵价值提升（用于排雷扛旗）
        - 进攻权重：司令军长优先进攻
        - 威胁评估：避免高价值棋子送死

      ### 6.2 AI走棋流程
        1. 遍历所有可移动棋子
        2. 对每个棋子遍历所有合法移动
        3. 对每个移动计算评分
        4. 选择最高分的移动（加少量随机性）
        5. 使用setTimeout延迟执行，给用户反馈感

      ## 7. 功能要求

      ### 7.1 游戏模式
      - 人机对战（玩家执蓝方/下方；电脑隐藏棋子，对玩家不可见）

      ### 7.2 布阵
      - 提供默认布阵（预设几种经典阵型随机选择）
      - 人机模式下AI自动布阵

      ### 7.3 悔棋
      - 记录每步操作到历史栈
      - 悔棋恢复上一步状态
      - 人机模式悔棋需要撤回两步（己方+AI）

      ### 7.4 重新开始
      - 确认对话框
      - 重置所有状态

      ### 7.5 音效(可选)
      - 使用Web Audio API生成简单音效
      - 移动音、吃子音、胜利音

      ## 8. 技术规范

      ### 8.1 单文件HTML
      - 所有CSS、JS内联
      - 不依赖外部资源
      - 总代码量控制合理

      ### 8.2 手机适配
        ```html
        <meta name="viewport" content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">
        ```
      - 使用 vw/vh/vmin 响应式单位
      - CSS适配安全区域 env(safe-area-inset-*)
      - 禁止双击缩放、长按菜单

      ### 8.3 性能
      - Canvas离屏渲染
      - requestAnimationFrame动画
      - 避免频繁DOM操作
      - 事件委托
weiqi-html-generator:
  name: weiqi-html-generator
  description: |
    生成围棋时可参考本skill。专用于生成适配移动端浏览器的HTML5围棋游戏，包含完整规则逻辑与基础AI。
  files:
  - path: SKILL.md
    content: |
      # 1. **核心指令/约束条件**

      当用户请求生成围棋游戏时，请严格遵守以下开发规范：

      **A. 移动端适配:**
      *   **Meta标签**: 必须包含 `<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">` 以禁止缩放。
      *   **布局**: 使用 `Flexbox` 垂直布局。Canvas必须是正方形，宽度应为 `Math.min(window.innerWidth, window.innerHeight) - 20` (留出边距)。
      *   **交互**:
            *   监听 `canvas` 的 `click` 或 `touchstart` 事件。
            *   必须使用 `event.preventDefault()` 防止触摸时的页面滚动。
            *   落子位置计算需考虑 Canvas 在屏幕的 `getBoundingClientRect()` 偏移量。
            *   **落子吸附**: 触摸点需自动“吸附”到最近的棋盘交叉点，判断距离阈值（通常为格子的一半）。

      **B. 绘图渲染:**
      *   背景色推荐使用木纹色 (`#DEB887` 或 `#E3CF57`)。
      *   棋盘线格通常为 `19x19` (标准)、`13x13` 或 `9x9` (适合手机快速局)。
      *   **关键点**: 棋子必须画在**交叉点**上，而不是格子中间。
      *   **高清屏支持**: 处理 `window.devicePixelRatio`，否则线条在手机上会模糊。

      **C. 核心游戏逻辑:**
      *   **数据结构**: 使用二维数组 `board[19][19]` 存储状态 (0:空, 1:黑, 2:白)。
      *   **核心算法**: 每次落子后，必须执行 **"提子检查" (Capture Check)**。
            *   算法：基于 `Flood Fill` (泛洪/DFS) 寻找棋子所在的连通块（Group）。
            *   计算该连通块的“气” (Liberties)。如果气为0，则移除该颜色棋子。
            *   **顺序**: 先检查对手是否被提子，再检查自己是否自杀（无气禁入）。
      *   **打劫 (Ko)**: 简单的全局同形判断，防止立即下回刚才被提的位置。

      **D. 功能模块:**
      *   **AI (PvE)**:
        *   **Level 1**: 随机合法落子。
          *   **Level 2**: 贪婪算法（优先吃子、优先逃跑、优先占角）。*推荐使用贪婪算法作为默认AI*。
      *   **悔棋 (Undo)**: 使用栈 (Stack) 保存每一步的棋盘快照 (`JSON.stringify(board)`)。
      *   **重开 (Restart)**: 重置数组和UI。

      ---
      # 2. 核心代码参考

      核心参考以下代码逻辑，特别是 `checkLiberties` 和 `handleMove` 部分。
      ```javascript
      /*
      * 围棋核心逻辑参考片段
      * 包含：气数计算、提子、简单的贪婪AI
      */
      const BOARD_SIZE = 9; // 手机端建议默认9路或13路，19路太小难点
      let board = []; // 0:Empty, 1:Black, 2:White
      let history = []; // 用于悔棋
      let currentPlayer = 1;
      let isAiEnabled = true;
      // 初始化棋盘
      function initBoard() {
        board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
        history = [];
        currentPlayer = 1;
        drawBoard();
      }
      // 核心：计算一个棋子所在群组的气
      // 返回：{ liberties: number, group: Array<{x, y}> }
        function getGroupLiberties(x, y, color) {
        let group = [];
        let liberties = new Set(); // 使用Set去重
        let visited = new Set();
        let queue = [{x, y}];

        visited.add(`${x},${y}`);
        group.push({x, y});

        while (queue.length > 0) {
            let curr = queue.pop();
            const directions = [[0, 1], [0, -1], [1, 0], [-1, 0]];

            for (let d of directions) {
                let nx = curr.x + d[0];
                let ny = curr.y + d[1];

                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    if (board[ny][nx] === 0) {
                        liberties.add(`${nx},${ny}`);
                    } else if (board[ny][nx] === color && !visited.has(`${nx},${ny}`)) {
                        visited.add(`${nx},${ny}`);
                        queue.push({x: nx, y: ny});
                        group.push({x: nx, y: ny});
                    }
                }
            }
        }
        return { liberties: liberties.size, group: group };
      }
        // 尝试落子逻辑
        function playMove(x, y) {
            if (board[y][x] !== 0) return false; // 已有子

           // 1. 临时落子
           board[y][x] = currentPlayer;
           let opponent = currentPlayer === 1 ? 2 : 1;
           let capturedStones = [];

           // 2. 检查周围对手棋子是否气尽（提子）
           const directions = [[0, 1], [0, -1], [1, 0], [-1, 0]];
           for (let d of directions) {
              let nx = x + d[0];
              let ny = y + d[1];
              if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
              if (board[ny][nx] === opponent) {
                let result = getGroupLiberties(nx, ny, opponent);
              if (result.liberties === 0) {
                capturedStones.push(...result.group);
              }
            }
          }
        }

        // 3. 执行提子
        if (capturedStones.length > 0) {
          for (let stone of capturedStones) {
          board[stone.y][stone.x] = 0;
        }
        } else {
          // 4. 如果没有提子，检查自己是否气尽（自杀禁手）
          // 注意：这里简化了规则，通常不允许自杀，除非这一步能提对方子
          let selfRes = getGroupLiberties(x, y, currentPlayer);
          if (selfRes.liberties === 0) {
            board[y][x] = 0; // 撤销
            alert("禁着点：无法气尽自杀");
            return false;
          }
        }

        // 5. 记录历史 (Deep Copy)
        // 简单的打劫判断：如果局面和上一手完全一样，则是打劫（这里简化处理，只比对一步）
        if (history.length > 0) {
             let lastState = history[history.length - 1];
        // 这里应进行完整的数组比对，为节省Token略写
        }

        history.push(JSON.parse(JSON.stringify(board))); // 保存快照

        // 6. 切换玩家
        currentPlayer = opponent;
        drawBoard();

        // 7. 触发AI
        if (isAiEnabled && currentPlayer === 2) {
          setTimeout(aiMove, 500);
        }
        return true;
      }
      // 简单的启发式AI
      function aiMove() {
         let bestMove = null;
         let maxScore = -9999;

         // 遍历所有空点打分
          for(let y=0; y<BOARD_SIZE; y++) {
             for(let x=0; x<BOARD_SIZE; x++) {
                 if(board[y][x] === 0) {
                     let score = Math.random() * 10; // 基础随机分
                    // 启发式逻辑：
                    // 1. 如果下了这步能吃对方子 -> 极大加分
                    // 2. 如果下了这步自己的气变多了 -> 加分
                    // 3. 靠近天元或星位 -> 加分

                    // 模拟落子检测提子
                    // (此处需要简化的模拟逻辑，为保持代码简洁略)

                    if (score > maxScore) {
                      maxScore = score;
                       bestMove = {x, y};
                    }
                  }
                }
              }

      if (bestMove) {
        playMove(bestMove.x, bestMove.y);
      } else {
        alert("AI无法落子 (双虚/填满)");
        }
      }
      ```
      ---
      # 3. 渲染样式

      可参考如下渲染逻辑，解决手机模糊和触摸问题：
      ```javascript
      // 画布适配代码范式
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
          // 留出底部控制栏空间
          const size = Math.min(window.innerWidth, window.innerHeight - 150);
          // 解决高清屏模糊问题
          const dpr = window.devicePixelRatio || 1;

          canvas.style.width = size + "px";
          canvas.style.height = size + "px";
          canvas.width = size * dpr;
          canvas.height = size * dpr;

          ctx.scale(dpr, dpr);

          // 全局变量更新
          cellSize = size / BOARD_SIZE;
          stoneRadius = cellSize * 0.4;
          drawBoard();
      }
      // 触摸事件处理
      canvas.addEventListener('touchstart', (e) => {
          e.preventDefault(); // 关键！
          const rect = canvas.getBoundingClientRect();
          const touch = e.touches[0];
          const x = touch.clientX - rect.left;
          const y = touch.clientY - rect.top;

          // 转换为网格坐标 (0 ~ N-1)
          // 加上0.5的偏移量让点击更加符合直觉
          const i = Math.floor(x / cellSize);
          const j = Math.floor(y / cellSize);

          if (i >= 0 && i < BOARD_SIZE && j >= 0 && j < BOARD_SIZE) {
            playMove(i, j);
          }
          }, { passive: false });
      ```
chinese-chess:
  name: chinese-chess
  description: |
    覆盖棋盘绘制、棋子逻辑、走法校验、移动端适配等常见踩坑点。当且仅当用户query明确与"象棋"相关时，查看本skill。
  files:
  - path: SKILL.md
    content: |
      ## Skill: 中国象棋 HTML 游戏生成规范
      
      ### 核心布局要求
    
      - 移动端优先：页面必须禁止缩放，适配各种手机屏幕。
      - Flex 布局架构：使用 `height: 100dvh`（优先 dvh，回退 vh）和 `flex-direction: column`。结构为：顶部信息栏（固定高度）→ 中间棋盘区域（flex:1）→ 底部控制栏（固定高度 + safe-area 内边距）。
      - 智能 Canvas 尺寸计算：棋盘 9列×10行，宽高比约 9:10。JS 初始化时根据中间区域可用宽高，动态计算 Canvas 最大合适尺寸，确保不溢出且居中。
      - 棋子用 Canvas 绘制，带简单立体感。
    
      ### 一、棋盘基础数据模型
      
      ```
      【强制】棋盘为 9列 × 10行 的网格，共90个交叉点。
      【强制】逻辑坐标系：col ∈ [0, 8]，row ∈ [0, 9]。
      【强制】红方在下方 (row 5-9)，黑方在上方 (row 0-4)。
      【强制】棋盘中间存在"楚河汉界"，位于 row=4 和 row=5 之间。
      ```
      #### 1.1 数据结构与初始布局
      
      ```javascript
      // 【强制】board[row][col]，null=空位
      // 棋子: { type: 'che'|'ma'|'xiang'|'shi'|'jiang'|'pao'|'bing', color: 'red'|'black', label: '汉字' }
               
      function initBoard() {
        const board = Array.from({length: 10}, () => Array(9).fill(null));
      
        // 黑方 (上方)
        const blackBack = [
          {type:'che',label:'車'},{type:'ma',label:'馬'},{type:'xiang',label:'象'},
          {type:'shi',label:'士'},{type:'jiang',label:'將'},{type:'shi',label:'士'},
          {type:'xiang',label:'象'},{type:'ma',label:'馬'},{type:'che',label:'車'}
      ];
      for (let c = 0; c < 9; c++) board[0][c] = {...blackBack[c], color:'black'};
      board[2][1] = {type:'pao',color:'black',label:'砲'};
      board[2][7] = {type:'pao',color:'black',label:'砲'};
      for (let c = 0; c < 9; c += 2) board[3][c] = {type:'bing',color:'black',label:'卒'};
      
      // 红方 (下方)
      const redBack = [
          {type:'che',label:'車'},{type:'ma',label:'馬'},{type:'xiang',label:'相'},
          {type:'shi',label:'仕'},{type:'jiang',label:'帥'},{type:'shi',label:'仕'},
          {type:'xiang',label:'相'},{type:'ma',label:'馬'},{type:'che',label:'車'}
      ];
      for (let c = 0; c < 9; c++) board[9][c] = {...redBack[c], color:'red'};
      board[7][1] = {type:'pao',color:'red',label:'炮'};
      board[7][7] = {type:'pao',color:'red',label:'炮'};
      for (let c = 0; c < 9; c += 2) board[6][c] = {type:'bing',color:'red',label:'兵'};
      
      return board;
      }
      // 【强制】深拷贝棋盘，用于模拟走法
      function cloneBoard(b) {
        return b.map(row => row.map(cell => cell ? {...cell} : null));
      }
      ```
      ---
    
      ### 二、棋子移动规则（必须逐条实现）
    
      #### 2.1 帥/將
      
      ```
      【强制】九宫格内移动：红帥 col∈[3,5] row∈[7,9]，黑將 col∈[3,5] row∈[0,2]
      【强制】每次上下左右移动一格（不能斜走）
      【强制】"将帅对面"规则：帅和将不能在同一列上中间无子直接对面
      ```
      
      #### 2.2 仕/士
      
      ```
      【强制】九宫格内，每次斜走一格（对角线移动），4个方向
      ```
      
      #### 2.3 相/象
      
      ```
      【强制】走"田"字 (dr=±2, dc=±2)
      【强制】"塞象眼"：田字中心 (row+dr/2, col+dc/2) 有子则不能走
      【强制】不能过河：红相 row∈[5,9]，黑象 row∈[0,4]
      ```
      
      #### 2.4 馬
      
      ```
      【强制】走"日"字形，先直一步再斜一步，共8个可能目标
      【强制】"蹩马腿"：直走方向有子则该方向两个目标均不可达
      ```
      
      ```javascript
      // [目标dr, 目标dc, 马腿lr, 马腿lc]
      const MA_CONFIGS = [
      [-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],
      [-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]
      ];
      ```
      
      #### 2.5 車
      
      ```
      【强制】沿直线移动任意格数，不能跳子，可吃路径上第一个敌子
      ```
      
      #### 2.6 炮
      
      ```
      【强制】移动时同車：直线走，不能跳子
      【强制】吃子时必须"翻山"：隔恰好一个棋子（炮架），吃炮架后第一个敌子
      ```
      ```javascript
      function getPaoMoves(row, col, color, currentBoard) {
        const moves = [];
        for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          let nr = row + dr, nc = col + dc;
          let jumped = false;
          while (nr >= 0 && nr <= 9 && nc >= 0 && nc <= 8) {
            const target = currentBoard[nr][nc];
            if (!jumped) {
              if (!target) moves.push([nr, nc]);
              else jumped = true;  // 遇到第一个子作为炮架
            } else {
              if (target) {
                if (target.color !== color) moves.push([nr, nc]);
                break;  // 翻山后遇到任何子都停止
              }
            }
          nr += dr; nc += dc;
          }
        }
        return moves;
      }
      ```
      #### 2.7 兵/卒
      
      ```
      【强制】未过河只能向前一步：红兵前=row-1，黑卒前=row+1
      【强制】过河后可前/左/右（仍不能后退）：红兵过河=row<=4，黑卒过河=row>=5
      【强制】每次只走一格
      ```
    
      ---
    
      ### 三、将帅对面检测
      
      ```
      【强制】任何一步走完后，都必须检测将帅是否同列且中间无子。若是则该步非法。
      ```
      ```javascript
      function areKingsFacing(currentBoard) {
        let redKing = null, blackKing = null;
        for (let r = 0; r < 10; r++)
          for (let c = 0; c < 9; c++)
            if (currentBoard[r][c]?.type === 'jiang') {
              if (currentBoard[r][c].color === 'red') redKing = [r, c];
              else blackKing = [r, c];
            }
        if (!redKing || !blackKing || redKing[1] !== blackKing[1]) return false;
        for (let r = Math.min(redKing[0], blackKing[0]) + 1; r < Math.max(redKing[0], blackKing[0]); r++)
          if (currentBoard[r][redKing[1]]) return false;
        return true;
      }
      ```
      ### 四、被将军、绝杀与合法走法（核心，最易出错）
      **【核心原则：纯函数，无副作用】**
      - `getRawMoves`、`getLegalMoves`、`isInCheck` **必须接受 `currentBoard` 参数**，**严禁读取全局 `board`**。
      - 当被将军时，不仅将帅可移动，其他棋子也可吃掉攻击子或阻挡。必须在虚拟棋盘上验证。
      ```javascript
      // 1. 基础走法（只看物理规则，不检查送将）
      function getRawMoves(currentBoard, row, col) {
        const piece = currentBoard[row][col];
        if (!piece) return [];
        switch (piece.type) {
          case 'jiang': return getJiangMoves(row, col, piece.color, currentBoard);
          case 'shi':   return getShiMoves(row, col, piece.color, currentBoard);
          case 'xiang': return getXiangMoves(row, col, piece.color, currentBoard);
          case 'ma':    return getMaMoves(row, col, piece.color, currentBoard);
          case 'che':   return getCheMoves(row, col, piece.color, currentBoard);
          case 'pao':   return getPaoMoves(row, col, piece.color, currentBoard);
          case 'bing':  return getBingMoves(row, col, piece.color, currentBoard);
          default: return [];
        }
      }
      // 2. 是否被将军
      function isInCheck(currentBoard, color) {
        // 找到己方将帅位置
        let kingPos = null;
        for (let r = 0; r < 10; r++)
          for (let c = 0; c < 9; c++)
            if (currentBoard[r][c]?.type === 'jiang' && currentBoard[r][c].color === color)
              kingPos = [r, c];
            if (!kingPos) return true; // 将帅被吃=被将
            // 检查对方所有子能否攻击到将帅
            const enemy = color === 'red' ? 'black' : 'red';
            for (let r = 0; r < 10; r++)
              for (let c = 0; c < 9; c++)
                if (currentBoard[r][c]?.color === enemy) {
                    const moves = getRawMoves(currentBoard, r, c);
                    if (moves.some(([mr, mc]) => mr === kingPos[0] && mc === kingPos[1]))
                    return true;
                }
              return false;
          }
      
      // 3. 合法走法（过滤送将）
      function getLegalMoves(currentBoard, row, col) {
      const piece = currentBoard[row][col];
      if (!piece)
      return [];
      return getRawMoves(currentBoard, row, col).filter(([toR, toC]) =  > {
        const next = cloneBoard(currentBoard);
        next[toR][toC] = next[row][col];
        next[row][col] = null;
        return !isInCheck(next, piece.color) && !areKingsFacing(next);
      });
      }
      // 4. 是否被将杀（含困毙：无子可动也算输）
      function isCheckmate(currentBoard, color) {
       for (let r = 0; r < 10; r++)
        for (let c = 0; c < 9; c++)
          if (currentBoard[r][c]?.color === color)
            if (getLegalMoves(currentBoard, r, c).length > 0) return false;
          return true; // 无合法走法 = 被杀或困毙
      }
      ```
      ---
    
      ### 五、渲染规范（Canvas）
      
      ```
      【强制】使用 Canvas 渲染
      【强制】棋盘线条标准样式：横线10条，竖线9条（中间断开楚河汉界区域，仅边线贯通）
      【强制】九宫格斜线、兵/炮位置十字星标记
      【推荐】楚河汉界文字
      ```
      ```javascript
      function calcLayout(containerW, containerH) {
        // 留边距，计算可用空间内最大棋盘
        const maxW = containerW * 0.92;
        const maxH = containerH * 0.95;
        // 8个列间隔 : 9个行间隔 = 8:9
        const cellByW = Math.floor(maxW / 8);
        const cellByH = Math.floor(maxH / 9);
        const cellSize = Math.min(cellByW, cellByH);
        const boardW = cellSize * 8;
        const boardH = cellSize * 9;
        const offsetX = Math.floor((containerW - boardW) / 2);
        const offsetY = Math.floor((containerH - boardH) / 2);
        return { cellSize, boardW, boardH, offsetX, offsetY };
      }
      
      function toPixel(col, row) {
        return { x: layout.offsetX + col * layout.cellSize, y: layout.offsetY + row * layout.cellSize };
      }
      ```
      #### 5.1 棋盘绘制要点
      
