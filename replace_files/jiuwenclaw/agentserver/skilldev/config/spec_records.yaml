  - path: section1.md
    content: |
      # 视觉基调 & 背景动效设计

      ## 1. 颜色与情绪选型

      - 祝福主题推荐：粉-橙-金-紫的柔和渐变，营造「梦幻、温暖」氛围。
      - 建议使用多色渐变：控制在 2～4 个颜色即可，避免彩虹式大杂烩。
      - 整体饱和度偏中高、亮度偏高，让内容显得“喜庆但不刺眼”，同时保证文字可读性。

      ## 2. 渐变背景 + 缓动动画

      - 使用线性渐变作为基础背景：`linear-gradient(角度, 颜色1, 颜色2, ...)`。
      - 通过增大 `background-size` 并缓慢改变 `background-position`，制造背景“缓慢流动”的效果，而不是剧烈闪动。
      - 建议背景只做大范围、低频率的运动，突出“氛围”，不要喧宾夺主。

      ### 示例：

      ```css
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
        background-size: 300% 300%;
        animation: bg-move 12s ease-in-out infinite;
        overflow: hidden;
      }

      @keyframes bg-move {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      # 设计规范：
        动画节奏保持 8～20 秒一轮，避免眩晕感。
        使用 ease-in-out，使过渡柔和。
        背景动效属于「气氛组」，不应比主体卡片更抢眼。
  - path: section2.md
    content: |
      # 主体贺卡布局 & 3D 质感
      ## 1、布局框架
        使用一个中央容器 scene 居中贺卡：
        宽度：min(420px, 90vw)
        高度：min(620px, 95vh)
        使用 flex 居中整个场景，让贺卡成为页面绝对主角。
      ### 示例：
            .scene {
            position: relative;
            width: min(420px, 90vw);
            height: min(620px, 95vh);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
          }
      ## 2、卡片本体 & 玻璃感
        使用圆角 + 阴影 + 浅渐变 + 背景模糊，营造「玻璃卡片」质感。
        在 card 外再包一层 card-wrapper，用于 hover 的 3D 旋转。
      ### 示例
          .card-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 380px;
            max-height: 560px;
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.19, 1, 0.22, 1);
          }

          .card-wrapper:hover {
            transform: rotateY(-10deg) rotateX(6deg) translateY(-4px);
          }

        .card {
          position: relative;
          width: 100%;
          height: 100%;
          border-radius: 26px;
          padding: 28px 24px 24px;
          background: linear-gradient(145deg, #ffffffee, #ffeefaff);
          box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
          overflow: hidden;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          backdrop-filter: blur(8px);
        }

      ## 3、庆祝状态下的发光边框
          通过伪元素 ::before + conic-gradient 实现彩色流转边框。
          用一个类（如 .celebrate）控制是否开启此效果：
      ### 示例
          .card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: conic-gradient(
              from 180deg,
              #ff9a9e, #fad0c4, #f6d365, #a1c4fd, #fbc2eb, #ff9a9e
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box,
                            linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s ease;
          }
          .card.celebrate::before {
            opacity: 1;
            animation: border-spin 4s linear infinite;
          }
          @keyframes border-spin {
            to { transform: rotate(360deg); }
          }
         /* 移动端补充：更稳的高度与宽度（避免地址栏导致 100vh 抖动） */
          .scene{
            width: min(420px, 90vw);
            height: min(620px, 92svh);
          }

          /* 触屏设备不依赖 hover（hover 只做桌面增强） */
          @media (hover: hover) and (pointer: fine){
            .card-wrapper:hover{
              transform: rotateY(-10deg) rotateX(6deg) translateY(-4px);
            }
          }
        # 规范建议：
        hover 3D 角度控制在 5–12 度，避免眩晕。
        发光边框仅在「特殊时刻」触发（如点击“许愿”后），增强仪式感。
  - path: section3.md
    content: |
      # 文字信息层级 & 文案容器
      ## 1、信息层级设计
        推荐结构：
          Tag 标签（例如：Happy Birthday）
          主标题（例如：“生日快乐！”）
          副标题（氛围句子，例如「今天，是属于你的宇宙发光日」）
        正文（祝福语，多行）
        签名区（To/From）
      ### 示例：
          .tag {
            align-self: flex-start;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: rgba(255, 154, 158, 0.12);
            color: #ff6f91;
            border: 1px solid rgba(255, 154, 158, 0.45);
            backdrop-filter: blur(6px);
          }
          .title {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.2;
            color: #333;
            letter-spacing: 0.03em;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
          }
          .subtitle {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
          }
          .highlight-name {
            font-weight: 700;
            color: #ff6f91;
          }

          .divider {
            width: 60px;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff9a9e, #f6d365);
            margin: 6px 0 4px;
          }
      ## 2、正文祝福区域
        使用单独的 message 容器：
        半透明背景
        虚线边框暗示“手写信 / 便签”感觉
        圆角 + 内边距，保证阅读舒适
      ### 示例
        .message {
            flex: 1;
            margin-top: 6px;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px dashed rgba(255, 154, 158, 0.45);
            font-size: 14px;
            line-height: 1.8;
            color: #555;
            overflow-y: auto;
          }
          签名信息
          放在底部 footer：左侧是 To/From，右侧是按钮。
          字号略小，但用粗体高亮名字。
          .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
          }
          .from {
            font-size: 13px;
            color: #777;
            line-height: 1.5;
          }
          .from strong {
            font-size: 15px;
            color: #444;
          }
        ## 规范：
        图案不要覆盖到文字
        字体尽量统一使用系统字体堆栈。
        通过字号、粗细和颜色控制阅读顺序，而不是靠花哨字体。
  - path: section4.md
    content: |
      # 装饰元素动效
      ## 1、气球设计
        使用 div + border-radius 绘制气球轮廓，再用 radial-gradient 做高光，通过不同类名改变颜色和位置。
      ### 示例
          .balloon {
            position: absolute;
            width: 70px;
            height: 90px;
            border-radius: 50% 50% 45% 45%;
            background: radial-gradient(circle at 30% 20%, #fff8, transparent 55%), var(--color);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            animation: float 8s ease-in-out infinite;
          }
          .balloon::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -40px;
            width: 2px;
            height: 40px;
            background: #ffffff90;
            transform: translateX(-50%);
          }
          @keyframes float {
            0%, 100% { transform: translateY(10px); }
            50%      { transform: translateY(-25px); }
          }
      ## 2、通过不同类设置颜色与位置：
      ### 示例
          .balloon.b1 {
            --color: #ff9a9e;
            top: 5%;
            left: 8%;
            animation-duration: 9s;
          }
          .balloon.b2 {
            --color: #f6d365;
            top: 12%;
            right: 10%;
            animation-duration: 7.5s;
            animation-delay: -1s;
          }
          .balloon.b3 {
            --color: #a1c4fd;
            bottom: 10%;
            left: 5%;
            animation-duration: 8.5s;
            animation-delay: -2s;
          }
          .balloon.b4 {
            --color: #fbc2eb;
            bottom: 8%;
            right: 8%;
            animation-duration: 10s;
            animation-delay: -3s;
          }
      ## 3、星星闪烁
        使用小圆点 + box-shadow 做发光，再用 scale + opacity 轻微变化。
      ### 示例
          .star {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #fff0);
            box-shadow: 0 0 10px #ffffffaa;
            animation: twinkle 2s ease-in-out infinite alternate;
          }
          .star.s1 { top: 10%; left: 45%;  animation-delay: -0.3s; }
          .star.s2 { top: 20%; right: 18%; animation-delay: -0.8s; }
          .star.s3 { bottom: 18%; left: 20%; animation-delay: -0.5s; }
          .star.s4 { bottom: 26%; right: 30%; animation-delay: -1.1s; }
          @keyframes twinkle {
            0%   { transform: scale(0.7); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
          }
      # 规范:
        -装饰元素不要被贺卡主体遮住也不要遮住贺卡
        -星星移动幅度小，不要四处乱飞，避免干扰阅读。
        -注意与背景亮度的对比，避免星星太晃眼。
  - path: section5.md
    content: |
      # 按钮交互 & 庆祝动画（纸屑）
      ## 1、仪式感按钮设计
          高亮颜色（渐变粉/橙） + 圆角胶囊 + 阴影 + 亮度扫过，即可做到很「想点一下」的按钮。
      ### 示例
          .btn {
            position: relative;
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff9a9e, #ff6f91);
            color: #fff;
            box-shadow: 0 12px 22px rgba(255, 111, 145, 0.55);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
          }
          .btn span {
            position: relative;
            z-index: 1;
          }
          .btn::before {
            content: "";
            position: absolute;
            left: -40%;
            top: 0;
            width: 40%;
            height: 100%;
            transform: skewX(-25deg);
            background: linear-gradient(
              to right,
              transparent,
              rgba(255, 255, 255, 0.7),
              transparent
            );
            opacity: 0;
          }
          .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 16px 30px rgba(255, 111, 145, 0.7);
          }
          .btn:hover::before {
            animation: shine 0.8s ease;
            opacity: 1;
          }
          .btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 8px 18px rgba(255, 111, 145, 0.6);
          }
          @keyframes shine {
            from { left: -40%; }
            to   { left: 120%; }
          }
      ## 2、纸屑动画容器
          在 card 内创建一个绝对定位的 confetti 容器，用来放飞纸屑。
      ### 示例
          <div class="card" id="card">
            <div class="confetti" id="confetti"></div>
            <!-- 其他内容 -->
          </div>
          .confetti {
            pointer-events: none;
            position: absolute;
            inset: -20px;
            overflow: visible;
            z-index: 2;
          }
          .confetti-piece {
            position: absolute;
            width: 6px;
            height: 14px;
            border-radius: 2px;
            background: var(--color, #fff);
            top: -10%;
            animation: confetti-fall 1.4s linear forwards;
          }
          @keyframes confetti-fall {
            0% {
              transform: translate3d(0, 0, 0) rotateZ(0deg);
              opacity: 1;
            }
            100% {
              transform: translate3d(var(--x-move), 120vh, 0) rotateZ(260deg);
              opacity: 0;
            }
          }
      ## 3、JS 生成纸屑 & 卡片微动作
          点击按钮时：
          给卡片添加 .celebrate 类，触发边框动画。
          在 confetti 容器内生成 N 个随机纸屑元素。
          使用 Web Animations API 给卡片一个轻微弹跳。
          const btn = document.getElementById("wishBtn");
          const confettiBox = document.getElementById("confetti");
          const card = document.getElementById("card");
          function createConfetti() {
            const colors = ["#ff9a9e", "#fad0c4", "#f6d365", "#a1c4fd", "#fbc2eb", "#ff6f91"];
            const pieceCount = 80;

            for (let i = 0; i < pieceCount; i++) {
              const piece = document.createElement("div");
              piece.classList.add("confetti-piece");

              const left = Math.random() * 100;
              const xMove = (Math.random() - 0.5) * 160;
              const color = colors[Math.floor(Math.random() * colors.length)];

              piece.style.left = left + "%";
              piece.style.setProperty("--x-move", xMove + "px");
              piece.style.setProperty("--color", color);
              piece.style.animationDelay = Math.random() * 0.5 + "s";

              confettiBox.appendChild(piece);
              piece.addEventListener("animationend", () => piece.remove());
            }
          }
          btn.addEventListener("click", () => {
            card.classList.add("celebrate");
            createConfetti();
            card.animate(
              [
                { transform: "translateY(0) scale(1)" },
                { transform: "translateY(-4px) scale(1.02)" },
                { transform: "translateY(0) scale(1)" }
              ],
              {
                duration: 500,
                easing: "ease-out"
              }
            );
          });
        # 规范：
        纸屑数量控制在 50～100 之间，根据性能可调。
        动画时间控制在 1～1.5 秒，避免停留太久影响阅读。
  - path: section6.md
