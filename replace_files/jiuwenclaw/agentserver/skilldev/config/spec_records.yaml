      ---
    
      ### 六、移动端交互规范
      
      ```
      【强制】统一使用 pointer 事件（兼容触摸和鼠标，避免 touch+click 双触发）
      【强制】阻止默认行为，防缩放/滚动
      【强制】点击容差：距棋子中心 < cellSize*0.6 视为选中
      【强制】两段式操作：先选己方棋子 → 再点目标位置
      【强制】点击己方其他棋子时切换选中（而非取消选中）
      【推荐】显示可移动位置提示标记（半透明圆点或圆圈）
      ```
      ```javascript
      // 【强制】使用 pointerup 统一处理，避免 touch/click 双触发
      canvas.addEventListener('pointerup', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        handleBoardClick(x, y);
      });
      
      // 【强制】阻止默认行为
      canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
      canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
      
      function handleBoardClick(pixelX, pixelY) {
        if (gameOver) return;
        const col = Math.round((pixelX - layout.offsetX) / layout.cellSize);
        const row = Math.round((pixelY - layout.offsetY) / layout.cellSize);
        if (col < 0 || col > 8 || row < 0 || row > 9) return;
      
          const clickedPiece = board[row][col];
      
        if (selectedPiece) {
          // 点击己方其他棋子 → 切换选中
          if (clickedPiece && clickedPiece.color === currentTurn) {
            selectedPiece = { row, col };
            highlightMoves = getLegalMoves(board, row, col);
            render();
            return;
        }
      // 尝试移动到目标
      if (highlightMoves.some(([r, c]) => r === row && c === col)) {
        makeMove(selectedPiece.row, selectedPiece.col, row, col);
        } else {
          selectedPiece = null;
          highlightMoves = [];
          render();
          }
        } else {
        if (clickedPiece && clickedPiece.color === currentTurn) {
          selectedPiece = { row, col };
          highlightMoves = getLegalMoves(board, row, col);
          render();
          }
        }
      }
      ```
    
      ---
    
      ### 七、Canvas 高清适配
      
      ```javascript
      function setupCanvas(container) {
        const dpr = window.devicePixelRatio || 1;
        const w = container.clientWidth;
        const h = container.clientHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.scale(dpr, dpr);
        layout = calcLayout(w, h);
      }
      
      window.addEventListener('resize', () => { setupCanvas(container); render(); });
      ```
    
      ---
    
      ### 八、HTML 模板结构
      
      ```html
      <!DOCTYPE html>
