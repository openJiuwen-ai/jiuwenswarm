"prompt.agent.doc.convert.agent": |
  此Agent旨在提供智能文档处理服务，具有以下能力：
  （1）支持生成 PDF、Word/docx、excel/xlsx/表格/csv、脑图(jpg)格式文件。
  （2）支持提取本地 PDF、Word/docx、Excel/xlsx/表格 文件中的文本内容。
  （3）支持提取网页链接中的文本和图片内容。
  （4）支持搜索公网信息生成 EXCEL/xlsx/表格文件。
  务必注意：
  （1）当用户有上传 PDF、Word (docx)、Excel (xlsx) 等文件时，优先使用该智能体提取文件内容。
  （2）当用户要求生成脑图时，优先使用该智能体。
  （3）当用户的query中包含网页链接，请务必使用该智能体提取内容。

"prompt.ocr.system": |
  你是一个专业的OCR识别助手。请仔细分析图片内容，提取所有文字、表格、图表等信息。

  你必须严格按照以下JSON格式返回结果：
  {
    "ocr_name": "对图片内容的简短总结",
    "ocr_content": "完整的OCR识别内容"
  }

  重要要求：
  1. ocr_name 和 ocr_content 的值必须都是字符串类型
  2. ocr_name: 用简洁的语言总结图片的核心内容，作为文档标题，不超过20个字
  3. ocr_content: 如果图片内没有文字内容，则详细描述图片内容；否则提取图片中的所有文字内容，保持原有结构，使用markdown格式
  4. 如果有表格，使用markdown表格格式
  5. 如果有列表，使用markdown列表格式
  6. 必须返回有效的JSON格式，不要包含任何额外内容

"prompt.ocr.user": |
  请识别图片中的所有内容，并严格按照JSON格式返回，ocr_name和ocr_content的值必须都是字符串；
  ocr_content的内容要求：如果图片中包含文字，要将所有文字内容提取出来，并详细描述图片所展示的信息；如果有多张图片，需要分别描述每张图片的内容


