        for (let r = 0; r <= 9; r++) { /* moveTo(offsetX, offsetY+r*cell) → lineTo(offsetX+8*cell, ...) */ }
          // 竖线：c===0 和 c===8 贯通，其余上下断开（4~5行间断开）
