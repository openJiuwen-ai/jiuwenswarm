      ### 九、游戏状态管理
      
      ```javascript
      function makeMove(fromR, fromC, toR, toC) {
        const piece = board[fromR][fromC];
        const captured = board[toR][toC];
      
        moveHistory.push({ from:{row:fromR,col:fromC}, to:{row:toR,col:toC}, captured });
        board[toR][toC] = piece;
        board[fromR][fromC] = null;
      
        // 切换走棋方
        currentTurn = currentTurn === 'red' ? 'black' : 'red';
        selectedPiece = null;
        highlightMoves = [];
      
        // 检查对方是否被将杀/困毙
        if (isCheckmate(board, currentTurn)) {
          gameOver = true;
          const winner = currentTurn === 'red' ? '黑方' : '红方';
          updateStatus(winner + '胜！');
          } else if (isInCheck(board, currentTurn)) {
          updateStatus('将军！' + (currentTurn === 'red' ? '红方' : '黑方') + '走棋');
          } else {
          updateStatus((currentTurn === 'red' ? '红方' : '黑方') + '走棋');
        }
      
      render();
      
      // 如果是AI模式且轮到AI
      if (!gameOver && currentTurn === aiColor) aiMove();
      }
      ```
    
      ---
    
      ### 十、AI 对手
      
      ```
      【推荐】实现 Minimax + Alpha-Beta 剪枝，深度 2-3 层
      【强制】AI 思考必须用 setTimeout 避免阻塞 UI
      【推荐】棋子价值 + 位置加分表提升棋力
      ```
      
      ```javascript
      const PIECE_VALUES = { jiang:10000, che:600, pao:300, ma:300, shi:120, xiang:120, bing:30 };
      
      function evaluateBoard(currentBoard, color) {
        let score = 0;
        for (let r = 0; r < 10; r++)
          for (let c = 0; c < 9; c++) {
            const p = currentBoard[r][c];
            if (!p) continue;
            let val = PIECE_VALUES[p.type];
            // 过河兵价值提升
            if (p.type === 'bing') {
              const crossed = p.color === 'red' ? r <= 4 : r >= 5;
                if (crossed) val += 40;
              }
          score += (p.color === color ? 1 : -1) * val;
        }
      return score;
      }
      
      function minimax(currentBoard, depth, alpha, beta, maximizing, aiColor) {
        const evalColor = aiColor;
        const currentColor = maximizing ? aiColor : (aiColor === 'red' ? 'black' : 'red');
      
        if (depth === 0 || isCheckmate(currentBoard, currentColor))
      return { score: evaluateBoard(currentBoard, evalColor) };
      
      let bestMove = null;
      if (maximizing) {
        let maxEval = -Infinity;
        for (const move of getAllMoves(currentBoard, currentColor)) {
          const next = simulateMove(currentBoard, move);
          const result = minimax(next, depth - 1, alpha, beta, false, aiColor);
          if (result.score > maxEval) { maxEval = result.score; bestMove = move; }
            alpha = Math.max(alpha, maxEval);
          if (beta <= alpha) break;
        }
      return { score: maxEval, move: bestMove };
      } else {
        let minEval = Infinity;
        for (const move of getAllMoves(currentBoard, currentColor)) {
          const next = simulateMove(currentBoard, move);
          const result = minimax(next, depth - 1, alpha, beta, true, aiColor);
          if (result.score < minEval) { minEval = result.score; bestMove = move; }
          beta = Math.min(beta, minEval);
          if (beta <= alpha) break;
        }
        return { score: minEval, move: bestMove };
        }
      }
      
      function aiMove() {
        setTimeout(() => {
          const result = minimax(board, 2, -Infinity, Infinity, true, aiColor);
          if (result.move) makeMove(result.move.fromR, result.move.fromC, result.move.toR, result.move.toC);
          }, 200);
      }
      ```
    
