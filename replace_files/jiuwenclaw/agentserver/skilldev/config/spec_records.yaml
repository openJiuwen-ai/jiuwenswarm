sqlite:
  name: sqlite
  description: |
    本Skill为HTML程序提供`window.HarmonyBridge.sqlite.initTable`、`window.HarmonyBridge.sqlite.insert`、`window.HarmonyBridge.sqlite.delete`、`window.HarmonyBridge.sqlite.update`和`window.HarmonyBridge.sqlite.query`依次对应建表、增、删、改、查共5 个核心关系型数据库（RDB）操作。当且仅当用户要求生成HTML需要保存文件以及游戏分数时引入后端接口，提供数据持久化能力。
  files:
  - path: SKILL.md
    content: |
      # Skill: `window.HarmonyBridge.sqlite`后端接口使用指导，为html提供数据持久化能力，已注入window.HarmonyBridge。
      ## 后端接口使用指引

      读取数据库接口信息和示例代码后再开始生成HTML，并确保：
      - 每个html文件仅创建一张表
      - 务必遵循其入参约束与约束条件，必须舒服符合入参条件的参数，否则报错
      - 当配置要求与用户明确新增要求冲突时，以用户最新明确要求为准

      ### 创建独一无二的表名

      **不允许**自拟表名，必须实现并调用 makeStorageKey 函数来生成表名。表名**必须使用字符串字面量**，只在这一版 HTML 中固定，其作用是作为表名避免和其他html表名起冲突。

      ### 1. 初始化表函数`window.HarmonyBridge.sqlite.initTable`，用于在应用启动或页面加载时检查并创建数据表。

      方法签名：`window.HarmonyBridge.sqlite.initTable(tableName: string, createSql: string): Promise<ESObject>`
      入参要求：
        - `tableName` (String)：要创建或检查的表名。
        -  `createSql` (String)：建表语句中的列定义部分，建表Sql语句必须使用括号括起来，否则无效。例如：`(id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, avatar TEXT)`
      返回值：成功时返回 ESObject，形如 `{ retCode: 0, executeResult: {} }`。`executeResult` 为空对象。

      ### 2. 在表中插入数据函数`window.HarmonyBridge.sqlite.insert`，用于向指定表中插入一行数据。

      方法签名：`window.HarmonyBridge.sqlite.insert(tableName: string, insertValues: string): Promise<ESObject>`
      入参要求：
        - `tableName` (String)：目标表名。
        - `insertValues` (String)：要插入的列和对应的值，**必须为字符串string**。建议使用 `JSON.stringify({ name: "Tom", age: 18 })` 传入。
      返回值：成功时返回 ESObject，形如 `{ retCode: 0, executeResult: { rowID: number } }`。`rowID` 为新插入行的行号（数字）。
      约束条件：
        - 若insertValues中包含需要存储的图片信息，该信息必须为base64格式。
        - insertValues**不能**为json格式，必须是json通过JSON.stringify转化后的字符串

      ### 3. 更新表中数据函数`window.HarmonyBridge.sqlite.update`，用于根据条件更新表中的数据。与 `insert` 相同，支持多媒体字段的自动拦截与沙箱存储。

      方法签名：`window.HarmonyBridge.sqlite.update(tableName: string, updateValues: string, searchCondition: string): Promise<ESObject>`
      入参要求：
        - `tableName` (String)：目标表名。
        - `updateValues` (String)：要更新的字段及新值，**必须为 JSON 字符串**。建议使用 `JSON.stringify({ title: "新标题" })`。同样支持包含 `data:xxx` 的 Base64 数据。
        - `searchCondition` (String)：更新条件，**必须为 JSON 字符串**。建议使用 `JSON.stringify({ id: 1 })`。底层将键值对以 `AND` 连接、严格相等（`equalTo`）匹配。传 `'{}'` 表示无条件（更新全表）。
      返回值：成功时返回 ESObject，形如 `{ retCode: 0, executeResult: { affected: number } }`。`affected` 为受影响（被更新）的行数。

      ### 4. 删除表中数据函数`window.HarmonyBridge.sqlite.delete`，用于根据条件删除表中的行。当行被删除时，底层会自动扫描将要被删除的行中的 `file://` 沙箱路径，并将对应的沙箱物理文件一并删除，避免存储泄漏。

      方法签名：`window.HarmonyBridge.sqlite.delete(tableName: string, searchCondition: string): Promise<ESObject>`
      入参要求：
        - `tableName` (String)：目标表名。
        - `searchCondition` (String)：删除条件，**必须为 JSON 字符串**。建议使用 `JSON.stringify({ id: 1 })`，格式与 `update` 的 `searchCondition` 一致。
      约束条件：
        - 强烈限制：`searchCondition` **不允许**为空（如 `'{}'`、空字符串）。若传入空条件，接口会抛出错误 `delete conditions cannot be empty`，防止意外清空整张表。
      返回值：成功时返回 ESObject，形如 `{ retCode: 0, executeResult: { affected: number } }`。`affected` 为受影响（被删除）的行数。


      ### 5. 查询表中数据函数`window.HarmonyBridge.sqlite.query`，用于执行 SQL 查询（只读操作），返回查询结果。

      方法签名：`window.HarmonyBridge.sqlite.query(tableName: string, querySql: string): Promise<ESObject>`
      入参要求：
        - `tableName` (String)：目标表名。会替换 `querySql` 中的占位符 `{TABLE}`。
        - `querySql` (String)：SELECT 语句，其中**表名用占位符 `{TABLE}` 代替**。例如：`SELECT * FROM {TABLE} WHERE age > 18 ORDER BY created_at DESC`。后端会按字符串将 `{TABLE}` 替换为传入的 `tableName`。
      返回值：成功时返回 ESObject，形如 `{ retCode: 0, executeResult: { rows: string } }`。`rows` 为行对象数组的 **JSON 格式字符串**，即 `[{"col1": "val1", "col2": "val2"}, ...]`，前端需使用 `JSON.parse(res.executeResult.rows)` 解析后使用。
      约束条件：只读限制：SQL 经替换并 `.trim()` 后头部**必须**以 `SELECT`（不区分大小写）开头。**禁止**传入 `INSERT`、`UPDATE` 或 `DROP` 等，修改数据请使用前述 insert/update/delete 接口。
      使用多媒体文件的沙箱路径：返回行中的 `file://` 路径可直接赋给 `<img src="...">`、`<video src="...">` 或 `<audio src="...">` 进行渲染。


      ### 6.注意事项
      - 若存在调用硬件能力，比如拍照等。需要真正能够调用相机拍照，不可模拟。
      - 鸿蒙 ArkWeb / WebView 中不要用原生 JS 弹窗，html5页面运行在鸿蒙 ArkWeb（CEF）WebView 内。请勿使用 alert()、confirm()、prompt()。该环境下没有父窗口句柄，这些弹窗会被系统直接取消，并报错。需要用页面内的自定义弹窗代替。
      - 一张照片对应一个URI，此时表中插入的一条数据中中能有一列存储URI
      - initTable函数入参中的createsql必须用括号括起来才是正确的，比如`(id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, avatar TEXT)`
      - insert入参中insertValues必须为json格式字符串不可以直接传json

      ---

      ### 创建表名示例代码

      let tableName; // 先声明表名变量
      async function makeStorageKey(){
            let a=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.documentElement.outerHTML))),s='';
            for(let i=0;i<a.length;s+=a[i++].toString(16).padStart(2,'0'));
            return 't_' + s; // 取全部哈希
      }
      //必须在初始化表之前使用makeStorageKey给tableName赋值
      //示例代码
      async function initApp() {
        try {
            tableName = await makeStorageKey(); // 核心：调用makeStorageKey()生成哈希表名并赋值
            await sqlite.initTable(tableName, CREATE_SQL);
            console.log('表初始化成功，表名：', tableName);
            await loadPhotoWordList();
        } catch (e) {
            alert('初始化失败: ' + e.message);
            wordListEl.innerHTML = '<li class="empty-state">表创建失败，请重启应用</li>';
        }
      }

      ### 接口使用示例代码

      // 1. 使用**`window.HarmonyBridge.sqlite.initTable`**初始化表（成功返回 { retCode: 0, executeResult: {} }）
      await window.HarmonyBridge.sqlite.initTable(tableName, '(id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT, media_url TEXT)');

      // 2. 使用**`window.HarmonyBridge.sqlite.insert`**插入记录（入参为 JSON 字符串；包含 data: 的字段会自动写入沙箱并替换为 file://）
      const photoBase64 = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ...";
      const insertRes = await window.HarmonyBridge.sqlite.insert(tableName, JSON.stringify({
        title: "我的游记",
        media_url: photoBase64
      }));
      const newrowId = insertRes.executeResult.rowId;  // 新插入行的 rowId

      // 3. 使用**`window.HarmonyBridge.sqlite.update`**更新记录（values 与 conditions 均为 JSON 字符串）
      const updateRes = await window.HarmonyBridge.sqlite.update(
        tableName,
        JSON.stringify({ title: "更新后的游记" }),
        JSON.stringify({ id: 1 })
      );
      const updatedCount = updateRes.executeResult.affected;  // 被更新的行数,如果更新失败则不会返回executeResult.affected，executeResult仅包含errMsg:"updateTable error"

      // 4. 使用**`window.HarmonyBridge.sqlite.query`**查询记录（两个入参：表名 + 使用 {TABLE} 占位符的 SELECT 语句）**必须遵守**该入参的格式
      const res = await window.HarmonyBridge.sqlite.query(tableName, 'SELECT * FROM {TABLE} ORDER BY id DESC');
      const rows = JSON.parse(res.executeResult.rows);
      if (rows.length > 0) {
        document.getElementById('myImage').src = rows[0].media_url;
      }

      // 5. 使用**`window.HarmonyBridge.sqlite.delete`**删除记录（条件为 JSON 字符串；会联动删除行内 file:// 对应的沙箱文件）
      const deleteRes = await window.HarmonyBridge.sqlite.delete(tableName, JSON.stringify({ id: 1 }));
      const deletedCount = deleteRes.executeResult.affected;  // 被删除的行数
      ```
