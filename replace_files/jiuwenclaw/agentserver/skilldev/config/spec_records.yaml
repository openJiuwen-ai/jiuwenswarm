download_file:
  name: download_file
  description: |
    提供通过 Python 代码下载网络文件（图片、文档、音频等）的完整指导。当需要「通过链接下载文件」、「保存上一轮生成的图片到本地」或「获取外部URL资源」时，使用此 skill。
  files:
  - path: SKILL.md
    content: |
      # 网络文件下载的标准工作流程
      当接收到需要下载的文件链接（URL）时，请编写 Python 代码执行：

      ```python
      import requests
      def download_file(url, save_path):
          """
          下载文件并保存到本地
          url: 文件下载链接
          save_path: 本地保存路径
          """
          try:
              response = requests.get(url, stream=True, timeout=10)
              response.raise_for_status()

              total = 0
              with open(save_path, 'wb') as file:
                  for chunk in response.iter_content(chunk_size=8192):
                      if chunk:
                          total += len(chunk)
                          file.write(chunk)

              print(f"下载成功！文件已保存至当前目录下的: {save_path}")
              return save_path

          except requests.exceptions.RequestException as e:
              print(f"下载失败: {type(e).__name__} ")
              raise Exception(f"下载失败: {type(e).__name__}") from e
          except Exception as e:
              print(f"发生错误: {type(e).__name__} ")
              raise

      # 调用示例（由 Agent 根据实际 URL 和 保存文件地址 填充）
      # url = "{传入的图片链接}"
      # save_path = "{下载的图片文件路径}"
      # download_file(url, save_path)
xlsx:
  name: xlsx
  description: |
    提供生成Excel表格的完整指导，能辅助生成结构规范、公式准确、包含可视化图表等分析数据的专业Excel表格。当需要「生成任何Excel文件（.xlsx）」时，使用此 skill。
  files:
  - path: SKILL.md
    content: |
      # 表格处理的基本工作流程：
      1. **建立“协作型”工具思维（必须遵循的协作流）**：
         - **严禁二选一**：不要只用 pandas 或只用 openpyxl，必须结合两者的长处。
         - **Pandas 负责“原始素材”**：用于生成或读取**基础数据**。**严禁**在 Pandas 中计算最终结果列（如时长、总价等），这些必须留给 Excel 公式。
         - **Openpyxl 负责“逻辑构建”**：用于将 Pandas 数据写入 Excel 后，**追加**公式列、设置样式和图表。
      2. **创建/加载符合基础格式要求的文件**：
         - 创建新工作簿或加载现有文件:代码运行环境不持久化变量。在生成完整 Excel 文件时，将“数据生成”、“表格构建”、“保存文件”合并在一个代码块内执行。
         - 严格区分文件与工作表：明确一个.xlsx 文件（Workbook）可以包含多个命名工作表（Worksheet）；
         - 注意若没有提供模板描述，则**必须**遵循指南提供格式标准；若提供，则现有模板惯例始终优先于这些指南（即当模板与指南冲突时，遵循模板）；
      3. **根据需要修改与完善文件**：
         - 行内计算（公式注入）：数据写入后，**必须**遍历行，在目标列写入Excel公式字符串。
         - 检测标准：如果一列数据可以通过同行其他列算出来，它在Python代码里绝对不能是数字，必须是 `f'=...'` 字符串。
         - **汇总计算（统计层）**：创建新的 Sheet 页（如“统计页”），使用 `AVERAGEIF`, `SUMIF`, `VLOOKUP` 等函数引用“原始数据页”的范围。
         - **可视化**：当表中有数据后，使用 Openpyxl 插入图表（BarChart 等），注意动态引用数据范围（不要硬编码 `max_row`）。
      4. **保存文件**：在修改完成后，保存文件并确保所有更改已被正确写入；
      5. **验证并修复所有错误**：
         - 文件结构问题：所有内容堆叠在一个sheet页，缺乏分层
         - 格式问题：仅满足最基本结构，未考虑实际业务操作便利性
         - 数据类型和输入限制：忽略数据类型和输入限制，导致后续容易出错
         - **硬编码值检查**：检查所有本该动态计算的列（如合计、时长），是否被错误地写成了硬编码的数字？如果是，判定为**严重错误**，必须重写代码改为公式。
         - 公式准确性：交付的每个 Excel 模型**必须**确保**零**公式错误！！！（错误包含#REF!, #DIV/0!, #VALUE!, #N/A, #NAME?）。

      # 使用openpyxl的注意事项
      - 单元格索引是基于 1 的（row=1, column=1 指的是单元格 A1）
      - 使用 `data_only=True` 来读取计算值：`load_workbook('file.xlsx', data_only=True)`
      - **警告**：如果以 `data_only=True` 打开并保存，公式将被替换为值并**永久丢失**
      - 对于大文件：使用 `read_only=True` 进行读取或 `write_only=True` 进行写入

      # 数据校验规则
      1. 若需要使用openpyxl中数据校验功能(限制单元格可以输入什么样的数据，创建下拉菜单等)，则通过以下语句引入DataValidation：
      from openpyxl.worksheet.datavalidation import DataValidation
      2. 生成包含数据验证的xlsx时必须遵循以下规则：
        - 如果需要拦截非法输入，则必须设置：
           - `dv.showErrorMessage = True`
           - `dv.errorStyle = "stop"`
           - `dv.errorTitle`、`dv.error`（给出中文提示）
        - 除非用户明确要求隐藏下拉箭头，否则不要设置 `showDropDown=True`。默认为False。
        - 列表验证的公式必须是Excel可识别格式 ，直接枚举列表时：`formula1 = '"A,B,C"'`（注意外层双引号）


      # 相关指南参考：
      在执行任务时，若涉及以下任何部分，务必调用 `view_skill_detail` 工具来查看相关规范，传入对应配置项名称作为参数：
      其中格式标准**务必**读取和遵循。
      - **计算公式生成规范与指导**：提供生成公式的规范、检查项等内容；配置项名称为 "skills.md.xlsx.section1"；
      - **可视化-生成柱状图的代码示例**：展示如何使用 pandas 和 openpyxl 生成柱状图等可视化图表；配置项名称为 "skills.md.xlsx.section2"；
      - **格式标准-数字格式标准和颜色编码标准**：定义数字格式和颜色编码规范，提升表格的一致性和易读性；配置项名称为 "skills.md.xlsx.section3"；
      - **使用 pandas 读取和分析表格的用法要点**：介绍使用 pandas 进行数据读取、分析、处理的最佳实践；配置项名称为 "skills.md.xlsx.section4"；
      - **代码示例-创建新的 Excel 文件**：展示如何使用 openpyxl 创建新工作簿并设置格式和公式；配置项名称为 "skills.md.xlsx.section5"；
      - **代码示例-编辑现有的 Excel 文件**：介绍如何编辑现有的 Excel 文件，包括修改、插入、删除操作。配置项名称为 "skills.md.xlsx.section6"；
  - path: section1.md
    content: |
      # Section 1：公式生成规范与指导
      ## 关键：务必使用公式，而不是硬编码值

      这适用于**所有**计算——总计、百分比、比率、差值等。当源数据更改时，电子表格应该能够重新计算。
      **始终使用 Excel 公式，而不是在 Python 中计算值并将其硬编码。** 这可确保电子表格保持动态和可更新。

      ### ❌ **错误 - 硬编码计算值**

      ```python
      # 错误：在 Python 中计算并硬编码结果
      total = df['Sales'].sum()
      sheet['B10'] = total  # Hardcodes 5000
      # 错误：在 Python 中计算并硬编码结果
      growth = (df.iloc[-1]['Revenue'] - df.iloc[0]['Revenue']) / df.iloc[0]['Revenue']
      sheet['C5'] = growth  # Hardcodes 0.15
      # 错误：在 Python 中计算并硬编码结果
      avg = sum(values) / len(values)
      sheet['D20'] = avg  # Hardcodes 42.5
      ```

      ### ✅ **正确 - 使用 Excel 公式**

      ```python
      # 正确：让 Excel 计算总和
      sheet['B10'] = '=SUM(B2:B9)'
      # 正确：增长率作为 Excel 公式
      sheet['C5'] = '=(C4-C2)/C2'
      # 正确：使用 Excel 函数计算平均值
      sheet['D20'] = '=AVERAGE(D2:D19)'
      ```

      ## Assumptions放置

      - 将所有Assumptions（增长率、利润率、倍数等）放在单独的假设单元格中
      - 在公式中使用单元格引用，而不是硬编码的值
      - 示例：使用 =B5*(1+$B$6)$ 而不是 $=B5*1.05


      ## 确保没有任何公式错误（**务必**检查每一项）

      - 禁止在列引用加括号：严禁写成 A:(A) 。**必须**严格写为 A:A。
      - 禁止使用点号引用 Sheet：在公式中引用其他工作表时，**必须**使用感叹号!。
      - 验证所有单元格引用是否正确
      - 务必检查和修复范围内的“差一”错误（例如 SUM 或者 AVERAGE 的范围是否少一列或多一列）
      - 确保所有预测期的公式一致（跨行/列复制后检查相对/绝对引用）
      - 使用边界情况（零值、负数）进行测试，务必确保不会产生 #DIV/0! 等
      - 使用AVERAGEIF时，请确保第一个参数必须是包含“条件”的分类列，第二个参数是具体条件，第三个参数是需要计算平均值的**数值**列
      - 验证没有意外的循环引用

      ## 硬编码值的文档要求

      - 在单元格旁添加注释或在单元格中（如果表格末尾）。格式：
        “Source: [System/Document], [Date], [Specific Reference], [https://www.gymglish.com/en/gymglish/english-translation/if-applicable](https://www.gymglish.com/en/gymglish/english-translation/if-applicable)”（来源：[系统/文件], [日期], [具体引用], [适用的网址]）
      - 示例：
        - "Source: Company 10-K, FY2024, Page 45, Revenue Note, [SEC EDGAR URL]"（来源：公司 10-K 文件, 2024 财年, 第 45 页, 收入说明, [SEC EDGAR URL]）
        - "Source: Company 10-Q, Q2 2025, Exhibit 99.1, [SEC EDGAR URL]"（来源：公司 10-Q 文件, 2025 年第二季度, 附件 99.1, [SEC EDGAR URL]）
        - "Source: Bloomberg Terminal, 8/15/2025, AAPL US Equity"（来源：彭博终端, 2025 年 8 月 15 日, 苹果美国股票）
        - "Source: FactSet, 8/20/2025, Consensus Estimates Screen"（来源：FactSet, 2025 年 8 月 20 日, 共识估计屏幕）
  - path: section2.md
    content: |
      # Section 2: 可视化：生成柱状图的代码示例：
      说明：当表中有可分析数据时，可使用库工具生成柱状图等可视化图表。务必注意横纵轴的设置，需要显示坐标！
      使用 pandas + openpyxl 的 BarChart的代码示例：

      ```
      from openpyxl import Workbook
      from openpyxl.chart import BarChart, Reference

      # 1. 创建 Excel 工作簿
      wb = Workbook()
      ws = wb.active
      ws.title = "SalesData"

      # 2. 写入示例数据
      data = [
          ["月份", "销售额"],
          ["一月", 120],
          ["二月", 150],
          ["三月", 180],
          ["四月", 90],
          ["五月", 200],
      ]

      for row in data:
          ws.append(row)

      # 3. 创建柱状图对象
      chart = BarChart()
      chart.type = "col"                # 柱状图（垂直）
      chart.style = 10                  # 图表样式
      chart.title = "2025 年销售额统计"
      chart.y_axis.title = "销售额（万元）"
      chart.x_axis.title = "月份"

      # 4. 设置数据范围
      data_ref = Reference(ws, min_col=2, min_row=1, max_row=6)   # 数值
      cats_ref = Reference(ws, min_col=1, min_row=2, max_row=6)   # 分类（横轴）

      chart.add_data(data_ref, titles_from_data=True)
      chart.set_categories(cats_ref)

      # 5. 设置坐标轴刻度
      chart.y_axis.majorUnit = 50       # y轴主刻度间隔
      chart.y_axis.minorUnit = 10       # y轴次刻度（可选）
      chart.y_axis.scaling.min = 0      # 最小值
      chart.y_axis.scaling.max = 250    # 最大值

      # 6. 将图表插入到表格中
      ws.add_chart(chart, "D3")

      # 7. 保存工作簿
      wb.save("sales_chart.xlsx")
      ```
  - path: section3.md
    content: |
      # Section 3: 格式标准：数字格式标准和颜色编码标准

      ## 数字格式标准（必需的格式准则）：

      - **年份**：格式设置为文本字符串（例如，“2024”而不是“2,024”）
      - **货币**：使用 $#,##0 格式；**始终**在标题中指定单位（“收入 ($mm)”）
      - **零值**：使用数字格式将所有零值显示为“-”，包括百分比（例如，“$#,##0;($#,##0);-”）
      - **百分比**：默认使用 0.0% 格式（一位小数）
      - -* **倍数**：估值倍数（EV/EBITDA, P/E）格式设置为 0.0x
      - **负数**：使用括号 (123) 而不是负号 -123

      ## 行业标准颜色惯例（除非用户或模板另有说明）：

      - **蓝色文本 (RGB: 0,0,255)**：硬编码的输入，以及用户将为情景分析而更改的数字
      - **黑色文本 (RGB: 0,0,0)**：**所有**公式和计算
      - **绿色文本 (RGB: 0,128,0)**：链接到同一工作簿内其他工作表的引用
      - **红色文本 (RGB: 255,0,0)**：链接到其他文件的外部引用
      - **黄色背景 (RGB: 255,255,0)**：需要注意的关键假设或需要更新的单元格

      ## 代码风格指南：

      **重要**：生成用于 Excel 操作的 Python 代码时：

      - 编写最少、简洁的 Python 代码，不要添加不必要的注释
      - 避免冗长的变量名和多余的操作
      - 避免不必要的打印语句（仅打印关键结论或信息即可）

      **对于 Excel 文件本身**

      - 为复杂的公式或重要假设的单元格添加注释
      - 为硬编码值记录数据来源
      - 包含关键计算和模型部分的说明
  - path: section4.md
    content: |
      # Section 4:使用pandas读取和分析表格的用法要点：

      对于数据分析、可视化和基本操作，请使用 **pandas**，它提供了强大的数据处理能力：

      - 指定数据类型以避免推理问题：`pd.read_excel('file.xlsx', dtype={'id': str})`
      - 对于大文件，读取特定列：`pd.read_excel('file.xlsx', usecols=['A', 'C', 'E'])`
      - 正确处理日期：`pd.read_excel('file.xlsx', parse_dates=['date_column'])`

      ### ✅ 正确代码模式示例
      ```python
      # 1. 准备数据（只包含基础列，不包含计算结果）
      data = {'Price': [10, 20], 'Quantity': [5, 3]}
      df = pd.DataFrame(data)

      # 2. 写入基础数据
      for r in dataframe_to_rows(df, index=False, header=True):
          ws.append(r)

      # 3. 追加公式列（关键步骤！）
      # 假设数据在 A(Price) 和 B(Quantity) 列，我们在 C 列写入 Total
      ws['C1'] = "Total" # 补写表头
      for i in range(2, len(df) + 2): # 从第2行开始（避开表头）
          ws[f'C{i}'] = f'=A{i}*B{i}' # 写入公式
  - path: section5.md
    content: |
      # Section 5：代码示例：创建新的Excel文件：
      使用 openpyxl.Workbook() 创建工作簿，设置格式、公式与列宽。
      示例要点：

      ```python
      # 使用 openpyxl 进行公式和格式设置
      from openpyxl import Workbook
      from openpyxl.styles import Font, PatternFill, Alignment
      wb = Workbook()
      sheet = wb.active
      # 添加数据
      sheet['A1'] = 'Hello'
      sheet['B1'] = 'World'
      sheet.append(['Row', 'of', 'data'])
      # 添加公式
      sheet['B2'] = '=SUM(A1:A10)'
      # 格式设置
      sheet['A1'].font = Font(bold=True, color='FF0000')
      sheet['A1'].fill = PatternFill('solid', start_color='FFFF00')
      sheet['A1'].alignment = Alignment(horizontal='center')
      # 列宽
      sheet.column_dimensions['A'].width = 20
      wb.save('output.xlsx')
      ```
  - path: section6.md
    content: |
      # Section 6:代码示例：编辑现有的 Excel 文件：
      使用 load_workbook('existing.xlsx') 加载（默认会保留公式与格式）。
      处理多个工作表：for sheet_name in wb.sheetnames: ...
      常见操作：修改单元格、插入/删除行列、添加工作表、复制样式等。
      示例：

      ```python
      from openpyxl import load_workbook
        wb = load_workbook('existing.xlsx')
        sheet = wb.active
        sheet['A1'] = 'New Value'
        sheet.insert_rows(2)
        sheet.delete_cols(3)
        new_sheet = wb.create_sheet('NewSheet')
        new_sheet['A1'] = 'Data'
        wb.save('modified.xlsx')
      ```
