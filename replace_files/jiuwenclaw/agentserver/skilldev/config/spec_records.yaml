  - 禁止捏造信息：确保原始信息中的核心观点、关键数据、逻辑关系及重要细节完整保留，不遗漏、不篡改、不要补充任何信息，**严禁**捏造任何未提及的内容，对于未查询到的信息可以用**信息未提及**来填充。
