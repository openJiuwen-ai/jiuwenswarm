              width: 100%;
              min-width: 500px;
              border-collapse: collapse;
              font-size: 15px;
              background: var(--card-bg);
          }
  
          th {
              text-align: left;
              padding: 10px;
              background-color: var(--second-color);
              color: #FFFFFF;
          }
  
          td {
              padding: 8px;
              color: var(--text-sub);
          }
  
          .chart-row {
              display: flex;
              gap: 16px;
              flex-wrap: wrap;
              margin: 20px 0;
          }
  
          .chart-wrapper {
              flex: 1;
              min-width: 280px;
              background: var(--card-bg);
              border-radius: 12px;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
              padding: 12px;
          }
  
          .chart {
              width: 100%;
              height: 260px;
          }
  
          .highlight {
              color: var(--primary-color);
              font-weight: bold;
          }
  
          .alert-box {
              background: linear-gradient(#fff5f5 0%, #ffe5e5 100%);
              border-left: 4px solid var(--primary-color);
              border-radius: 8px;
              padding: 16px;
              margin: 16px 0;
          }
  
          .alert-box p {
              margin: 0;
              font-size: 16px;
              color: #333;
          }
  
          a {
              overflow-wrap: break-word;
              word-break: break-word;
          }
  
          .reference-item {
              counter-increment: reference-counter;
              display: flex;
              align-items: flex-start;
              gap: 12px;
              background: #f9f9f9;
              margin-bottom: 10px;
              padding: 10px 14px;
              border-radius: 8px;
              border-left: 3px solid #FF6B6B;
              transition: all 0.3s ease;
          }
  
          .reference-item:hover {
              background: #fff5f5;
          }
  
          .reference-item::before {
              content: counter(reference-counter) ".";
              font-weight: bold;
              color: #FF6B6B;
              flex-shrink: 0;
          }
  
          .reference-content {
              display: flex;
              flex-direction: column;
              gap: 6px;
              width: 100%;
          }
  
          .reference-text {
              font-size: 15px;
              white-space: normal;
              line-height: 1.5;
              width: 100%;
          }
  
          .reference-link {
              font-size: 14px;
              padding: 6px 8px;
              background: #ffe5e5;
              border-radius: 6px;
              color: #FF6B6B;
              text-decoration: none;
              width: 100%;
              display: block;
              word-break: break-all;
          }
  
          .reference-link:hover {
              background: #FF6B6B;
              color: #fff;
          }
  
          .image-container {
            max-width: 100%;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
          }
          
          .image-caption {
              margin-top: 8px;
              font-size: 14px;
              color: #666;
              text-align: center;
          }
  
          .content ul {
              margin: 16px 0 20px;
              padding-left: 28px;
              list-style-type: disc;
          }
  
          .content li {
              margin-bottom: 8px;
              font-size: 16px;
              line-height: 1.7;
              color: var(--text-sub);
              text-align: justify;
          }
  
          .content ul ::marker {
              color: var(--primary-color);
          }
  
          .content ol {
              margin: 16px 0 20px;
              padding-left: 28px;
          }
  
          .content ol ::marker {
              color: var(--primary-color);
          }
  
      </style>
  </head>
  <body>
  <header class="main-header">
      <div class="main-header-content">
          <div class="logo-area">
              <div class="logo-icon">
                  <img src="https://h5hosting-drcn.dbankcdn.cn/cch5/HAG/D1EhGq6uVycSFCiTp4GIqrxOQ/6920B2BF-ADA6-4D2A-E80D-3FFA675BD1C1.png"
                       alt="任务空间图标">
                  <span class="logo-text">小艺任务空间</span>
              </div>
              <button class="menu-btn" onclick="toggleMenu()">目录</button>
          </div>
          <div class="menu" id="menu">
              [[menu_content]]
          </div>
      </div>
  </header>
  <main>
      [[html_content]]
  </main>
  <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/echarts.min_5.4.3.js"></script>
  <script>
      const menu = document.getElementById('menu');
      let isOpen = false;
      let ticking = false;
      let isMenuScrolling = false;
  
      function toggleMenu() {
          isOpen = !isOpen;
          menu.classList.toggle('open', isOpen);
      }
  
      function closeMenu() {
          isOpen = false;
          menu.classList.remove('open');
      }
  
      if (menu) {
          menu.addEventListener('touchstart', () => {
              isMenuScrolling = true;
          }, {passive: true});
  
          menu.addEventListener('touchend', () => {
              isMenuScrolling = false;
          });
          menu.addEventListener('scroll', (e) => {
              e.stopPropagation();
          });
      }
  
      window.addEventListener('scroll', () => {
          if (!isOpen) return;
  
          ticking = true;
          requestAnimationFrame(() => {
              closeMenu();
              ticking = false;
          });
      });
  
      document.addEventListener('click', (e) => {
          if (isOpen && !e.target.closest('.main-header-content')) {
              closeMenu();
          }
      });
      
      /* 统计图定义 */
      [[scripts_content]]
  
  </script>
  </body>
  </html>

"prompt.router.mode.zh": |
  你是一个意图分类专家。负责基于用户输入判断意图类型。分类结果必须严格输出以下枚举之一：
  - ppt_mode
  - podcast_mode
  - general_mode
  - invalid_mode
  
  ### 规则：
  1. **invalid_mode**
  当出现以下场景时，直接判断为 invalid_mode
      A. 非法 / 无效输入（乱码、空内容等）

      #### A. 非法 / 无效输入判定标准
      评估标准
      1. **语言可识别性**：是否使用可理解的人类语言（如中文、英文等）
      2. **内容连贯性**：是否包含有意义的词语或完整句子
      3. **意图明确性**：是否表达明确的请求、问题或指令
      4. **乱码检测**：是否包含大量无意义字符组合（如随机键盘敲击）
  
      *无效意图特征（满足任一即无效，**禁止根据下列特征做任何扩展解释**）：
      - 大量纯随机字符（如"asdf!@#$"）
      - 重复无意义片段（如"测试测试测试"）
      - 空输入或空白字符
      - 整个输入明显不具备语义结构、无法推断任何合理意图的内容（仅出现小部分乱码，整个内容可以推断出意图的不需要判断为无效意图）
      - 请求处理或解析视频 / 音频内容的意图（如识别视频、分析音频语义等，**禁止做任何扩展联想,仅视频音频无法处理，其他形式的输入都能处理**）
  
      B. 暂不支持，执行会出现异常的场景
      当前以下场景因为能力限制原因无法执行任务：
        * 涉及消耗大量时间或者运算资源的任务，例如对代码的并发测试，长时间稳定测试等

  *有效意图特征（不能判定为invalid_mode）：
    - 包含可识别的词汇和语法结构
    - 形成完整的问题或请求
    - 表达明确目的（生成 / 设计 / 转换 / 分析 / 查询 / 操作等）
    - 上下文相关的合理内容
    - 对输入文件（PDF、Word、Excel 等）进行处理、解析、总结、转换等
    - 对输入**图片**进行处理、解析、总结、转换、识别、讲解、理解或说明等图片相关操作
    - 生成、创建、转换文件（PDF、Word、Excel 等），生成代码等操作或请求
  
  2. **ppt_mode**
     *当输出的文件类型要求是 ：PPT, ppt, pptx,  幻灯片, 演示文稿, presentation, slide deck, keynote, 简报, 课件, 展示文稿, slide show等内容，
      历史任务中出现以上关键词，不做为参考内容。
     *当输出的文件类型要求是其它类型的文件，不要选择ppt模型。
  3. **podcast_mode**
     *输入涉及制作/生成播客、音频节目、电台内容。
     *关键词包括但不限于：播客、音频节目、电台、podcast、audio show、广播、声音内容、制作播客、录制音频、生成播客等词汇。
     *只要出现以上任意关键词，立即分类为 podcast_mode，忽略其他判定。
  4. **general_mode**
  *强制规则：如果输入为分析、比较、生成、制定、汇报、推荐、评估等任务时，包含所有任务型、分析型、生成型请求，
  并且不包含podcast_mode的关键词则强制判断为general_mode
  要求生成HTML网页代码包括报告、网页小游戏、网页小工具都需归类到general_mode
  典型应用场景：<top 20 area>
      -旅游攻略生成（关键词如：旅游、攻略、旅行计划、行程生成）
      -健康管理方案（关键词如：健康计划、健身规划、饮食方案）
      -行业研究报告（关键词如：行业分析、市场研究、趋势研究）
      -学术文献分析（关键词如：文献综述、论文分析、学术研究）
      -市场趋势预测（关键词如：市场预测、趋势分析、未来动向、商业预测）
      -用户画像与行为分析（关键词如：用户分析、行为研究、画像构建、偏好分析）
      -竞品对标分析（关键词如：竞争对手分析、对标研究、产品比较、市场对标）
      -社会热点事件分析（关键词如：热点分析、事件解读、社会趋势、舆情分析）
      -职业发展路径（关键词如：职业规划、发展路径、生涯设计、晋升方案）
      -消费决策支持（关键词如：消费建议、购买决策、产品推荐、产品参数对比）
      -股票/基金分析（关键词如：股票分析、基金评估、投资分析、金融研究）
      -法律咨询解读（关键词如：法律分析、咨询解读、法规研究、案例解析）
      -美食推荐分析（关键词如：美食推荐、餐厅分析、饮食建议、菜品评价）
      -热点事件追踪（关键词如：事件追踪、新闻跟进、动态监测、进展分析）
      -不动产购置分析（关键词如：房产分析、购房建议、不动产研究、投资评估）
      -院校/专业对比（关键词如：学校对比、专业分析、择校建议、教育选择）
      -投资风险评估（关键词如：风险分析、投资评估、风险控制、财务风险）
      -品牌竞争力分析（关键词如：品牌分析、竞争力研究、市场地位、品牌价值）
      -家装方案推荐（关键词如：家装设计、装修方案、室内设计、装饰建议）
      -公众舆情分析（关键词如：舆情分析、公众意见、社会情绪、舆论研究）
  </top 20 area>
  *如果输入为处理<top 20 area>包含的主题，并且不包含podcast_mode的关键词则强制判断为general_mode：
  *强制规则：一切可通过 HTML 生成的数据、网页、报告或交互内容（如生成俄罗斯方块小游戏、数据可视化网页、动态报告等）均判断为 general_mode。
  *关键词：输入涉及制作 / 生成报告、网页报告、详细汇报、网页形式等关键词强制判断为general_mode。
  *除了其他模式（invalid_mode、ppt_mode、podcast_mode）以外的所有其他情况都兜底为general_mode。
  
  ### 输出要求：
  - 仅能输出json格式的输出，***禁止输出其他内容***。
  - 示例：
     {{
         "mode": "general_mode",
         "reason": ""
     }}

