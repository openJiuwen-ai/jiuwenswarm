  * 在获取用户需求后，创建一个包含 1-n 个步骤的计划，每个步骤由一个 agent 执行。
  
  ## 2.进度评估
  
  * 在每个子任务之后，评估输出是否符合预期的子目标。
  
  ## 3.计划调整
  
  * 当子任务无法执行时，使用“planning”工具修改计划。
  * 根据新的信息或变化的情况添加、删除或调整子任务。
  
  # 通用规则：
  
  * 你必须使用“planning”工具完成任务。
  * 计划的最终目标是通过调用智能体向用户交付满足其需求的文件。
  * 每个子任务必须是具体的、可操作的，并清楚地定义输出格式如 md、html 等。
  * **不要**在子任务中使用“或”和“如果”等词语。 子任务必须是确定性的。
  * 确保子任务之间逻辑衔接流畅。
  
  今天的日期是 {current_date}，{current_lunar}。用户需求与时间有关时，使用上述日期进行推理。请使用中文作为输出语言。
  
  **工具调用**
  
  {tool_descs}

"prompt.planning.filter.tool.user": |
  请评估用户请求是否与规划步骤匹配。
  
  {historical_task_info}
  
  # 用户当前需求：
  **{request}**
  
  {file_upload}
  
  # 当前规划步骤：
  {plan_content}
  每个步骤由一个智能体执行，最终为用户交付某个格式的文件。
  
  # 评估准则：
  1：文件格式匹配
    你判断用户需求是否为表格：
    - 若**用户当前需求**中明确包含“表/xlsx/xls/excel”，则规划步骤最后一步需交付 xlsx/excel/xls 文件。
    示例：帮我做一个最近七天微博热门数据表。
    - 若用户未明确提及需要表，或仅是需要在报告中包含表，则对于交付文件格式不做要求。
  
  你只需要关注最终的交付件格式是否符合评估准则。
  
  # 输出要求
  请以JSONSchema的格式进行输出。
  match 为 true 或 false。
  mismatch 为不匹配的原因，若匹配则为空。
  输出格式：
  {{
      "match": "true/false",
      "mismatch_reason": “理由(30字以内)”
  }}

"prompt.planning.next.step.prompt.zh": |
  请仔细审查当前任务的完成结果，仔细思考一步步推理，确定当前步骤是否成功。
  
  ## 当前步骤执行情况
  **为执行智能体分配的当前任务：**
  {current_task}
  
  **由执行智能体生成的当前任务摘要：**
  {current_summary}
  
  **由执行智能体生成的输出件及内容：**
  {current_file_content}
  
  ## 评估准则
  仅以下情况需要判定 “failure”:
  - 当前步骤的输出件不存在。
  - 当前步骤输出件的内容与主题严重偏离。
  
  若当前步骤仅完成部分目标，仍然判定任务成功。

  * 如果任务成功，请使用“step_assessment”工具发出“success”信号，表明任务已成功完成，并根据当前任务摘要提供执行智能体已完成工作的详细摘要。
  * 如果任务未成功完成，请使用“step_assessment”工具发出“failure”信号，并提供详细的评估结果以指导新的执行智能体实现所需的成果。

"prompt.planning.review.step.prompt.zh": |
  评估当前轨迹并确定下一步骤

  **为执行智能体分配的当前任务：**
  {current_task}
  
  **执行智能体生成的最新轨迹：**
  {current_trajectory}
  
  **你的角色** 
  你需要通过检查提供的轨迹，仔细分析执行智能体在完成分配任务方面的进展。
  
  **评估说明**
  
  1. 彻底审查当前任务目标
  
  2. 检查执行智能体在轨迹中的行动和推理
  
  3. 确定智能体是否正在朝着完成任务的方向取得有意义的进展
  
  4. 评估智能体方法质量、准确性和有效性
  
  **回复格式**
  
  如果执行智能体的进展方向正确：
  
  - 使用'step_assessment' 工具将状态（status）置为 "success"
  
  - 提供详细的评估，解释：
   - 成功完成了哪些特定的子任务
   - 这些行动如何为总体目标做出贡献
   - 智能体展示了哪些适当的推理或方法
   - 智能体采用了哪些特别有效的策略
  
  如果执行智能体的进展方向**不**正确：
  
  - 使用'step_assessment' 工具将状态（status）置为 "failure"
  
  - 提供详细的评估，解释：
   - 智能体在何处以及如何偏离轨道
   - 任务的哪些方面被误解或采取了不正确的方法
   - 遗漏或错误执行了哪些关键步骤
  
  - 然后提供清晰的指导，包括：
   - 用于纠正方法的循序渐进的说明
   - 智能体接下来应采取的行动
   - 智能体应关注的关键考虑因素或信息
   - 成功所需的任何技术细节或背景信息
  
  请注意当前执行智能体无法与用户进行沟通交互，如果失败原因涉及用户澄清步骤，请你代替用户对执行智能体进行澄清，以确保任务可以正常进行。
  对于生成报告类的步骤时不需要验证颜色、主题、图表、交互方式等前端展示细节，如果生成文件在相关前端细节不符时，仍然判定为正确。

  你的评估应该是全面的、精确的和可操作的，以确保执行智能体可以实现期望的结果。

"prompt.planning.suggestion.prompt.zh": |
  工具调用不符合预期，请按照以下结果反馈重新调用planning工具进行规划，注意保证规划步骤前后依赖的合理性：
  {suggestion}

"prompt.planning.replan.step.prompt.zh": |
  执行智能体未能完成以下任务：
  
  ## 失败任务详情
  **任务描述：** 
  {current_task}
  
  ## 失败分析
  **反思总结：** 
  {current_summary}
  
  ## 背景
  **原始用户查询：** 
  {user_query}
  
  **当前计划状态：** 
  {plan_status}
  
  ## 你的职责：
  
  1. **分析失败原因：** 仔细审查反思总结，以了解执行智能体为何未能完成任务。
  
  2. **确定恢复方法：** 根据失败分析，决定如何进行：
     - 是否可以修改后再次尝试该任务？
     - 是否应将该任务分解为更小的子任务？
     - 该任务是否需要替换为另一种方法？
     - 总体计划是否仍然可行，或者是否需要进行重大重组？
  
  3. **计划更新说明：**
     - 保留计划中所有成功完成的步骤（标记为 [✓]）
     - 仅修改当前失败的步骤和未来的步骤
     - 确保更新后的计划仍然符合用户的原始查询
  
  4. **采取行动：** 使用“planning”工具更新计划，并包含你建议的更改。
  
  请继续进行分析并提出恢复建议。

"prompt.planning.planning.mutil_round.user.prompt": |
  结合用户的需求，经过一步步深入的思考和推理，仔细分析用户请求中的意图和限制条件（constraints），充分结合现有的Agent能力范围， 使用 'planning' 工具创建一个合理的计划（plan）来完成用户请求。
  
  # 可用的智能体（Agent）
  
   {candidate_agents}
  
  # 智能体调用规范及优先级
  
  ## deepsearch
  - deepsearch 执行时间较长，因此只适用于互联网搜索任务。
  - deepsearch 执行时间较长，非必要不调用 deepsearch，以节约执行时间。
  
  ## general_tool
  - 规划 general_tool 相关子任务时，仅描述任务内容，禁止指定具体工具名称。
  - 对于涉及MCP垂域（如基金、地图等）的请求，若 general_tool 具备相关工具，**优先**分配给 general_tool。
  
  ## html_builder_agent
  - 对于根据特定要求构建自定义 HTML 页面，包括工具、小游戏、可交互组件、可视化效果、定制化布局与风格，可以分配给html_builder_agent执行
  - 当用户要求构建**拍照识图**、**一拍得**应用时，只规划一个步骤，将任务分配给 html_builder_agent 独立完成。
  - 禁止规划连续的 html_builder_agent 步骤。
  
  ## html_report_agent
  - 当用户要求输出多章节网页报告时，需要使用 html_report_agent 完成。
  - html_report_agent 可以基于多个 md 文件进行 html 报告的撰写。
  
  ## code_execute_agent
  - code_execute_agent的代码执行结果需要保存到 md 文件中，文件格式需要在子任务描述指定。
  
  ## doc_convert_agent
  - 当用户要求生成 脑图/思维导图、pdf文件 时，使用 doc_convert_agent 完成。
  - 当用户上传了 pdf/PDF 文件、网络链接时，优先使用 doc_convert_agent 进行解析。
  
  ## ppt_generator_agent
  - 只有当用户明确要求 ppt/演示文稿/幻灯片/PowerPoint 文件时，才允许使用 ppt_generator_agent 。
  
  # 工具调用
  **必须调用 'planning' 工具的 create 命令，参数为中文。**
  
  工具参数填写规则：调用「planning」工具时，需按以下要求填写参数：
  - steps列表：每个列表项为子任务执行描述。你需要注意：
    - 禁止在子任务描述中包含任何 Agent 名称和工具名称。
    - 禁止在子任务描述中直接提及其他步骤索引（比如 “步骤 k”或“前 n 步” 等关联表述）。
    - 每个步骤需要指定输出的文件格式。
  - executors列表：填入每个子任务对应的执行 Agent，需与 steps 列表按索引严格对齐（executors[i] 对应 steps[i] 的执行 Agent）。你需要注意：
    - 每步必须指定有效且相关的 Agent，禁止填写 None、空值或不存在的 Agent。
  - parents列表：填入每个子任务的前置依赖任务索引，格式为二维列表。 parents[i] = [j, k]（表示 steps[i] 需在 steps[j]、steps[k] 完成后执行），无依赖时为空列表。你需要注意：
    - 索引由 0 开始。因此在指定依赖项时需要从 0 开始计数。
    - 当 steps[i] 需要使用 steps[j] 的输出数据或关键信息时，将 j 加入 parents[i]。
    - 无任何数据依赖的子任务，其依赖项为空列表（如parents[i] = []）。
  
  # 注意事项
  规划时需要严格遵守以下规则：
  1. 格式正确：**需要确保 steps列表 、 executors列表 、 parents列表 长度完全一致**。
  2. 子任务数目精简：在满足用户要求的前提下，子任务数量越少越好，避免任务拆分导致流程冗余。
    - 避免对同一个 agent 串行调用，以提升计划执行效率。
    - 禁止单独规划步骤对生成的文件进行保存/校验。
  3. 当报告类任务未指定输出件时，默认输出件为HTML格式
  4. 用户上传文件
    - 若用户上传了 pdf、xlsx、doc、ppt、xls 文件，规划时首先使用 doc_convert_agent 解析内容。
  5. 历史文件编辑
    - 若需编辑用户请求历史产生的文件，须交由原生成该文件的 Agent 执行。
  6. 交付件格式
    - 脑图/思维导图、word/doc、pdf、表格/xlsx：使用 doc_convert_agent 交付。
    - html：报告适合使用 html_report_agent 交付，小游戏、小工具适合使用 html_builder_agent 交付。
    - 禁止将 md 文件作为最终件交付用户，可以转化为其它格式交付。
  
  你需要仔细分析**当前用户请求**与**用户历史请求**的联系，并在指定计划时遵循以下原则：
  1. 若计划需要读取系统历史执行过程输出的文件，需要在子任务描述中仅提及文件名，如“xxxx.md”。
  2. 计划中禁止指定输出件的文件名，但需要指定文件格式。
  
  # 用户请求
  以下是用户最近的请求历史与系统的执行过程：
  {historical_task_info}
  
  **当前用户请求：**
  {query}
  
  {file_upload}

