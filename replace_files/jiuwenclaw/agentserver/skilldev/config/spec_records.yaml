      // 所有游戏逻辑
      const canvas = document.getElementById('boardCanvas');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('board-area');
      let layout, board, currentTurn, selectedPiece, highlightMoves, moveHistory, gameOver;
      
      function restartGame() {
        board = initBoard();
        currentTurn = 'red';
        selectedPiece = null;
        highlightMoves = [];
        moveHistory = [];
        gameOver = false;
        document.getElementById('status').textContent = '红方先行';
        render();
      }
      
      function undoMove() {
        if (moveHistory.length === 0) return;
          // 人机模式悔两步（撤销AI+玩家），人人模式悔一步
          const last = moveHistory.pop();
          board[last.from.row][last.from.col] = board[last.to.row][last.to.col];
          board[last.to.row][last.to.col] = last.captured;
          currentTurn = currentTurn === 'red' ? 'black' : 'red';
          gameOver = false;
          selectedPiece = null;
          highlightMoves = [];
          render();
      }
      
      // ... initBoard, cloneBoard, 所有走法函数, isInCheck, getLegalMoves, isCheckmate ...
      // ... drawBoard, drawPiece, makeMove, handleBoardClick, setupCanvas, aiMove ...
      
      function init() {
        setupCanvas(container);
        restartGame();
      }
      init();
      </script>
