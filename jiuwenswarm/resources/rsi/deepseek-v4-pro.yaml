# RSI loads these capacity/timeout defaults automatically for the roles below.
# They override generic model settings only in private RSI task model files.
# The selected model, endpoint, credentials and global configuration are unchanged.
# Gateway-specific RSI limits can be set here without changing other modules.
rsi_optimizer_roles: [analysis, member_optimization, judge]
models:
  defaults:
    - alias: rsi-optimizer
      model_client_config:
        model_name: deepseek-v4-pro
        client_provider: OpenAI
        api_base: ${RSI_OPTIMIZER_API_BASE}
        api_key: ${RSI_OPTIMIZER_API_KEY}
        timeout: 900
        max_retries: 0
        verify_ssl: true
      model_config_obj:
        context_window: 1048576
        max_tokens: 100000
