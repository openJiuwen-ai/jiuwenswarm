# 配置版本号：与程序版本（jiuwenswarm/common/_build_config.py 的 VERSION）同步。
# 空串表示未迁移，首次启动迁移后由程序写回实际版本。
config_version: ""

# 前端显示语言：zh（中文）/ en（英文），与 Web 界面语言切换同步
preferred_language: zh

# Agent 模式是否启用渐进式工具暴露（tool_search + deferred 工具）
# true：只向模型暴露 direct 工具和 tool_search，其他工具按需搜索；
# false：不挂载 ProgressiveToolRail，未显式声明 exposure 的工具按 direct 暴露。
# ToolCard 自己显式声明的 exposure 优先级更高。
progressive_tool_enabled: true

# Web 首次模型配置引导；用户确认完成后会自动关闭，可通过侧栏问号再次打开
setup_guide:
  enabled: true

# auto-recap：用户空闲5分钟后自动生成会话摘要（TUI 端）
auto_recap:
  enabled: true

a2ui:
  enabled: false
  protocol_version: "0.8"
  stream_validation_enabled: true
  non_web_fallback_enabled: false
  dev_smoke_tools_enabled: false

symphony:
  enabled: false
  paths:
    skills_root: ""
    graph_dir: ""

  fingerprint:
    scan:
      max_depth:
    extraction:
      workers: 4
      batch_size: 2
      body_limit:

  build:
    workers: 4
    batch_size: 16
    max_candidates_per_skill_relation: 32
    require_consensus: false
    min_edge_confidence: 0.5

  evolution:
    enabled: false  # true = 消费 Session 轨迹并使用动态 overlay

  orchestration:
    # fast is the default one-shot path; beam enables bidirectional search.
    mode: fast
    # Beam-only candidate count retained after each search round.
    top_k: 3
    max_depth: 4
    min_edge_confidence: 0.5

  skill_retrieval:
    enabled: false
    # Controls taxonomy construction and consumption independently of discovery.
    # Enabling it never changes a live session's frozen directory strategy.
    index:
      enabled: false
    artifact_root: ${SYMPHONY_SKILL_RETRIEVAL_ROOT:-}
    discovery:
      # Strictly below the fixed 1% context threshold, a new session receives
      # a complete metadata snapshot; larger inventories use skill_index.
      max_output_chars: 12000
      incremental_notice_max_chars: 4000
      prompt_preferred_skills:
        - skill-creator
        - swarmskill-creator
        - symphony-assistant
    build:
      # A failed refresh keeps the last usable taxonomy available to discovery.
      preserve_previous_index_on_failure: true
    # Index construction uses the default configured model. An optional llm
    # mapping can override model, api_key, base_url and seed for this builder.

# Auto Memory：对话结束后自动提取记忆，按项目隔离存储
# 存储路径：~/.jiuwenswarm/projects/{sanitized-project-path}/memory/
# 类似 Claude Code 的 auto-memory 功能
auto_memory_enabled: false

# 日志目录：~/.jiuwenswarm/agent/.logs/
# gateway.log / channel.log / agent_server.log 按源码路径分流；full.log 为汇总。
# level：未单独指定时的默认级别。console_level：控制台；可省略则用 level。
# 环境变量 LOG_LEVEL 仅覆盖控制台级别（不覆盖各日志文件）。
logging:
  level: INFO
  console_level: INFO
  gateway: INFO
  channel: INFO
  agent_server: INFO
  full: INFO

memory:
  # ============================================================
  # 记忆系统配置
  # ============================================================
  # 两个正交开关：
  #   1) engine — 挂载哪套 rail（内置 / 外接 / 都挂 / 都不挂）
  #   2) mode   — 内置记忆的存储位置（local | cloud），不影响外接
  #
  # 外接 rail 的启用 = (engine ∈ {external, both}) AND (external.provider 非空)
  # 内置 rail 的启用 = (engine ∈ {builtin, both})  AND (mode=local)
  #                    AND modes.agent.memory.enabled=true
  # ============================================================

  mode: ${MEMORY_MODE:-local}            # 内置记忆存储位置：local | cloud
  # 记忆引擎总开关：builtin | external | both | none
  #   builtin  — 仅内置记忆（默认，兼容旧配置）
  #   external — 仅外接记忆（LTM / Mem0 / OpenViking / 插件）
  #   both     — 内置 + 外接并存
  #   none     — 全部关闭
  engine: ${MEMORY_ENGINE:-builtin}
  forbidden_memory_definition:
    enabled: false
    patterns: []
    description:
      zh: "以下内容禁止记忆：（用户自行补充，如身高、体重、姓名等，建议用逗号分隔）"
      en: "The following content is forbidden to remember: (To be supplemented by users, e.g., height, weight, name, etc. Separate items with commas recommended)"

  # ------------------------------------------------------------
  # 外接记忆（External Memory）
  # ------------------------------------------------------------
  # 启用方式（任选一种）：
  #
  # 【方案 1：YAML 直接改】
  #   memory.engine: external   # 或 both
  #   memory.external.provider: mem0   # 选一个：openjiuwen | mem0 | openviking | jiuwenmemory
  #   # 然后在下方对应的 mem0/openjiuwen/openviking 子段填 api_key 或 endpoint
  #
  # 【方案 2：环境变量覆盖】
  #   export MEMORY_ENGINE=external
  #   export MEMORY_EXTERNAL_PROVIDER=mem0
  #   export MEM0_API_KEY=sk-xxx
  #
  # 【关闭外接记忆】
  #   把 memory.engine 改回 builtin 或 none；
  #   或把 memory.external.provider 留空（两者任一生效即可禁用）
  #
  # 【挂载模式常见组合】
  #   ┌─────────────┬───────────────┬──────────────────────────────────────┐
  #   │ engine      │ provider      │ 效果                                 │
  #   ├─────────────┼───────────────┼──────────────────────────────────────┤
  #   │ builtin     │ *             │ 只挂内置（默认；外接即使填了也不挂） │
  #   │ external    │ openjiuwen    │ 只挂外接 LTM                         │
  #   │ external    │ mem0          │ 只挂外接 Mem0                        │
  #   │ external    │ openviking    │ 只挂外接 OpenViking                  │
  #   │ external    │ jiuwenmemory │ 只挂外接 Jiuwen（远程 agent-memory） │
  #   │ external    │ <plugin-name> │ 只挂用户安装的插件                   │
  #   │ both        │ 任一          │ 内置 + 外接同时挂（LLM 两套工具并列）│
  #   │ none        │ *             │ 全关，任何记忆 rail 都不挂           │
  #   └─────────────┴───────────────┴──────────────────────────────────────┘
  #
  # 说明：
  # - 外接记忆 mode-independent：配置一次，agent 模式全程生效，
  #   跨 config 热重载持久存活（保留 prefetch 缓存、电路断路器、会话状态）
  # - 单 provider 策略：同一时刻 provider 只能选一个
  # - 失败降级：provider 构建失败或网络异常不阻塞主流程
  external:
    # 选哪家 provider。空字符串 = 禁用外接（等价于 engine=builtin）
    provider: ${MEMORY_EXTERNAL_PROVIDER:-}   # '' | openjiuwen | mem0 | openviking | lakebase | jiuwenmemory | <plugin-name>
    # 数据隔离标识（所有 provider 共用）
    user_id: ${MEMORY_USER_ID:-__default__}
    scope_id: ${MEMORY_SCOPE_ID:-__default__}

    # -- OpenJiuwen LTM（本地长期记忆：KV + 向量 + DB）--
    # 生效条件：provider='openjiuwen'
    # 依赖顶层 embed 段提供 embedding 配置（不单独配置 api_key）
    openjiuwen:
      kv_type: shelve                                    # shelve | in_memory | sqlite
      kv_path: ${MEMORY_KV_PATH:-}                       # 默认 ~/.jiuwenswarm/memory/ltm/kv
      vector_type: chroma                                # chroma
      vector_persist_dir: ${MEMORY_VECTOR_DIR:-}         # 默认 ~/.jiuwenswarm/memory/ltm/chroma
      db_type: sqlite
      db_path: ${MEMORY_DB_PATH:-}                       # 默认 ~/.jiuwenswarm/memory/ltm/ltm.db

    # -- Mem0（云端事实抽取+语义检索）--
    # 生效条件：provider='mem0'
    # 必填：api_key（从 mem0.ai 获取）
    mem0:
      api_key: ${MEM0_API_KEY:-}
      user_id: ${MEM0_USER_ID:-jiuwenswarm-user}
      agent_id: ${MEM0_AGENT_ID:-jiuwenswarm}
      rerank: true                                       # 搜索结果重排序（更准但更慢）

    # -- OpenViking（字节上下文数据库）--
    # 生效条件：provider='openviking'
    # 必填：endpoint 可访问
    openviking:
      endpoint: ${OPENVIKING_ENDPOINT:-http://127.0.0.1:1933}
      api_key: ${OPENVIKING_API_KEY:-}
      account: ${OPENVIKING_ACCOUNT:-root}
      user: ${OPENVIKING_USER:-default}

    lakebase:
      api_key: ${LAKEBASE_API_KEY:-}
      base_url: ${LAKEBASE_API_URL:-}
      base_id: ${LAKEBASE_MEM_BASE_ID:-}
      database_id: ${LAKEBASE_DATABASE_ID:-}

    # -- Jiuwen Memory（agent-memory 引擎，server 或 sdk 两种接入）--
    jiuwen:
      # 接入方式：server = 调远程 HTTP 服务；sdk = 进程内装配内核直连后端
      mode: ${JIUWEN_MEMORY_MODE:-server}            # server | sdk
      tenant_id: ${JIUWEN_MEMORY_TENANT_ID:-default} # org 轴
      infer_turns: true                               # true=对话提炼为去重事实；false=原文存储
      save_assistant_turns: false                     # 是否一并存助手回复（默认只存用户轮）

      # ---- server 模式专用（mode=server）----
      server:
        base_url: ${JIUWEN_MEMORY_BASE_URL:-http://127.0.0.1:8137}
        api_key: ${JIUWEN_MEMORY_API_KEY:-}
        read_timeout: 30.0
        write_timeout: 120.0

      # ---- sdk 模式专用（mode=sdk）----
      # 进程内装配 agent-memory 内核，直连后端。
      # 只需配三个后端的 type + url；LLM/embedding 复用 jiuwenswarm 顶层配置
      # （models.defaults[is_default=true] + embed 段），不在此重复配。
      # rerank/graph 等不开放，由 builder 写死关闭。
      # 需要 agent-memory 已安装（pip install JiuwenMemory）。
      sdk:
        # KV 真源：sqlite（落盘文件） | redis（远程） | memory（进程内，重启丢）
        kv_type: ${JIUWEN_KV_TYPE:-redis}
        kv_url: ${JIUWEN_KV_URL:-redis://localhost:6379/0}   # sqlite=文件路径；redis=redis://host:port/db
        # 向量索引：milvus（远程 ANN） | memory（进程内暴力余弦）
        vector_type: ${JIUWEN_VECTOR_TYPE:-milvus}
        vector_url: ${JIUWEN_VECTOR_URL:-http://localhost:19530}   # milvus=http://host:19530
        # 全文/关系：elasticsearch（BM25） | memory（进程内倒排）
        db_type: ${JIUWEN_DB_TYPE:-elasticsearch}
        db_url: ${JIUWEN_DB_URL:-http://localhost:9200}   # elasticsearch=http://host:9200
        # 可选覆盖（缺省复用顶层 embed 配置）
        embedder_dim: ${JIUWEN_EMBEDDER_DIM:-1024}     # 须与向量库 dim 一致

proactive_recommendation:
  enabled: false                # 总开关
  max_recommend_per_day: 10               # 每天最多推荐次数
  max_rounds_per_tick: 20                # 每次 Tick 读取最近几轮对话

# 自建网关方言覆盖表：api_base 的 host -> agent-core endpoint_profile。
# 自建推理服务（如 vLLM/SGLang 起的 DashScope 风格服务，思考开关认
# enable_thinking / thinking_budget、忽略官方 thinking.type）无法从域名
# 识别方言时，在此按 host 声明；保存、校验、运行时各路径会自动补
# endpoint_profile 透传给 core。示例：
# endpoint_profile_overrides:
#   "10.0.0.1": "vllm"
# 留空表示不做任何推断；模型条目里显式配置的 endpoint_profile 始终优先。
endpoint_profile_overrides:

models:
  # 开启后实时拉取可用的免费模型，注意免费模型可能有限流、限窗口大小等限制。
  enable_free_models: true
  defaults:
    - model_client_config:
        api_base: ${API_BASE}
        api_key: ${API_KEY}
        model_name: ${MODEL_NAME}
        client_provider: ${MODEL_PROVIDER}
        # endpoint_profile：仅 OpenAI 协议(client_provider=OpenAI)生效的端点方言。
        #   openai(官方/默认)、deepseek、openrouter、siliconflow、dashscope、
        #   openai_compatible(KV释放/亲和)、ollama、lmstudio、vllm、sglang。
        #   client_provider=Anthropic 时此字段被忽略。
        #   若用 ${MODEL_PROVIDER}=DeepSeek/SiliconFlow/DashScope/OpenRouter 等旧别名，
        #   core 内部会归一，但方言更稳妥的做法是这里显式填 endpoint_profile。
        endpoint_profile: ${ENDPOINT_PROFILE:-openai}
        # HTTP 请求超时（秒）。需严格 > stream_first_chunk_timeout，确保先触发应用层流超时（可被 ModelAnomalyDetectionRail 重试）
        timeout: 360
        # 流式：等待首个分片的最大时间（秒）。放宽以兼容 reasoning/思考模型思考期的静默
        stream_first_chunk_timeout: 300
        # 流式：分片之间的最大空闲等待时间（秒）
        stream_idle_timeout: 120
        verify_ssl: true
        custom_headers: {}
      model_config_obj:
        temperature: 0.95
        # 模型支持的上下文总长度（tokens）。每个模型条目均可配（与 timeout 一样，
        # defaults / agentos / video / audio / vision / image_gen 均可填）。
        # 经 _build_model_from_entry 放进 core 的 ModelRequestConfig，供 core 从
        # ModelRequestConfig 取值（core 侧加 context_window 正式字段后读取）。
        # "模型侧不会感知" = 不发往厂商，由 jiuwenswarm 出口按 core 字段状态自动适配
        # （reasoning_injector.core_has_context_window_field）：core 未把 context_window
        # 加为 ModelRequestConfig 正式字段时，它进 extra 会被 base_model_client 经
        # model_dump 透传给厂商 SDK 报 unexpected keyword argument，故此时 jiuwenswarm
        # 公共出口对 context_window 统一 pop 防发厂商；core 加正式字段后
        # （届时 core 自行 exclude 不发厂商、self.model_config.context_window 可读），
        # jiuwenswarm 自动停止 pop，把值留给 core。无需人工同步。
        # 不填 = core 按模型名查表 / 兜底 200000。
        context_window: 131072
      is_default: true
  video:
      model_client_config:
        api_base: ${VIDEO_API_BASE}
        api_key: ${VIDEO_API_KEY}
        model_name: ${VIDEO_MODEL_NAME}
        client_provider: ${VIDEO_PROVIDER}
        # 端点方言；若走 DashScope 多模态口填 dashscope，否则 openai/openai_compatible。
        endpoint_profile: ${VIDEO_ENDPOINT_PROFILE:-openai_compatible}
        timeout: 1800
        verify_ssl: true
      model_config_obj:
        temperature: 0.95
  audio:
      model_client_config:
        api_base: ${AUDIO_API_BASE}
        api_key: ${AUDIO_API_KEY}
        model_name: ${AUDIO_MODEL_NAME}
        client_provider: ${AUDIO_PROVIDER}
        # 端点方言；若走 DashScope 多模态口填 dashscope，否则 openai/openai_compatible。
        endpoint_profile: ${AUDIO_ENDPOINT_PROFILE:-openai_compatible}
        verify_ssl: true
        timeout: 1800
      model_config_obj:
        temperature: 0.95
  vision:
      model_client_config:
        api_base: ${VISION_API_BASE}
        api_key: ${VISION_API_KEY}
        model_name: ${VISION_MODEL_NAME}
        client_provider: ${VISION_PROVIDER}
        # 端点方言；若走 DashScope 多模态口填 dashscope，否则 openai/openai_compatible。
        endpoint_profile: ${VISION_ENDPOINT_PROFILE:-openai_compatible}
        verify_ssl: true
        timeout: 1800
      model_config_obj:
        temperature: 0.95
  image_gen:
      model_client_config:
        api_base: ${IMAGE_GEN_API_BASE}
        api_key: ${IMAGE_GEN_API_KEY}
        model_name: ${IMAGE_GEN_MODEL_NAME}
        client_provider: ${IMAGE_GEN_PROVIDER}
        # 多模态生成(生图)走 DashScope SDK 必须带 endpoint_profile=dashscope，
        # 否则 OpenAIModelClient 拒绝该操作。client_provider 仍为 OpenAI。
        endpoint_profile: ${IMAGE_GEN_ENDPOINT_PROFILE:-dashscope}
        verify_ssl: true
        timeout: 1800
      model_config_obj:
        temperature: 0.95
  # Text-to-video. When unset, falls back to models.image_gen credentials
  # (same DashScope / provider API) with default model wan2.6-t2v.
  video_gen:
      model_client_config:
        api_base: ${VIDEO_GEN_API_BASE}
        api_key: ${VIDEO_GEN_API_KEY}
        model_name: ${VIDEO_GEN_MODEL_NAME}
        client_provider: ${VIDEO_GEN_PROVIDER}
        verify_ssl: true
        timeout: 1800
      model_config_obj:
        temperature: 0.95
  # ---- AgentOS 备份模型（可选，不预置；需手动添加）----
  # 此处不预置任何 agentos 条目：jiuwenswarm-init 生成的 config.yaml 不含 agentos 字段。
  # 如需启用备份模型，请手动在 config.yaml 添加 models.agentos 列表段（见文档）。
  # 配置后 AgentServer 启动/热重载时自动检测加载，与 defaults 同等可选可切换，
  # 但 is_default 始终为 false，不抢启动主对话默认。
  # 列表结构，可配多个备份模型，凭证直接填在 YAML，无环境变量。
  # 每个元素一个模型；model_name 为空 = 该条未配置，跳过不入缓存。
  # 填入后通过 models.list 可见、可按名切换，但不带 is_default，
  # 绝不抢主对话，仅在被显式选中时使用。
  # 可配多条备份模型。填写约束：(model_name, api_base, api_key) 三元组唯一，
  # 即不存在完全相同的两条；同名（base 或 key 不同）可共存，靠缓存
  # {model_name}#{index} 区分。
  # context_window：模型支持的上下文总长度（tokens）。每个模型条目均可配
  #   （defaults / agentos / video / audio / vision / image_gen 均可填，
  #   放在各自 model_config_obj 段下，与 timeout 同为每模型可配项）。
  #   经 _build_model_from_entry 放进 core 的 ModelRequestConfig，供 core 人员
  #   从 ModelRequestConfig 取值（core 侧加 context_window 正式字段后读取）。
  #   "模型侧不会感知" = 不发往厂商，由 jiuwenswarm 出口按 core 字段状态自动适配
  #   （reasoning_injector.core_has_context_window_field）：core 未把 context_window
  #   加为 ModelRequestConfig 正式字段时，它进 extra 会被 base_model_client 经
  #   model_dump 透传给厂商 SDK 报 unexpected keyword argument，故此时 jiuwenswarm
  #   公共出口对 context_window 统一 pop 防发厂商；core 加正式字段后
  #   （届时 core 自行 exclude 不发厂商、self.model_config.context_window 可读），
  #   jiuwenswarm 自动停止 pop，把值留给 core。无需人工同步。
  #   不填 = core 按模型名查表 / 兜底 200000。
  # agentos:
  #   - model_client_config:
  #       api_base: ""
  #       api_key: ""
  #       model_name: ""
  #       client_provider: ""
  #       verify_ssl: true
  #       timeout: 1800
  #     model_config_obj:
  #       temperature: 0.95
  #       context_window: 131072

# 外接 ACP Agent（stdio），供工具 acp_chat 使用。按需取消注释并填写；command/args 可指向任意兼容 ACP 的包（与 VS Code formulahendry.acp-client 预置列表一致）。
acp_agents:
   codex:
     command: npx
     args: ["@zed-industries/codex-acp@latest"]
     cwd:
     env:
       OPENAI_API_KEY: ${OPENAI_API_KEY}   # 仅由此 env 注入子进程（不读 workspace .env / 父进程）

# ============================================================
# Agent 配置（可被 team.agents / modes.team.<name>.agents 引用）
# ============================================================
# 每个 agent 定义一个可复用的 agent 配置模板，支持以下字段（均可选）：
#
#   model:                  # 不配则继承 models.default
#     model_client_config:
#       client_provider: OpenAI
#       api_base: https://api.deepseek.com
#       api_key: sk-xxx
#       timeout: 1800
#       verify_ssl: true
#       custom_headers: {}
#     model_request_config:
#       model: deepseek-chat
#   skills:                 # 不配则不自动填充
#     - skill_a
#     - skill_b
#   workspace:              # 默认 {"stable_base": true}
#     stable_base: true
#   max_iterations: 200     # 默认 200
#   completion_timeout: 600.0  # 默认 600.0
#
# 示例：给不同 agent 配置不同模型和技能
#   agent_coder:
#     model:
#       model_client_config:
#         client_provider: OpenAI
#         api_base: https://api.deepseek.com
#         api_key: sk-xxx
#       model_request_config:
#         model: deepseek-chat
#     skills:
#       - code_review
#       - unit_test
#     max_iterations: 300
#
agents:
  agent_leader:
    workspace:
      stable_base: true
    max_iterations: 200
    completion_timeout: 6000.0

  agent_teammate:
    workspace:
      stable_base: true
    max_iterations: 200
    completion_timeout: 6000.0

telemetry:
  enabled: false                    # 总开关（环境变量 OTEL_ENABLED 优先）
  exporter: otlp                    # otlp / console / none
  endpoint: http://localhost:4317   # OTLP endpoint
  protocol: grpc                    # grpc / http
  headers: {}                       # 公共 OTLP headers，可被 traces/metrics 覆盖
  log_messages: true                # 是否在 span event 中记录完整消息内容
  service_name: jiuwenswarm
  provider_factory:                 # 自定义 provider factory，格式：module:function
  traces:
    exporter:                       # trace exporter，默认回退到 telemetry.exporter
    endpoint:                       # trace endpoint，默认回退到 telemetry.endpoint
    protocol:                       # trace protocol，默认回退到 telemetry.protocol
    headers: {}                     # trace headers，默认回退到 telemetry.headers
  metrics:
    exporter:                       # metrics exporter，默认回退到 telemetry.exporter
    endpoint:                       # metrics endpoint，默认回退到 telemetry.endpoint
    protocol:                       # metrics protocol，默认回退到 telemetry.protocol
    headers: {}                     # metrics headers，默认回退到 telemetry.headers

# ============================================================
# Team 可观测性配置（OTel + Langfuse）
# ============================================================
# 与 telemetry 不同，team_observability 专门用于 TeamAgent 的
# 可观测性追踪，包括 team/member/task/message 级别的 span。
# 启用后会自动将 OtelTeamMonitorHandler 注册到 TeamAgent，
# 将事件转为 OTel span 导出到 Langfuse / OTLP Collector。
#
# 前置条件：
#   1. 启动 OTel Collector + Langfuse
#   2. 在用户配置中设置 team_observability.enabled: true
# ============================================================
team_observability:
  enabled: true                    # Team observability 总开关
  exporter: file                    # otlp_grpc / otlp_http / file
  endpoint: http://localhost:4317   # OTLP gRPC endpoint（file 模式不需要）
  service_name: jiuwenswarm         # 服务名称（OTel resource service.name）
  sample_rate: 1.0                  # 采样率 (0.0-1.0)
  redact_prompts: false             # 是否脱敏 prompt 内容
  redact_completions: false         # 是否脱敏 completion 内容
  attribute_value_max_length: 10240 # OTel attribute value 最大长度
  langfuse_public_key: ""           # Langfuse OTLP 认证 public key（可选）
  langfuse_secret_key: ""           # Langfuse OTLP 认证 secret key（可选）
  traces_dir: ""                    # file exporter 输出目录，默认 ~/.jiuwenswarm/.trace
  file_retention_days: 7            # file exporter 文件保留天数

# ============================================================
# 单 Agent / Coding Agent 可观测性配置
# ============================================================
# 与 team_observability 对应，但作用于非 team 的运行路径
#（Runner.run_agent / Runner.run_agent_streaming，即 agent.* 与 code.* 模式）。
# 启用后会调用 init_observability() 注册全局 OtelCallbackHandler，
# 自动为 LLM 调用与工具调用生成 span（不含 team/member/task 级 span，
# 那是 team 模式专属）。
#
# 注意：OTel 一个进程只允许一个全局 TracerProvider。若本进程内 team 与
# agent 可观测性同时开启，先初始化的一方生效，另一方复用同一个 provider
#（其 exporter/endpoint 会被忽略）。代码层面用 demand 状态保证
# 关闭时不会误拆对方依赖的 provider。
#
# 前置条件（otlp 模式）：启动 OTel Collector + Langfuse。
# ============================================================
agent_observability:
  enabled: false                    # 单 agent 可观测性总开关
  exporter: file                    # otlp_grpc / otlp_http / file
  endpoint: http://localhost:4317   # OTLP gRPC endpoint（file 模式不需要）
  service_name: jiuwenswarm-agent   # 服务名称（OTel resource service.name）
  sample_rate: 1.0                  # 采样率 (0.0-1.0)
  redact_prompts: false             # 是否脱敏 prompt 内容
  redact_completions: false         # 是否脱敏 completion 内容
  attribute_value_max_length: 10240 # OTel attribute value 最大长度
  langfuse_public_key: ""           # Langfuse OTLP 认证 public key（可选）
  langfuse_secret_key: ""           # Langfuse OTLP 认证 secret key（可选）
  traces_dir: ""                    # file exporter 输出目录，默认 ~/.jiuwenswarm/.trace
  file_retention_days: 7            # file exporter 文件保留天数

# ============================================================
# Agent / Code 调试链路追踪（Debug Trace）配置
# ============================================================
# 控制非 team 模式（agent.* / code.*）的人类可读本地 dump。
# 生效逻辑（resolve_debug_trace_settings）：
#   debug_enabled = 请求带 /debug OR debug_trace.<mode>.enabled
#   dump_enabled  = debug_enabled AND debug_trace.<mode>.dump_enabled != false
# dump 写入 ~/.jiuwenswarm/.agent/traces/ 或 .code/traces/（按模式）。
# 与 agent_observability（OTel span）相互独立：本块只管本地文本 dump，
# OTel 接入在后续阶段。
# ============================================================
debug_trace:
  agent:                            # agent 模式（agent.plan / agent.fast …）
    enabled: false                  # 仅 agent 模式开关
    dump_enabled: true              # debug 开启时是否写本地 dump
    otel_enabled: false             # debug 时是否顺带 force-enable agent_observability（产 OTel span）
    include_model_output: true      # 记录模型文本输出
    include_reasoning: true         # 记录推理片段
    include_tool_args: true         # 记录工具参数
    include_tool_result: true       # 记录工具结果
    include_subagent_flow: true     # 采集子 agent chunk 进同一 dump（内置 task / 自定义 / 后台子 agent）
  code:                             # code 模式（code.normal / code.plan …）
    enabled: false
    dump_enabled: true
    otel_enabled: false             # debug 时是否顺带 force-enable agent_observability（产 OTel span）
    include_model_output: true
    include_reasoning: true
    include_tool_args: true
    include_tool_result: true
    include_subagent_flow: true     # 采集子 agent chunk 进同一 dump（内置 task / 自定义 / 后台子 agent）
  limits:
    tool_args_max_chars: 2000       # 工具参数截断阈值
    tool_result_max_chars: 8000     # 工具结果截断阈值
    generic_payload_max_chars: 4000 # 通用载荷/run input 截断阈值
    max_model_output_chars:         # 空=不截模型输出；填数字则截断
  redaction:
    redact_prompts: false           # 脱敏 prompt/completion（密钥字段始终打码）
    redact_completions: false

react:
  agent_name: main_agent
  enable_task_loop: true
  # 单轮任务循环等待上限（秒）；null 表示不限时，避免长任务被静默截断
  completion_timeout: null
  max_iterations: 100
  model_name: ${MODEL_NAME}
  skill_mode: all
  # code_agent / research_agent 默认不启用；只有显式配置 enabled: true 才会显示并可被 task_tool 调用
  # browser_agent: code.team 路径通过此 key 门控（单 agent 路径仍由 browser runtime 开关决定）
  subagents:
    statusline-setup:
      enabled: true
      max_iterations: 15
    general_agent:
      enabled: true
    code_agent:
      enabled: false
      # max_iterations: 15
    research_agent:
      enabled: false
      # max_iterations: 15
    browser_agent:
      enabled: true
      # Browser Agent 独立轮次预算；未配置时默认 100。
      # max_iterations: 100
  # 常驻 subagent 运行时。开启后 task_tool 被 subagent_spawn/wait/list/
  # send_input/close/resume 六个工具替换（两者互斥）。默认开启。
  subagent_runtime:
    enabled: true
  answer_chunk_size: 500
  stream_chunk_threshold: 50
  stream_character_threshold: 2000
  kv_cache_affinity_config:
    enable_kv_cache_release: false
    enable_kv_cache_affinity: false
  # ============ 上下文引擎（上下文压缩/召回/会话记忆）============
  context_engine_config:
    enabled: true # 全局开关：false 时整个上下文引擎（含下列所有处理器）不生效
    enable_openrouter_model_context_window_tokens: true # 从 OpenRouter 拉取模型的上下文窗口大小；false 时按内置模型表解析
    # 是否预下载/使用模型词表进行精确 token 计算；关闭时使用字符串长度兜底，默认不联网。
    enable_tiktoken_counter: false
    # 词表统一缓存目录；相对路径相对于 ~/.jiuwenswarm（可由 JIUWENSWARM_DATA_DIR 改变）。
    tokenizer_cache_dir: tokenizers
    tokenizer_offline: false
    # 开发调试时打开：落盘 core 最终发送给模型的完整 messages/tools，
    # 以及上下文处理器的阈值判断、片段切分、压缩重试和前后对比等 JSONL 记录。
    # 内容可能包含用户数据和系统提示词，默认关闭。
    enable_context_debug: false
    # context_debug_dir: context-debug
    # 留空则按环境变量 OPENJIUWEN_CONTEXT_DEBUG_DIR，
    # 再缺省落到 {workspace}/context/{session_id}_context/context_debug/
    # 已知模型会按模型名自动解析并预热 tokenizer；模型条目也可直接配置
    # tokenizer/tokenizer_spec 覆盖默认映射。自定义别名无法推断时需声明 tokenizer。
    # tokenizer_registry:
    #   - provider: qwen
    #     model: qwen-max
    #     source: modelscope
    #     id: Qwen/Qwen2.5-72B-Instruct
    # 显式覆盖上下文窗口 token 上限（正整数）；注释掉或留空则按模型自动解析
    # context_window_tokens: 131072
    # 可选的模型名到上下文窗口映射；优先级低于全局值和当前模型的 context_window
    # model_context_window_tokens:
    #   some-model: 131072
    enable_reload: true    # 卸载重载：开启后模型可通过 [[HANDLE:xxx]] 标记把已卸载的大消息原文拉回上下文

    # 压缩召回：压缩器替换原始消息时，把原文分块归档到会话目录 compression_recall/，
    # 模型可通过 [[COMPRESSION_RECALL: id=...]] 标记按需召回原文。默认关闭。
    compression_recall_config:
      enabled: false               # true 开启压缩召回（仅对对话/当前轮/轮次级三个压缩器生效）
      chunk_size_tokens: 3000      # 归档分块大小（tokens）
      chunk_overlap_tokens: 500    # 相邻分块重叠（tokens，须小于 chunk_size_tokens）

    # 消息摘要卸载器：把超大的工具消息摘要化卸载（保留 [[OFFLOAD:...]] 索引，可重载）
    message_summary_offloader_config:
      protected_tool_names: ["read_file", "read_pdf"]  # 这些工具的输出保持原文，不卸载
      add_message_threshold_ratio: 0.1      # 新增工具消息超过上下文窗口容量的该比例时，立即卸载
      ttl_seconds: 300                      # 距上次模型请求空闲超过该秒数后，才允许做 TTL（闲时）卸载
      ttl_context_occupancy_ratio: 0.5      # 上下文占用超过该比例时，才允许做 TTL 卸载
      ttl_message_threshold_ratio: 0.05     # TTL 卸载时，单条工具消息超过窗口容量的该比例才被处理

    # 会话记忆：压缩发生前把已提交的关键信息沉淀为 session memory 笔记，
    # 后续作为压缩上下文块注入。默认关闭。
    # 配置分两层：外层是压缩器本体（何时触发、笔记多大）；
    # 内层 memory 是异步更新器（SessionMemoryManager，由独立 agent/模型后台更新笔记）的行为参数。
    session_memory_compressor_config:
      enabled: false               # true 开启会话记忆
      trigger_context_ratio: 0.8   # 上下文占用达到该比例时使用更新的笔记替换上下文、建议sessionmemory的阈值要小于等于下面的compressor，开启是下面的compressor作为兜底设计
      memory:
        update_trigger_context_ratio: 0.1   # 上下文占用达到该比例时异步更新记忆

    # 对话压缩器：整体对话历史超长时，把旧对话压缩成摘要
    dialogue_compressor_config:
      trigger_context_ratio: 0.8      # 上下文占用达到该比例时触发压缩
      min_target_context_ratio: 0.1   # 压缩目标下限（占窗口比例）

    # 当前轮次压缩器：单轮对话（含工具调用链）过长时压缩当前轮
    current_round_compressor_config:
      trigger_context_ratio: 0.8      # 上下文占用达到该比例时触发压缩
      min_target_context_ratio: 0.1   # 压缩目标下限（占窗口比例）
      keep_recent_messages: 4         # 保留最近消息数

    # 轮次级别压缩器：多轮长对话的三轮渐进式压缩（最强力，最后触发）
    round_level_compressor_config:
      trigger_context_ratio: 0.8      # 上下文占用达到该比例时触发压缩
      min_target_context_ratio: 0.1   # 压缩目标下限（占窗口比例）
      keep_recent_messages: 4         # 保留最近消息数
  # Skills 在线自演进配置
  evolution:
    skill_evolution: false     # true = 启用技能演进与创建（自动及手动）
    auto_save: false           # true = 自演进审批无需用户点击自动通过
    review_feedback_min_confidence: 0.7
  a2x_registry:
    base_url: "http://127.0.0.1:8000"
    timeout: 30.0
    api_key: ""
    # null uses the SDK default ownership store under the process HOME.
    # Keep ownership persistent so teardown can call replace_agent_card safely.
    ownership_file:
    # Allowed values: teammate / teamleader
    role: "teammate"
    # When role=teammate, automatic blank-agent registration during agent
    # initialization calls AsyncA2XRegistryClient.register_blank_agent(...).
    # endpoint may be omitted in distributed mode; it defaults to
    # team.transport.params.bootstrap_direct_addr when available.
    dataset: "team_pool"
    endpoint: ""

tools:
  - todo
  - skill

email_settings:
  email_address: ${EMAIL_ADDRESS}
  token: ${EMAIL_TOKEN}
  smtp_server: ${SMTP_SERVER:-smtp.gmail.com}
  port: ${EMAIL_PORT:-587}

embed:
  embed_api_key: ${EMBED_API_KEY}
  embed_base_url: ${EMBED_API_BASE}
  embed_model: ${EMBED_MODEL}

task_memory:
  # Set enabled: true to activate TaskMemoryService skill tools
  # (experience_retrieve, experience_learn, experience_clear)
  enabled: true
  # Override defaults below if task memory uses a different model/key than the main agent
  llm_model: ${TASK_MEMORY_LLM_MODEL}
  embedding_model: ${TASK_MEMORY_EMBED_MODEL}
  api_key: ${TASK_MEMORY_API_KEY}
  api_base: ${TASK_MEMORY_API_BASE}
  # Retrieval and summary algorithms: ACE | ReasoningBank | ReMe
  retrieval_algo: ACE
  summary_algo: ACE

gateway:
  # SessionMap 仅用于企业claw场景，如 feishu_enterprise 等通道：将平台身份映射为 Agent 的 session_id。
  # 取值：per_chat_bot（默认，同 chat+bot 共享会话）, per_chat_bot_user（按 user 分会话）
  session_map_scope: per_chat_bot

  # AgentClient 配置 - Gateway 连接到 AgentServer 的方式
  # type: websocket（默认） | yuanrong（直接函数调用） | agentos_router（AgentOS 扩展）
  agent_client:
    type: websocket # websocket | yuanrong | agentos_router
    # yuanrong 函数模式配置下面参数
    frontend_endpoint:
    function_version_urn:
    concurrency: 1
    invoke_timeout_s: 60
    # POST/DELETE /api/agent 超时（秒）；create 含镜像拉取/容器启动，建议明显大于 invoke_timeout_s
    agent_timeout_s: 300
    # create 请求的 namespace，默认 default
    agent_namespace: default

  # AgentOS Router Extension 配置；agent_client.type=agentos_router 时生效。
  agentos:
    creating_timeout_seconds: 60
    # Agent create 时宿主机 workspace 父目录；实际路径为 {workspace_root}/{user_id}
    workspace_root: "/home/agentos/users"
    # Agent 复用 key 字段，默认 user_id + agent_type。
    # 可选字段：user_id、agent_type、session_id（必须包含前两项）。
    # 示例：加入 session_id 后同一用户每个会话独立 Agent。
    agent_key_fields:
      - user_id
      - agent_type
    registry:
      # Agent OS 注册中心地址（空=本地 stub，不发 HTTP）。一体机默认 http://127.0.0.1:8000
      endpoint:
      request_timeout_s: 10
      # 本机 nodeIP，供 POST /api/nodes/{node}/heartbeat
      node:
    # SSH 南向接入 YuanRong 实例（配合 channels.ssh 北向使用）：
    # ssh -p <port> 'yr:instance:<instance_id>'@<frontend-host>
    # 主机取自 agent_client.frontend_endpoint；<instance_id> 为 create agent 返回的实例 id。
    # 客户端私钥目录（默认 /root/.ssh；若模板含 {user_id} 则按用户替换）。
    ssh:
      port: 2222
      user_template: "yr:instance:{instance}"
      connect_timeout_s: 30
      client_keys_dir: "/root/.ssh"
    auth_service_url: ${AGENTOS_AUTH_SERVICE_URL:-http://iam-agentos:8090}
    timeout: ${AGENTOS_AUTH_TIMEOUT:-10}
    # Web/TUI token 鉴权总开关；默认关闭。true 时创建 AgentOSAuthenticator 校验连接。
    auth_enabled: false

heartbeat:
  jobs:
    min_interval_seconds: 60
    max_active_jobs_per_session: 5
    max_active_jobs_global: 100
    default_max_runs: 12
    default_concurrency_policy: skip
    default_session_deleted_policy: disable

health_check:
  # 业务探活间隔（秒），默认 3600
  every: 3600
  # 探活结果回传的 channel（如 "web"），
  target: web
  # 探活生效时间段（本地时间），start <= now < end 时探活生效
  active_hours:
    start: 08:00
    end: 22:00

# 执行护栏：工具循环检测与主动中断
execution_guard:
  # 模型异常检测护栏：重复输出/流式帧超时重试，以及连续相同工具调用压缩
  model_anomaly_detection_rail:
    # 总开关。关闭后不注册 ModelAnomalyDetectionRail
    enabled: true
    # 单次 invoke 内同一类异常最多重试次数；超过后把异常继续抛给上层
    max_retries: 2
    # 重复片段检测的最短长度，单位：字符；用于检测短句/短片段循环输出
    repeat_min_pattern_chars: 2
    # 重复片段检测的最长长度，单位：字符；过长片段不作为循环模式检测
    repeat_max_pattern_chars: 64
    # 同一片段至少连续重复多少次才认为疑似死循环
    repeat_min_count: 6
    # 多字符重复输出的最小总长度，避免正常短文本重复误触发
    repeat_min_total_chars: 160
    # 滑动检测窗口大小，单位：字符；仅保留最近窗口内容用于重复判断
    repeat_window_chars: 1024
    # 单字符连续重复阈值，用于检测分隔线等场景，默认较高以减少误判
    single_char_repeat_count: 90
    # 连续相同工具名+入参+返回值时，折叠重复轮次；第 N 次命中时兜底中止
    tool_loop_compact:
      enabled: true                        # 是否启用循环压缩（openjiuwen 默认关闭）
      consecutive_threshold: 4             # 工具名+入参+返回值连续相同几轮触发压缩
      bailout_threshold: 3                 # 第几次命中时抛异常（默认最多压缩 2 次）

  # 断路器：检测工具重复/交替/无进展循环，critical 级会强制结束当次回答
  circuit_breaker:
    # 总开关。断路器会主动中断 agent（force-finish），默认关闭，需显式开启
    enabled: false
    # 相同工具+参数重复达到该次数时告警（仅日志，不中断）
    warning_threshold: 10
    # Ping-Pong 两工具交替且无进展达到该次数时中断
    critical_threshold: 20
    # 工具连续无进展（结果不变）达到该次数时兜底中断
    global_breaker_threshold: 30
    # 未知/错误工具连续调用达到该次数时停止重试并中断
    unknown_tool_threshold: 10

channels:
  web:
    send_file_allowed: true
  feishu:
    send_file_allowed: true
    apps:
      - name: 飞书默认应用
      # 飞书应用配置
        app_id:
        app_secret:
        encrypt_key:
        verification_token:
        allow_from:
        enable_streaming: false
        enabled: false
        # 群聊数字分身（默认关闭）
        group_digital_avatar: false
        my_user_id: ""
        bot_name: ""
        enable_memory: false
        # 飞书开放平台 API 域名前缀（留空走官方默认，支持国际版/私有化切换）
        api_base: https://open.feishu.cn
  feishu_enterprise:
    # 企业飞书多 Bot 配置（每个 bot 会注册为独立 channel: feishu_enterprise:<app_id>）
    # bot_a:
    #   app_id:
    #   app_secret:
    #   encrypt_key:
    #   verification_token:
    #   allow_from: []
    #   enable_streaming: true
    #   chat_id:
    #   enabled: false
  xiaoyi:
    send_file_allowed: true
    apps:
      - name: 小艺默认应用
        # 华为小艺 A2A 配置
        app_id:
