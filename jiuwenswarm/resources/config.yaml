# Gateway ↔ AgentServer 分块文件传输（Agent→Gateway 下载 · 逃生阀）
# 默认关闭（个人与企业均关）。企业下载主路径为 OBS URL + Gateway 代理，不依赖本块。
# 显式 enabled: true 或 env JIUWENSWARM_FILE_DOWNLOAD_VIA_PUSH=1 才开启 file.download.* push。
# 企业上传仍走 MinIO URL（is_enterprise 跳过 GW→Agent 分片）。
file_transfer:
  chunk_size: 65536
  max_file_size: 104857600
  transfer_timeout: 300
  received_files_dir: "agent/jiuwenclaw_workspace/received_files"
  cleanup_interval: 3600
  cleanup_age: 86400
  max_concurrent_transfers: 5

extensions:
  # 扩展包搜索目录（字符串），用 ';' 分割多个目录：
  # EXTENSION_DIRS="E:/a;D:/b"
  extension_dirs: ${EXTENSION_DIRS:-jiuwenswarm/extensions}


# ============================================================
# Hooks 配置
# 17 个事件类型，支持 command / prompt 两种 hook 类型
# 字段说明：
#   - disable_all_hooks: 全局关闭所有 hooks
#   - <事件名>:
#       - matcher: 匹配表达式（工具名|管道OR|正则|"*"）
#       - hooks:
#           - type: command | prompt
#           - command / prompt: 执行的命令或 prompt 模板
#             支持 $ARGUMENTS（hook input JSON）和 $TOOL_NAME 变量
#           - timeout: 超时秒数（默认 30s）
#           - shell: bash | sh | zsh（仅 command 类型）
#           - model: LLM 模型名（仅 prompt 类型，空则用默认轻量模型）
#           - status_message: 执行时显示的提示信息
# 退出码语义（command 类型）：
#   0 = 成功继续  2 = 阻止执行  其他 = 非阻塞错误
# ============================================================
hooks:
  disable_all_hooks: false

  # PreToolUse: 工具执行前拦截
  # PreToolUse:
  #   - matcher: "Write|Edit"
  #     hooks:
  #       - type: command
  #         command: "echo 'about to write file'"
  #         timeout: 30
  #         shell: "bash"
  #         status_message: "Running pre-write hook..."

  # PostToolUse: 工具执行后拦截
  # PostToolUse:
  #   - matcher: "Bash"
  #     hooks:
  #       - type: prompt
  #         prompt: "审查命令输出安全性: $ARGUMENTS"
  #         timeout: 15

  # SessionStart: 会话开始时
  # SessionStart:
  #   - matcher: "*"
  #     hooks:
  #       - type: command
  #         command: "echo 'session started'"

  # Stop: Agent 结束前
  # Stop:
  #   - matcher: "*"
  #     hooks:
  #       - type: command
  #         command: "echo 'agent stopping'"


mcp:
  servers: []
  # 示例：
  # servers:
  #   - name: playwright
  #     enabled: true
  #     transport: stdio
  #     command: python
  #     args: ["path/to/server.py", "--transport", "stdio"]
  #     cwd: .
  #     env:
  #       LOG_LEVEL: INFO
  #   - name: local-sse
  #     enabled: false
  #     transport: sse
  #     url: http://127.0.0.1:9000/sse
  #     headers:
  #       Authorization: Bearer ${MCP_TOKEN}
  #     timeout_s: 30


# Petal search: when true, set PETAL_SEARCH_URL and PETAL_SEARCH_HEADERS in env.
enable_petal_web_search: true

# Unified web_search: timeout and paid provider order (petal first when enabled).
web_search:
  timeout_seconds: 30
  max_results: 8
  paid_provider_order:
    - petal
    - bocha

modes:
  # 一级模式 agent / code / team
  agent:
    # plan / fast 已合并为单一 agent 模式：记忆固定被动（is_proactive 开关已下线）。
    memory:
      enabled: true
    rails:
    tools:
  code:
    artifact_post_process:
      # 为生成的代码文件添加语言对应的 header 注释：
      # "Co-authored by OfficeAce Coding Agent"。可通过 .env 开关控制，默认关闭。
      coauthor_header: ${JIUWENSWARM_CODE_COAUTHOR_HEADER_ENABLED:-false}

    # 记忆开关 — 控制 CodingMemoryRail 和 ProjectMemoryRail 加载
    # 关闭后，coding_memory_read/write/edit 工具不可用，项目记忆文件不自动加载
    memory:
      enabled: true

    # 动态 Rails — 列表中出现的 = 启用；不出现的 = 不启用
    # 固定 Rails（以下 Rails 已在代码中固定挂载，无需在此配置）：
    #   RuntimePromptRail, ResponsePromptRail, JiuSwarmStreamEventRail, SecurityRail,
    #   PermissionInterruptRail, SysOperationRail(FileSystemRail), LspRail,
    #   CodingArtifactPostProcessRail, AgentModeRail, StructuredAskUserRail,
    #   ConfirmInterruptRail, ContextProcessorRail
    # 注意：ProjectMemoryRail, CodingMemoryRail 受 memory.enabled 开关控制，
    #       开关关闭时不加载，开关开启时固定挂载。
    rails:
      - SkillUseRail
      - WorktreeRail

    # 动态 Tools — 列表中出现的 = 启用
    # send_file_to_user 由运行时 _update_session_tools 注册，不在此配置
    # coding_memory_read/write/edit 由 CodingMemoryRail 在 subagent 内部注册，不在此配置
    tools:
      - web_search
      - web_fetch_webpage
      - user_todos
      - skill_toolkit
      - skill_retrieval

    embedding_config:
      model_name:
      base_url:
      api_key:
  team:
    jiuwen_team:
      team_name: jiuwen_team
      lifecycle: persistent
      teammate_mode: build_mode
      spawn_mode: inprocess
      enable_swarmflow: false
      # Per-teammate soft ceiling for debate messages; task-board collaboration is excluded.
      max_debate_rounds: 3

      # SwarmFlow per-Leader concurrency caps (three-layer governor).
      # Only effective when enable_swarmflow is true.
      #   max_workflows:    L1 — max concurrent workflow runs under one leader (>=1).
      #   agents_per_run:   L2 — per-run agent admission cap (optional; None uses
      #                          the engine's default agents-per-run resolution).
      #   max_agents_total: L3 — global agent admission across all runs (>=1).
      swarmflow_concurrency:
        max_workflows: 16
        agents_per_run:
        max_agents_total: 64

      # Enable the host-managed worktree capability used by team members and
      # SwarmFlow agent calls with options.isolation="worktree".
      worktree:
        enabled: true

      # Team-specific permission control.
      enable_permissions: false

      leader:
        member_name: team-leader
        display_name: 团队领导
        persona: "天才项目管理专家，擅长任务分解和团队协调"

      agents:
        leader: $agent_leader

      workspace:
        enabled: true

      transport:
        type: inprocess

      storage:
        type: sqlite

      # ============================================================
      # Team 级共享记忆（TeamMemoryConfig）
      # ============================================================
      # 与常规 Agent 的 per-session 记忆不同，Team 记忆是一个独立的、
      # 跨成员的共享记忆系统，由 TeamMemoryManager 统一管理。
      #
      # 启用后，每个 Team 成员的记忆操作不再是孤立的个人记忆，
      # 而是读写同一份 TEAM_MEMORY.md（位于 team_memory_dir 下）。
      # 这允许成员之间通过记忆文件共享上下文（如项目背景、决策记录等）。
      # ============================================================
      memory:
        # ---------- 总开关 ----------
        # 关闭时 TeamMemoryManager 不创建，成员记忆回退到各自独立的 MemoryRail
        enabled: false

        # ---------- 场景标识 ----------
        # "general" — 通用场景，记忆提取 prompt 偏重项目背景与决策
        # "coding"  — 编码场景，记忆提取 prompt 偏重技术方案与架构决策
        scenario: "general"

        # ---------- 自动提取 ----------
        # true  — 每轮对话结束后，后台自动总结并写入 TEAM_MEMORY.md
        # false — 仅当 LLM 主动调用记忆工具时才写入
        # 仅在 lifecycle=persistent 时生效；temporary 团队不触发自动提取
        auto_extract: true

        # ---------- 共享记忆 ----------
        # true  — 所有成员共享同一份 TEAM_MEMORY.md（默认）
        # false — 每个成员维护独立记忆文件（按 member_name 分目录）
        shared_memory: true

        # ---------- 记忆注入模式 ----------
        # 控制记忆内容如何注入到每个成员的 system prompt 中：
        #   "proactive" — 每轮对话开始时主动注入最新记忆摘要
        member_memory_prompt_mode: "proactive"
