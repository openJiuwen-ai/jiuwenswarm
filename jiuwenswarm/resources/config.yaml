# 配置架构版本（用户 override 首次写入 version 时从本模板拷贝；迁移脚本可比对）
version: 1.0

# 前端显示语言：zh（中文）/ en（英文），与 Web 界面语言切换同步
preferred_language: zh

# Web 首次模型配置引导；用户确认完成后会自动关闭，可通过侧栏问号再次打开
setup_guide:
  enabled: true

# auto-recap：用户空闲5分钟后自动生成会话摘要（TUI 端）
auto_recap:
  enabled: true

# 沙箱
sandbox:
  enabled: false
  startup_mode: internal
  url: http://127.0.0.1:8321
  type: jiuwenbox
  policy_file: windows-policy.yaml

a2ui:
  enabled: false
  protocol_version: "0.8"
  stream_validation_enabled: true
  non_web_fallback_enabled: false
  dev_smoke_tools_enabled: false

symphony:
  enabled: false
  paths:
    skills_root: ""
    score_dir: ""

  fingerprint:
    scan:
      max_depth:
    extraction:
      workers: 4
      batch_size: 2
      body_limit:
    normalization:
      workers: 4
      batch_size: 2
      duplicate_name_similarity_threshold: 0.8
      max_vocab_size:

  build:
    workers: 4
    batch_size: 16
    max_candidates_per_skill_relation: 32
    require_consensus: false
    min_edge_confidence: 0.5

  evolution:
    enabled: true             # Symphony 动态图演进 overlay 开关（与 react.evolution 技能自演进无关）

  orchestration:
    # fast is the default one-shot path; beam enables bidirectional search.
    mode: fast
    # Beam-only candidate count retained after each search round.
    top_k: 3
    max_depth: 4
    min_edge_confidence: 0.5

  skill_retrieval:
    enabled: false
    artifact_root: ${SYMPHONY_SKILL_RETRIEVAL_ROOT:-}
    build:
      branching_factor: 12
      max_depth: 6
      root_categories: ""
      max_workers: 2
      max_retries: 2
      request_timeout_seconds: 420
      classification_batch_limit: 32
      discovery_seed: 42
      postprocess_enabled: true
      postprocess_max_passes: 1
      postprocess_min_skills: 6
      equivalence_enabled: false
    retrieve:
      compact_codes_enabled: false
      flatten_tree: false
      max_exposure_depth: 1

# Auto Memory：对话结束后自动提取记忆，按项目隔离存储
# 存储路径：~/.jiuwenswarm/projects/{sanitized-project-path}/memory/
# 类似 Claude Code 的 auto-memory 功能
auto_memory_enabled: false

# HTTP+SSE入口
# enabled: true 后监听独立端口，提供 RESTful接口与SSE流式对话；
# 交互式文档在 http://{host}:{port}/api/v1/docs
# 优先级：环境变量 > 本文件 > 默认值。
# 下面的 port 用于不经启动器的独立运行场景。
http_server:
  enabled: false
  host:
  port: 8766

# AgentServer 启动端到端预热：创建临时 DeepAgent 执行一次 query，
# 触发模块 import / checkpointer / 模型 client / DeepAgent 工厂全链路首次初始化，
# 降低首请求时延。后台执行，不阻塞启动完成。
# 模型调用通过 mock 短路（不发真实 HTTP、不消耗 token），仅预热构建链路。
startup:
  warmup:
    enabled: true               # 总开关，默认开启
    query: "hello"              # 预热 query
    channel_id: "__prewarm__"   # 专用 channel，与生产会话隔离
    mode: "agent"               # 预热 agent 模式
    timeout_s: 120              # 预热超时（秒），超时取消不阻塞启动
    mock_model: true            # 是否 mock 模型调用（避免消耗 token），默认 true

# 日志目录：~/.jiuwenswarm/agent/.logs/
# gateway.log / channel.log / agent_server.log 按源码路径分流；full.log 为汇总。
# level：未单独指定时的默认级别。console_level：控制台；可省略则用 level。
# 环境变量 LOG_LEVEL 仅覆盖控制台级别（不覆盖各日志文件）。
logging:
  level: INFO
  console_level: INFO
  gateway: INFO
  channel: INFO
  agent_server: INFO
  full: INFO
  # 输出格式：text(默认)|json|dual(text+.json 双写)
  format: text
  # 输出开关
  console_enabled: true
  file_enabled: true
  # JSON 子配置
  json:
    timestamp_format: text        # text|iso8601
    include_component: true
    sanitize_sensitive_data: true
    exc_info_style: simple        # simple|full
  # 用户可见 Tag 开关
  tags:
    user_visible: true
    user_progress_visible: true

memory:
  # ============================================================
  # 记忆系统配置
  # ============================================================
  # 两个正交开关：
  #   1) engine — 挂载哪套 rail（内置 / 外接 / 都挂 / 都不挂）
  #   2) mode   — 内置记忆的存储位置（local | cloud），不影响外接
  #
  # 外接 rail 的启用 = (engine ∈ {external, both}) AND (external.provider 非空)
  # 内置 rail 的启用 = (engine ∈ {builtin, both})  AND (mode=local)
  #                    AND modes.agent.memory.enabled=true
  # ============================================================

  mode: ${MEMORY_MODE:-local}            # 内置记忆存储位置：local | cloud
  # 记忆引擎总开关：builtin | external | both | none
  #   builtin  — 仅内置记忆（默认，兼容旧配置）
  #   external — 仅外接记忆（LTM / Mem0 / OpenViking / 插件）
  #   both     — 内置 + 外接并存
  #   none     — 全部关闭
  engine: ${MEMORY_ENGINE:-builtin}
  forbidden_memory_definition:
    enabled: false
    patterns: []
    description:
      zh: "以下内容禁止记忆：（用户自行补充，如身高、体重、姓名等，建议用逗号分隔）"
      en: "The following content is forbidden to remember: (To be supplemented by users, e.g., height, weight, name, etc. Separate items with commas recommended)"

  # ------------------------------------------------------------
  # 外接记忆（External Memory）
  # ------------------------------------------------------------
  # 启用方式（任选一种）：
  #
  # 【方案 1：YAML 直接改】
  #   memory.engine: external   # 或 both
  #   memory.external.provider: mem0   # 选一个：openjiuwen | mem0 | openviking
  #   # 然后在下方对应的 mem0/openjiuwen/openviking 子段填 api_key 或 endpoint
  #
  # 【方案 2：环境变量覆盖】
  #   export MEMORY_ENGINE=external
  #   export MEMORY_EXTERNAL_PROVIDER=mem0
  #   export MEM0_API_KEY=sk-xxx
  #
  # 【关闭外接记忆】
  #   把 memory.engine 改回 builtin 或 none；
  #   或把 memory.external.provider 留空（两者任一生效即可禁用）
  #
  # 【挂载模式常见组合】
  #   ┌─────────────┬───────────────┬──────────────────────────────────────┐
  #   │ engine      │ provider      │ 效果                                 │
  #   ├─────────────┼───────────────┼──────────────────────────────────────┤
  #   │ builtin     │ *             │ 只挂内置（默认；外接即使填了也不挂） │
  #   │ external    │ openjiuwen    │ 只挂外接 LTM                         │
  #   │ external    │ mem0          │ 只挂外接 Mem0                        │
  #   │ external    │ openviking    │ 只挂外接 OpenViking                  │
  #   │ external    │ <plugin-name> │ 只挂用户安装的插件                   │
  #   │ both        │ 任一          │ 内置 + 外接同时挂（LLM 两套工具并列）│
  #   │ none        │ *             │ 全关，任何记忆 rail 都不挂           │
  #   └─────────────┴───────────────┴──────────────────────────────────────┘
  #
  # 说明：
  # - 外接记忆 mode-independent：配置一次，agent 模式全程生效，
  #   跨 config 热重载持久存活（保留 prefetch 缓存、电路断路器、会话状态）
  # - 单 provider 策略：同一时刻 provider 只能选一个
  # - 失败降级：provider 构建失败或网络异常不阻塞主流程
  external:
    # 选哪家 provider。空字符串 = 禁用外接（等价于 engine=builtin）
    provider: ${MEMORY_EXTERNAL_PROVIDER:-}   # '' | openjiuwen | mem0 | openviking | lakebase | <plugin-name>
    # 数据隔离标识（所有 provider 共用）
    user_id: ${MEMORY_USER_ID:-__default__}
    scope_id: ${MEMORY_SCOPE_ID:-__default__}

    # -- OpenJiuwen LTM（本地长期记忆：KV + 向量 + DB）--
    # 生效条件：provider='openjiuwen'
    # 依赖顶层 embed 段提供 embedding 配置（不单独配置 api_key）
    openjiuwen:
      kv_type: shelve                                    # shelve | in_memory | sqlite
      kv_path: ${MEMORY_KV_PATH:-}                       # 默认 ~/.jiuwenswarm/memory/ltm/kv
      vector_type: chroma                                # chroma
      vector_persist_dir: ${MEMORY_VECTOR_DIR:-}         # 默认 ~/.jiuwenswarm/memory/ltm/chroma
      db_type: sqlite
      db_path: ${MEMORY_DB_PATH:-}                       # 默认 ~/.jiuwenswarm/memory/ltm/ltm.db

    # -- Mem0（云端事实抽取+语义检索）--
    # 生效条件：provider='mem0'
    # 必填：api_key（从 mem0.ai 获取）
    mem0:
      api_key: ${MEM0_API_KEY:-}
      user_id: ${MEM0_USER_ID:-jiuwenswarm-user}
      agent_id: ${MEM0_AGENT_ID:-jiuwenswarm}
      rerank: true                                       # 搜索结果重排序（更准但更慢）

    # -- OpenViking（字节上下文数据库）--
    # 生效条件：provider='openviking'
    # 必填：endpoint 可访问
    openviking:
      endpoint: ${OPENVIKING_ENDPOINT:-http://127.0.0.1:1933}
      api_key: ${OPENVIKING_API_KEY:-}
      account: ${OPENVIKING_ACCOUNT:-root}
      user: ${OPENVIKING_USER:-default}

    lakebase:
      api_key: ${LAKEBASE_API_KEY:-}
      base_url: ${LAKEBASE_API_URL:-}
      base_id: ${LAKEBASE_MEM_BASE_ID:-}
      database_id: ${LAKEBASE_DATABASE_ID:-}


proactive_recommendation:
  enabled: false                # 总开关
  max_recommend_per_day: 10               # 每天最多推荐次数
  max_rounds_per_tick: 20                # 每次 Tick 读取最近几轮对话

models:
  # defaults 列表项可选 tier: lite | pro（每个 tier 只能绑定一个模型，first-wins；
  # 供 task_tool / sessions_spawn 按 model_tier 选择子代理模型）
  # 示例：
  # defaults:
  #   - tier: pro
  #     is_default: true
  #     model_client_config: { model_name: ..., api_base: ..., api_key: ..., client_provider: ... }
  #     model_config_obj: { temperature: 0.6 }
  #   - tier: lite
  #     model_client_config: { model_name: ..., api_base: ..., api_key: ..., client_provider: ... }
  #     model_config_obj: { temperature: 0.6 }
  defaults:
    - model_client_config:
        api_base: ${API_BASE}
        api_key: ${API_KEY}
        model_name: ${MODEL_NAME}
        client_provider: ${MODEL_PROVIDER}
        # HTTP 请求超时（秒）。需严格 > stream_first_chunk_timeout，确保先触发应用层流超时（可被 LLMRetryRail 重试）
        timeout: 360
        # 流式：等待首个分片的最大时间（秒）。放宽以兼容 reasoning/思考模型思考期的静默
        stream_first_chunk_timeout: 300
        # 流式：分片之间的最大空闲等待时间（秒）
        stream_idle_timeout: 60
        verify_ssl: true
        custom_headers: {}
      model_config_obj:
        temperature: 0.6
        # 该模型调用未显式指定 max_tokens 时的兜底值；
        # 走底层 ModelRequestConfig.max_tokens 回退链路（调用参数 > model_config_obj > 不限制）
        # 值取自环境变量 LLM_MAX_TOKENS
        # 未设置时回落 32768；jiuwenswarm 自身 .env 的同名变量优先级更高
        max_tokens: ${LLM_MAX_TOKENS:-32768}
      is_default: true
  video:
    model_client_config:
      api_base: ${VIDEO_API_BASE}
      api_key: ${VIDEO_API_KEY}
      model_name: ${VIDEO_MODEL_NAME}
      client_provider: ${VIDEO_PROVIDER}
      timeout: 1800
      verify_ssl: true
    model_config_obj:
      temperature: 0.6
  audio:
    model_client_config:
      api_base: ${AUDIO_API_BASE}
      api_key: ${AUDIO_API_KEY}
      model_name: ${AUDIO_MODEL_NAME}
      client_provider: ${AUDIO_PROVIDER}
      verify_ssl: true
      timeout: 1800
    model_config_obj:
      temperature: 0.6
  vision:
    model_client_config:
      api_base: ${VISION_API_BASE}
      api_key: ${VISION_API_KEY}
      model_name: ${VISION_MODEL_NAME}
      client_provider: ${VISION_PROVIDER}
      verify_ssl: true
      timeout: 1800
    model_config_obj:
      temperature: 0.6
  image_gen:
    model_client_config:
      api_base: ${IMAGE_GEN_API_BASE}
      api_key: ${IMAGE_GEN_API_KEY}
      model_name: ${IMAGE_GEN_MODEL_NAME}
      client_provider: ${IMAGE_GEN_PROVIDER}
      verify_ssl: true
      timeout: 1800
    model_config_obj:
      temperature: 0.6

# 外接 ACP Agent（stdio），供工具 acp_chat 使用。按需取消注释并填写；command/args 可指向任意兼容 ACP 的包（与 VS Code formulahendry.acp-client 预置列表一致）。
acp_agents:
  codex:
    command: npx
    args: ["@zed-industries/codex-acp@latest"]
    cwd:
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}    # 仅由此 env 注入子进程（不读 workspace .env / 父进程）

# ============================================================
# Agent 配置（可被 team.agents / modes.team.<name>.agents 引用）
# ============================================================
# 每个 agent 定义一个可复用的 agent 配置模板，支持以下字段（均可选）：
#
#   model:                  # 不配则继承 models.default
#     model_client_config:
#       client_provider: OpenAI
#       api_base: https://api.deepseek.com
#       api_key: sk-xxx
#       timeout: 1800
#       verify_ssl: true
#       custom_headers: {}
#     model_request_config:
#       model: deepseek-chat
#   skills:                 # 不配则不自动填充
#     - skill_a
#     - skill_b
#   workspace:              # 默认 {"stable_base": true}
#     stable_base: true
#   max_iterations: 200     # 默认 200
#   completion_timeout: 600.0  # 默认 600.0
#
# 示例：给不同 agent 配置不同模型和技能
#   agent_coder:
#     model:
#       model_client_config:
#         client_provider: OpenAI
#         api_base: https://api.deepseek.com
#         api_key: sk-xxx
#       model_request_config:
#         model: deepseek-chat
#     skills:
#       - code_review
#       - unit_test
#     max_iterations: 300
#
agents:
  agent_leader:
    workspace:
      stable_base: true
    max_iterations: 200
    completion_timeout: 6000.0

  agent_teammate:
    workspace:
      stable_base: true
    max_iterations: 200
    completion_timeout: 6000.0

# Request-level performance summaries (request_summaries.jsonl per session).
# Default on; set PERF_SUMMARY_ENABLED=false or enabled: false to opt out.
perf:
  summary:
    enabled: true
    bottleneck_top_n: 3
    include_tasks: true
    include_errors: false
    # Parent+subagent breakdown in stats.by_agent (off by default).
    include_by_agent: false

# 生成代码可读性：Prompt 约束 + Python 源码 \uXXXX 兜底转换（仅 .py/.pyw）
# 设为 false 可紧急关闭整套能力
code_generation:
  unicode_readable: true

telemetry:
  # enabled=true 时统一 Runtime 独占 Provider 选择；下方旧
  # agent_observability/team_observability 的 exporter/endpoint 不参与选择。
  # enabled=false 或缺失时保持 dev-stable 的旧行为。Provider 配置变化需重启进程。
  enabled: false                    # 总开关（环境变量 OTEL_ENABLED 优先）
  exporter: otlp                    # otlp / console / none
  endpoint: http://localhost:4317   # OTLP endpoint
  protocol: grpc                    # grpc / http
  headers: {}                       # 公共 OTLP headers，可被 traces/metrics 覆盖
  log_messages: true                # 是否在 span event 中记录完整消息内容
  redact_prompts: false             # 脱敏 prompt（密钥字段始终打码）
  redact_completions: false         # 脱敏 completion
  claw_id:                          # 可选：统一写入 jiuwenclaw.claw.id
  service_name: jiuwenclaw
  provider_factory:                 # 自定义 provider factory，格式：module:function
  traces:
    exporter:                       # trace exporter，默认回退到 telemetry.exporter
    endpoint:                       # trace endpoint，默认回退到 telemetry.endpoint
    protocol:                       # trace protocol，默认回退到 telemetry.protocol
    headers: {}                     # trace headers，默认回退到 telemetry.headers
  metrics:
    exporter:                       # metrics exporter，默认回退到 telemetry.exporter
    endpoint:                       # metrics endpoint，默认回退到 telemetry.endpoint
    protocol:                       # metrics protocol，默认回退到 telemetry.protocol
    headers: {}                     # metrics headers，默认回退到 telemetry.headers
  session:
    stuck_threshold_ms: 300000      # 运行超过此时长后记录 stuck 指标
    stuck_check_interval_s: 30      # stuck 扫描周期

# ============================================================
# Team 可观测性配置（OTel + Langfuse）
# ============================================================
# 与 telemetry 不同，team_observability 专门用于 TeamAgent 的
# 可观测性追踪，包括 team/member/task/message 级别的 span。
# 启用后会自动将 OtelTeamMonitorHandler 注册到 TeamAgent，
# 将事件转为 OTel span 导出到 Langfuse / OTLP Collector。
#
# 前置条件：
#   1. 启动 OTel Collector + Langfuse
#   2. 在用户配置中设置 team_observability.enabled: true
# ============================================================
team_observability:
  enabled: true                    # Team observability 总开关
  exporter: file                    # otlp_grpc / otlp_http / file
  endpoint: http://localhost:4317   # OTLP gRPC endpoint（file 模式不需要）
  service_name: jiuwenswarm         # 服务名称（OTel resource service.name）
  sample_rate: 1.0                  # 采样率 (0.0-1.0)
  redact_prompts: false             # 是否脱敏 prompt 内容
  redact_completions: false         # 是否脱敏 completion 内容
  attribute_value_max_length: 10240 # OTel attribute value 最大长度
  langfuse_public_key: ""           # Langfuse OTLP 认证 public key（可选）
  langfuse_secret_key: ""           # Langfuse OTLP 认证 secret key（可选）
  traces_dir: ""                    # file exporter 输出目录，默认 ~/.jiuwenswarm/.trace
  file_retention_days: 7            # file exporter 文件保留天数

# ============================================================
# 单 Agent / Coding Agent 可观测性配置
# ============================================================
# 与 team_observability 对应，但作用于非 team 的运行路径
#（Runner.run_agent / Runner.run_agent_streaming，即 agent.* 与 code.* 模式）。
# 启用后会调用 init_observability() 注册全局 OtelCallbackHandler，
# 自动为 LLM 调用与工具调用生成 span（不含 team/member/task 级 span，
# 那是 team 模式专属）。
#
# 注意：OTel 一个进程只允许一个全局 TracerProvider。若本进程内 team 与
# agent 可观测性同时开启，先初始化的一方生效，另一方复用同一个 provider
#（其 exporter/endpoint 会被忽略）。代码层面用 ownership 标记保证
# 关闭时不会误拆对方依赖的 provider。
#
# 前置条件（otlp 模式）：启动 OTel Collector + Langfuse。
# ============================================================
agent_observability:
  enabled: false                    # 单 agent 可观测性总开关
  exporter: file                    # otlp_grpc / otlp_http / file
  endpoint: http://localhost:4317   # OTLP gRPC endpoint（file 模式不需要）
  service_name: jiuwenswarm-agent   # 服务名称（OTel resource service.name）
  sample_rate: 1.0                  # 采样率 (0.0-1.0)
  redact_prompts: false             # 是否脱敏 prompt 内容
  redact_completions: false         # 是否脱敏 completion 内容
  attribute_value_max_length: 10240 # OTel attribute value 最大长度
  langfuse_public_key: ""           # Langfuse OTLP 认证 public key（可选）
  langfuse_secret_key: ""           # Langfuse OTLP 认证 secret key（可选）
  traces_dir: ""                    # file exporter 输出目录，默认 ~/.jiuwenswarm/.trace
  file_retention_days: 7            # file exporter 文件保留天数

# ============================================================
# Agent / Code 调试链路追踪（Debug Trace）配置
# ============================================================
# 控制非 team 模式（agent.* / code.*）的人类可读本地 dump。
# 生效逻辑（resolve_debug_trace_settings）：
#   debug_enabled = 请求带 /debug OR debug_trace.<mode>.enabled
#   dump_enabled  = debug_enabled AND debug_trace.<mode>.dump_enabled != false
# dump 写入 ~/.jiuwenswarm/.agent/traces/ 或 .code/traces/（按模式）。
# 与 agent_observability（OTel span）相互独立：本块只管本地文本 dump，
# OTel 接入在后续阶段。
# ============================================================
debug_trace:
  agent:                            # agent 模式（agent.plan / agent.fast …）
    enabled: false                  # 仅 agent 模式开关
    dump_enabled: true              # debug 开启时是否写本地 dump
    otel_enabled: false             # debug 时是否顺带 force-enable agent_observability（产 OTel span）
    include_model_output: true      # 记录模型文本输出
    include_reasoning: true         # 记录推理片段
    include_tool_args: true         # 记录工具参数
    include_tool_result: true       # 记录工具结果
    include_subagent_flow: true     # 采集子 agent chunk 进同一 dump（内置 task / 自定义 / 后台子 agent）
  code:                             # code 模式（code.normal / code.plan …）
    enabled: false
    dump_enabled: true
    otel_enabled: false             # debug 时是否顺带 force-enable agent_observability（产 OTel span）
    include_model_output: true
    include_reasoning: true
    include_tool_args: true
    include_tool_result: true
    include_subagent_flow: true     # 采集子 agent chunk 进同一 dump（内置 task / 自定义 / 后台子 agent）
  limits:
    tool_args_max_chars: 2000       # 工具参数截断阈值
    tool_result_max_chars: 8000     # 工具结果截断阈值
    generic_payload_max_chars: 4000 # 通用载荷/run input 截断阈值
    max_model_output_chars:         # 空=不截模型输出；填数字则截断
  redaction:
    redact_prompts: false           # 脱敏 prompt/completion（密钥字段始终打码）
    redact_completions: false

react:
  agent_name: main_agent
  enable_task_loop: true
  # TaskExecutionRail: 发送 task.start/task.complete/task.update 生命周期事件。
  enable_task_execution_rail: true
  max_iterations: 100
  model_name: ${MODEL_NAME}
  skill_mode: all
  # Per-skill credential env vars injected into shell tools when a skill is active.
  # OfficeClaw sync writes real values here (e.g. hwocr HWOCR_AK/HWOCR_SK). Empty {} is a
  # YAML placeholder only; runtime coalesce keeps catalog-injected credentials on reload.
  skill_envs: {}
  # Todo 周期 progress 提醒（deep/chat 主会话 + team 非 leader 成员）
  # Code 模式不读此开关（强制 False，走 attachment task_reminder）
  # enable_progress_repeat: 仅 true|false（可用环境变量 TODO_PROGRESS_REPEAT）
  # list_tool_call_interval: 仅正整数 >=1
  task_planning:
    enable_progress_repeat: ${TODO_PROGRESS_REPEAT:-true}
    list_tool_call_interval: 20
  # ProgressiveToolRail: 工具延迟加载，固定 eager_tools schema，deferred 工具通过
  # tools_search → invoke_tool 间接调用，最大化 prefix cache 命中率。
  tool_lazy_load:
    enabled: true                  # 总开关，默认关闭
    eager_tools:                    # 常驻可见工具列表
      - tools_search
      - invoke_tool
      - web_search
      - fetch_webpage
      - ask_user
      - task_tool
      - send_file_to_user
      - list_files
      - read_file
      - write_file
      - edit_file
      - glob
      - grep
      - bash
      - skill_tool
      - skill_complete
      - skill_acceleration_exec
      - todo_create
      - todo_list
      - todo_modify
      - task_tool                   # 常驻可见，否则 ProgressiveToolRail 会滤掉，主 agent 无法委派 subagent
    enable_for_models:             # 模型白名单（空=全部启用）
      - glm
    subagents:                      # 子 agent 延迟加载配置
      enabled: false                # 子 agent 总开关，默认关闭
      inherit_parent_eager_tools: true  # 继承父 agent 的 eager 列表
      # eager_tools:                 # 或自定义子 agent eager 列表（不继承时使用）
      #   - tools_search
      #   - invoke_tool
      #   - web_search
  # code_agent / research_agent 默认不启用；只有显式配置 enabled: true 才会显示并可被 task_tool 调用
  # browser_agent: code.team 路径通过此 key 门控（单 agent 路径仍由 browser runtime 开关决定）
  subagents:
    general_agent:
      enabled: true
    code_agent:
      enabled: false
      # max_iterations: 15
    research_agent:
      enabled: false
      # max_iterations: 15
    browser_agent:
      enabled: true
      # max_iterations: 15
  # ============ SkillTurbo 配置 ============
  skill_turbo:
    enabled: true                    # 总开关（未配置时默认 false）
    skill_name: pptx-craft           # PPT skill 外部目录名
    skill_checksum: ""               # 外部 skill 目录 SHA256 校验值（空=跳过校验）
  # ============ 统一工具开关（黑名单 disabled_tools）============
  # 列出的工具名将在 agent init 后从注册表注销，模型不可见；未列出者默认注册。
  # 两种格式二选一：
  #   1) YAML 列表：disabled_tools: ["search_skill", "install_skill"]
  #   2) 环境变量：disabled_tools: ${DISABLED_TOOLS-默认列表}
  #      在 .env 中设置：DISABLED_TOOLS=search_skill,install_skill（逗号/分号分隔）
  # 默认禁用 search_skill / install_skill / uninstall_skill（技能广场界面安装不受影响，
  # 那条链路走 SkillManager.handle_skills_install，不经模型工具）。
  # 单横线 ``-`` 仅在变量未设置时使用默认值；显式 DISABLED_TOOLS= 可清空黑名单。
  disabled_tools: ${DISABLED_TOOLS-search_skill,install_skill,uninstall_skill,code}
  answer_chunk_size: 500
  stream_chunk_threshold: 50
  stream_character_threshold: 2000
  kv_cache_affinity_config:
    enable_kv_cache_release: false
    enable_kv_cache_affinity: false
  # ============ 上下文引擎（上下文压缩/召回/会话记忆）============
  context_engine_config:
    enabled: true # 全局开关：false 时整个上下文引擎（含下列所有处理器）不生效
    enable_openrouter_model_context_window_tokens: false # 从 OpenRouter 拉取模型的上下文窗口大小；false 时按内置模型表解析
    # 显式覆盖上下文窗口 token 上限（正整数）；注释掉或留空则按模型自动解析
    # context_window_tokens: 131072
    enable_reload: true    # 卸载重载：开启后模型可通过 [[HANDLE:xxx]] 标记把已卸载的大消息原文拉回上下文

    enable_context_debug: false     # 上下文压缩 debug 模式：开启后各处理器在阈值判断、片段切分、压缩重试、 前后对比等每个阶段落盘 JSONL 记录，便于排查压缩问题。关闭时零开销。默认关闭
    # debug 记录目录；留空则按环境变量 OPENJIUWEN_CONTEXT_DEBUG_DIR，
    # 再缺省落到 {workspace}/context/{session_id}_context/context_debug/
    # context_debug_dir:

    # 压缩召回：压缩器替换原始消息时，把原文分块归档到会话目录 compression_recall/，
    # 模型可通过 [[COMPRESSION_RECALL: id=...]] 标记按需召回原文。默认关闭。
    compression_recall_config:
      enabled: false               # true 开启压缩召回（仅对对话/当前轮/轮次级三个压缩器生效）
      chunk_size_tokens: 3000      # 归档分块大小（tokens）
      chunk_overlap_tokens: 500    # 相邻分块重叠（tokens，须小于 chunk_size_tokens）

    # 消息摘要卸载器：把超大的工具消息摘要化卸载（保留 [[OFFLOAD:...]] 索引，可重载）
    message_summary_offloader_config:
      protected_tool_names: ["read_file", "read_pdf", "skill_tool"]  # 这些工具的输出保持原文，不卸载
      add_message_threshold_ratio: 0.1      # 新增工具消息超过上下文窗口容量的该比例时，立即卸载
      ttl_seconds: 300                      # 距上次模型请求空闲超过该秒数后，才允许做 TTL（闲时）卸载
      ttl_context_occupancy_ratio: 0.5      # 上下文占用超过该比例时，才允许做 TTL 卸载
      ttl_message_threshold_ratio: 0.05     # TTL 卸载时，单条工具消息超过窗口容量的该比例才被处理

    # 会话记忆：压缩发生前把已提交的关键信息沉淀为 session memory 笔记，
    # 后续作为压缩上下文块注入。默认关闭。
    # 配置分两层：外层是压缩器本体（何时触发、笔记多大）；
    # 内层 memory 是异步更新器（SessionMemoryManager，由独立 agent/模型后台更新笔记）的行为参数。
    session_memory_compressor_config:
      enabled: false               # true 开启会话记忆
      trigger_context_ratio: 0.8   # 上下文占用达到该比例时使用更新的笔记替换上下文、建议sessionmemory的阈值要小于等于下面的compressor，开启是下面的compressor作为兜底设计
      memory:
        update_trigger_context_ratio: 0.1   # 上下文占用达到该比例时异步更新记忆

    # 对话压缩器：整体对话历史超长时，把旧对话压缩成摘要
    dialogue_compressor_config:
      trigger_context_ratio: 0.8      # 上下文占用达到该比例时触发压缩
      min_target_context_ratio: 0.1   # 压缩目标下限（占窗口比例）

    # 当前轮次压缩器：单轮对话（含工具调用链）过长时压缩当前轮
    current_round_compressor_config:
      trigger_context_ratio: 0.8      # 上下文占用达到该比例时触发压缩
      min_target_context_ratio: 0.1   # 压缩目标下限（占窗口比例）
      keep_recent_messages: 4         # 保留最近消息数

    # 轮次级别压缩器：多轮长对话的三轮渐进式压缩（最强力，最后触发）
    round_level_compressor_config:
      trigger_context_ratio: 0.8      # 上下文占用达到该比例时触发压缩
      min_target_context_ratio: 0.1   # 压缩目标下限（占窗口比例）
      keep_recent_messages: 4         # 保留最近消息数

    # 兜底压缩：整窗口 token 超阈值时调一次 LLM 把历史压成 summary，并在尾部 reinject 最近 skill/file/task_status 等关键状态。
    # 仅用于溢出恢复：日常 add 路径不触发，由 ContextOverflowRecoveryRail 在 413/上下文溢出时靠 set_force_compact 在 GET 路径触发。
    # 413 恢复时 threshold_override 会按模型真实窗口*0.85 自适应覆盖下方 trigger_total_tokens。
    full_compact_processor_config:
      trigger_total_tokens: 100000   # 整窗口 token 阈值；溢出兜底用，高于日常压缩阈值，仅在真溢出时被动触发
      compression_call_max_tokens: 200000   # 压缩调 LLM 时的最大上下文预算
      messages_to_keep: 10                  # 保留最近 N 条；buffer < 此值时不会删历史，只新增 summary

    # 连续相同 reasoning+工具集 / 相同工具入参时，折叠重复轮次；超阈值后兜底中止
    reasoning_tool_loop_compact_config:
      enabled: true                        # 是否启用循环压缩
      consecutive_threshold: 3             # reasoning+工具名连续相同几轮触发压缩
      tool_args_consecutive_threshold: 5   # 工具名+入参连续相同几轮触发压缩（与 reasoning 无关）
      reasoning_min_chars: 4               # reasoning 低于此长度（strip 后）的轮次不参与匹配
      reasoning_preview_max_chars: 512     # 摘要里 reasoning 预览的最大字符数
      bailout_threshold: 3                 # reasoning 规则压缩次数达此值后中止
      tool_args_bailout_threshold: 2       # 工具入参规则压缩次数达此值后终止
  # Skills 在线自演进配置
  evolution:
    enabled: true             # true = 启用在线 Skills 自演进（挂载后被动扫描始终开启）
    signal_trigger: true      # true = 对话结束后被动 signal 扫描（run_evolution）；默认 true
    review_trigger: false     # true / false = Leader review follow-up；单 agent/teammate 由代码强制 false
    auto_save: true           # true = 自演进审批无需用户点击自动通过（内部开关）
    skill_create: false        # true = 注册 SkillCreateRail（单 agent）及 TeamSkillCreateRail（leader）
    skill_base_dir: "agent/skills"  # Skill 根目录
  a2x_registry:
    base_url: "http://127.0.0.1:8000"
    timeout: 30.0
    api_key: ""
    # null uses the SDK default ownership store under the process HOME.
    # Keep ownership persistent so teardown can call replace_agent_card safely.
    ownership_file:
    # Allowed values: teammate / teamleader
    role: "teammate"
    # When role=teammate, automatic blank-agent registration during agent
    # initialization calls AsyncA2XRegistryClient.register_blank_agent(...).
    # endpoint may be omitted in distributed mode; it defaults to
    # team.transport.params.bootstrap_direct_addr when available.
    dataset: "team_pool"
    endpoint: ""

  # 同轮多个受控 tool 的批次内并发
  concurrency:
    enabled: true
    tool_limits:
      web_search: 10
      task_tool: 10

tools:
  - todo
  - skill

email_settings:
  email_address: ${EMAIL_ADDRESS}
  token: ${EMAIL_TOKEN}
  smtp_server: ${SMTP_SERVER:-smtp.gmail.com}
  port: ${EMAIL_PORT:-587}

embed:
  embed_api_key: ${EMBED_API_KEY}
  embed_base_url: ${EMBED_API_BASE}
  embed_model: ${EMBED_MODEL}

task_memory:
  # Set enabled: true to activate TaskMemoryService skill tools
  # (experience_retrieve, experience_learn, experience_clear)
  enabled: true
  # Override defaults below if task memory uses a different model/key than the main agent
  llm_model: ${TASK_MEMORY_LLM_MODEL}
  embedding_model: ${TASK_MEMORY_EMBED_MODEL}
  api_key: ${TASK_MEMORY_API_KEY}
  api_base: ${TASK_MEMORY_API_BASE}
  # Retrieval and summary algorithms: ACE | ReasoningBank | ReMe
  retrieval_algo: ACE
  summary_algo: ACE

# ========== Redis（主备 Gateway：状态存储 / Pub/Sub / Leader；standalone 下不连接）==========
# 通过 gateway.deployment_mode 控制：standalone（不连接）/ active-standby（连接 Redis）
redis:
  # standalone | cluster；cluster 时下方 host 解析为逗号分隔的多节点列表
  mode: ${REDIS_MODE:-standalone}
  # 单机：host / host:port；cluster：逗号列表(如 10.0.0.11:6379,10.0.0.12:6379)；不带端口时用 port
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}
  # Session 数据过期时间（秒）
  session_ttl: ${REDIS_SESSION_TTL:-604800}
  key_prefix: ${REDIS_KEY_PREFIX:-jiuwenswarm:}
  pool_size: ${REDIS_POOL_SIZE:-10}
  connect_timeout: ${REDIS_CONNECT_TIMEOUT:-5}
  operation_timeout: ${REDIS_OPERATION_TIMEOUT:-10}
  health_check_interval: ${REDIS_HEALTH_CHECK_INTERVAL:-30}

gateway:
  # 产品形态：personal（个人版，默认）| enterprise（企业版）；影响 Gateway 存储选型（文件/DB、内存/Redis）
  edition: ${JIUWENSWARM_EDITION:-personal}

  # SessionMap 仅用于企业claw场景，如 feishu_enterprise 等通道：将平台身份映射为 Agent 的 session_id。
  # 取值：per_chat_bot（默认，同 chat+bot 共享会话）, per_chat_bot_user（按 user 分会话）
  session_map_scope: per_chat_bot

  # ========== 部署模式（企业/K8s；企业版下生效）==========
  # standalone（默认）：单机，不连 Redis
  # active-standby：主备，连接 Redis + LeaderElection 选主
  # distributed：多副本同时在线，连接 Redis 共享 session（无选主；cron 默认关闭；仅 web/tui 通道）
  deployment_mode: ${DEPLOYMENT_MODE:-standalone}
  # 分布式下用于实例标识；空则启动时自动生成
  instance_id: ${GATEWAY_INSTANCE_ID:-}

  # Web 会话存储位置：local（默认，会话文件在网关本地磁盘）| remote（会话在 Web Pod / 远程存储）
  # remote 时前端 SessionsPanel 不再浏览网关本地会话文件，仅支持恢复会话历史。
  web_session_storage: ${GATEWAY_WEB_SESSION_STORAGE:-local}

  # 企业版 Gateway 多副本：从共享库轮询 Gateway 自身配置（channel/logging/log_masking）
  config_poll:
    enabled: ${GATEWAY_CONFIG_POLL_ENABLED:-false}
    interval_seconds: ${GATEWAY_CONFIG_POLL_INTERVAL_SECONDS:-10}

  # AgentClient 配置 - Gateway 连接到 AgentServer 的方式
  # type: websocket（默认） | http（REST/SSE，须 Agent 已开 http_server） | yuanrong | agentos_router
  # http 不探测、不回退 WS；AGENT_SERVER_URL 用 http://host:8766，不要打 WS :18092。
  agent_client:
    type: websocket # websocket | http | yuanrong | agentos_router
    # yuanrong 函数模式配置下面参数
    frontend_endpoint:
    function_version_urn:
    concurrency: 1
    invoke_timeout_s: 60
    # POST/DELETE /api/agent 超时（秒）；create 含镜像拉取/容器启动，建议明显大于 invoke_timeout_s
    agent_timeout_s: 300
    # create 请求的 namespace，默认 default
    agent_namespace: default

  # AgentOS Router Extension 配置；agent_client.type=agentos_router 时生效。
  agentos:
    creating_timeout_seconds: 60
    # Agent create 时宿主机 workspace 父目录；实际路径为 {workspace_root}/{user_id}
    workspace_root: "/home/agentos/users"
    # Agent 复用 key 字段，默认 user_id + agent_type。
    # 可选字段：user_id、agent_type、session_id（必须包含前两项）。
    # 示例：加入 session_id 后同一用户每个会话独立 Agent。
    agent_key_fields:
      - user_id
      - agent_type
    registry:
      # Agent OS 注册中心地址（空=本地 stub，不发 HTTP）。一体机默认 http://127.0.0.1:8000
      endpoint:
      request_timeout_s: 10
      # 本机 nodeIP，供 POST /api/nodes/{node}/heartbeat
      node:
    # SSH 南向接入 YuanRong 实例（配合 channels.ssh 北向使用）：
    # ssh -p <port> 'yr:instance:<instance_id>'@<frontend-host>
    # 主机取自 agent_client.frontend_endpoint；<instance_id> 为 create agent 返回的实例 id。
    # 客户端私钥目录（默认 /root/.ssh；若模板含 {user_id} 则按用户替换）。
    ssh:
      port: 2222
      user_template: "yr:instance:{instance}"
      connect_timeout_s: 30
      client_keys_dir: "/root/.ssh"

heartbeat:
  # 心跳间隔（秒），默认 3600
  every: 3600
  # 心跳结果回传的 channel（如 "web"），
  target: web
  # 心跳生效时间段（本地时间），start <= now < end 时心跳生效
  active_hours:
    start: 08:00
    end: 22:00

execution_guard:
  # LLM 重试护栏：处理模型重复输出、流式帧超时，以及非流式 invoke 的瞬时网络/超时错误
  llm_retry_rail:
    # 总开关。关闭后不注册 LLMRetryRail，也不会额外拦截重复输出/流式帧超时
    enabled: true
    # 单次 invoke 内同一类异常最多重试次数；超过后把异常继续抛给上层
    max_retries: 2
    # 非流式 invoke 遇到 Connection error / Request timed out 等瞬时错误时是否自动重试
    retry_transient_invoke_errors: true
    # 重试进行中是否向前端推送可见提示（映射为 chat.delta）
    notify_user_on_retry: true
    # 重试用尽后是否向前端推送 chat.error，避免静默结束
    notify_user_on_exhausted: true
    # 重复片段检测的最短长度，单位：字符；用于检测短句/短片段循环输出
    repeat_min_pattern_chars: 2
    # 重复片段检测的最长长度，单位：字符；过长片段不作为循环模式检测
    repeat_max_pattern_chars: 64
    # 同一片段至少连续重复多少次才认为疑似死循环
    repeat_min_count: 6
    # 多字符重复输出的最小总长度，避免正常短文本重复误触发
    repeat_min_total_chars: 160
    # 滑动检测窗口大小，单位：字符；仅保留最近窗口内容用于重复判断
    repeat_window_chars: 1024
    # 单字符连续重复阈值，用于检测分隔线等场景，默认较高以减少误判
    single_char_repeat_count: 90

# Agent RAS 整体配置
agent_ras:
  # 总开关。无本段时 create_deep_agent 默认挂 RAS；enabled: false 时 deep 传 False 关闭
  enabled: true
  detectors:
    # 工具循环检测
    repeat_tool:
      enabled: true
      # circuit_breaker_recovery: 相同工具+参数重复达到该次数时告警（LOW）
      warning_threshold: 5
      # ping-pong 交替轮次达到该次数时告警（LOW，不要求 no_progress）
      critical_threshold: 10
      # 全局兜底：连续相同调用且无进展达到该次数时 CRITICAL 断路
      global_breaker_threshold: 10
      # 未知/错误工具连续失败达到该次数时 CRITICAL（WARNING 为阈值一半）
      unknown_tool_threshold: 10
    # LLM 文本/思考死循环检测（门槛单位：字符）
    llm_thinking_loop:
      enabled: true
      # 默认启用 L3 语义 Judge；显式 false 才关闭（关闭后仅 L1/L2 字面检测）
      semantic_content_enabled: true
      # 累计字符达到该门槛后才开始 L1/L2/L3 检测
      detection_start_chars: 30000
      # L1/L2 近窗大小 = 扫描间隔 = 最小可检长度（FIFO 截断最旧内容）
      window_max_chars: 2000
      # suffix_cycle / similar_clauses 重复次数阈值
      loop_repeat_threshold: 5
      # 分句相似度阈值（0~1，越高越严格）
      similar_clause_sim_threshold: 0.95
      # 启动后，自上次 L3 eval 起新增字符达到该门槛才触发语义检测
      semantic_eval_chars: 10000
  # 恢复侧通用配置
  recovery:
    # LOW 警告时是否向用户推送可见 notice（steering 始终按 policy 执行）
    notify_user_on_warning: true

