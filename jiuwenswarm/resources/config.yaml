# ========== 细粒度权限管控（tiered_policy）==========
#
# schema: tiered_policy（或兼容 v_cc / v4.2）时由 tiered_policy.evaluate_tiered_policy 求值；
# permission_mode: normal|strict 决定 severity 映射，见 agentserver/permissions/tiered_policy.py。
# severity（normal）：LOW/MEDIUM→allow，HIGH/CRITICAL→ask；strict 下 MEDIUM→ask、CRITICAL→deny。
# rules[*].action: 可选显式动作 allow|ask|deny；配置后优先于 severity 映射，适合敏感文件读取、
# 系统控制等不希望随 permission_mode 漂移的规则。
# 内置参数规则 > 用户 rules；整工具存在则不用 defaults；详见 tiered_policy 模块说明。
#
# 三种动作: allow / ask / deny
permissions:
  enabled: false
  schema: tiered_policy
  permission_mode: normal
  # 技能级动态授权（Skill overlay）：默认关闭；开启后根 SKILL.md 加载经
  # SkillAuthorizationRail 门禁审批，ACTIVE Grant 参与权限合成。
  skill_authorization:
    enabled: false
  defaults:
    '*': allow
  tools:
    bash: allow
    mcp_exec_command: ask
    create_terminal: ask
    write: allow
    write_file: allow
    edit_file: allow
    skill_tool: allow
    read_file: allow
    skill_complete: allow
    search_replace: allow
    ask_user: allow
    write_memory: allow
    edit_memory: allow
    read_memory: allow
    memory_search: allow
    memory_get: allow
    todo_create: allow
    todo_insert: allow
    todo_complete: allow
    todo_remove: allow
    todo_list: allow
    coding_memory_write: allow
    coding_memory_edit: allow
    coding_memory_read: allow
    ltm_search: allow
    ltm_search_summary: allow
    mem0_profile: allow
    mem0_search: allow
    mem0_conclude: allow
    viking_search: allow
    viking_read: allow
    viking_browse: allow
    viking_remember: allow
    viking_add_resource: allow
    web_search: allow
    mcp_fetch_webpage: allow
    cron_list_jobs: allow
    cron_get_job: allow
    cron_create_job: allow
    cron_update_job: allow
    cron_delete_job: allow
    cron_toggle_job: allow
    cron_preview_job: allow
    acp_chat: ask
    skill_acceleration_exec: ask

  rules:
    - id: shell_allow_dir
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: dir *
      severity: LOW
    - id: shell_allow_ls
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: ls *
      severity: LOW
    - id: shell_allow_pwd
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: pwd *
      severity: LOW
    - id: shell_allow_cd
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: cd *
      severity: LOW
    - id: shell_allow_echo
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: echo *
      severity: LOW
    - id: shell_allow_cat
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: cat *
      severity: LOW
    - id: shell_allow_type
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: type *
      severity: LOW
    - id: shell_allow_head
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: head *
      severity: LOW
    - id: shell_allow_tail
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: tail *
      severity: LOW
    - id: shell_allow_git_status
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: git status *
      severity: LOW
    - id: shell_allow_git_log
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: git log *
      severity: LOW
    - id: shell_allow_git_diff
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: git diff *
      severity: LOW
    - id: shell_allow_git_branch
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: git branch *
      severity: LOW
    - id: shell_ask_rm
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: rm *
      severity: HIGH
    - id: shell_ask_del
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: del *
      severity: HIGH
    - id: shell_ask_rd
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: rd *
      severity: HIGH
    - id: shell_ask_mv
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: mv *
      severity: HIGH
    - id: shell_ask_cp
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: cp *
      severity: HIGH
    - id: shell_ask_chmod
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: chmod *
      severity: HIGH
    - id: shell_ask_chown
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: chown *
      severity: HIGH
    - id: shell_ask_sensitive_file_reads
      tools:
        - bash
        - mcp_exec_command
        - create_terminal
      pattern: re:(?i)(^|[\s;&|()])((cat|type|less|more|head|tail|grep|find|Get-Content|Select-String)\b[^;&|]*(id_rsa|id_ed25519|\.pem\b|\.pfx\b|\.key\b|\.kube/config|\.aws/(credentials|config)|\.npmrc\b|\.env(\.[A-Za-z0-9_-]+)?\b|authorized_keys|\.ssh/))
      severity: HIGH
  owner_scopes: {}
  deny_guidance_message: ''
  file_guard:
    enabled: true
    defaults:
      read: ask
      write: ask
      exec: ask
    workspace:
      read: allow
      write: allow
      exec: allow
    paths:
      - path: '**/.ssh/**'
        match: glob
        read: ask
        write: ask
        exec: ask
      - path: '**/.env*'
        match: glob
        read: ask
        write: ask
        exec: ask
  external_directory:
    '*': ask
browser:
  # chrome_path can be a string or per-OS map.
  # Example:
  # chrome_path:
