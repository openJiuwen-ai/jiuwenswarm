<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务关系</title>
<link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="page page-graph">

  <header class="topbar">
    <div class="tb-main">
      <div class="tb-title">
        <h1 id="graph-title" title="任务关系">任务关系</h1>
        <span class="badge" id="graph-status-badge" hidden></span>
      </div>
      <div class="tb-sub" id="graph-meta"></div>
    </div>
    <div class="tb-actions">
      <button id="btn-focus" type="button" title="聚焦选中任务的依赖链（上游 + 下游）">依赖链</button>
      <button id="theme-btn" type="button" title="切换主题">系统</button>
    </div>
  </header>

  <div class="statusbar" id="statusbar" hidden></div>

  <div class="toolbar">
    <input id="search-input" class="search" type="search" placeholder="搜索任务 / 负责人 / 正文" autocomplete="off" spellcheck="false">
    <div class="chips" id="chips"></div>
    <div class="zoombar">
      <button id="btn-zoom-out" class="zbtn" type="button" title="缩小">−</button>
      <span class="zlabel" id="zoom-label">100%</span>
      <button id="btn-zoom-in" class="zbtn" type="button" title="放大">+</button>
      <button id="btn-fit" type="button" title="显示全图">全图</button>
      <button id="btn-layout" type="button" title="切换横向 / 纵向布局">横向</button>
      <span class="spacer"></span>
      <span class="tb-note" id="graph-note"></span>
    </div>
  </div>

  <div class="canvas-wrap" id="canvas">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="任务依赖关系图">
      <defs>
        <marker id="tcv-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--edge-strong)"></path>
        </marker>
        <marker id="tcv-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path>
        </marker>
        <marker id="tcv-arrow-chain" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="edge-layer"></g>
        <g id="node-layer"></g>
      </g>
    </svg>

    <div class="canvas-empty" id="canvas-empty" hidden>
      <div class="empty">
        <div class="empty-t" id="canvas-empty-t">暂无任务数据</div>
        <div class="empty-d" id="canvas-empty-d"></div>
      </div>
    </div>

    <aside class="detail" id="detail" hidden aria-label="任务详情">
      <div class="detail-h">
        <div class="dt-t" id="detail-title"></div>
        <button class="detail-close" id="detail-close" type="button" title="关闭（Esc）" aria-label="关闭">×</button>
      </div>
      <div class="detail-b" id="detail-body"></div>
    </aside>
  </div>

  <script src="./assets/app.js"></script>
  <script src="./assets/layout.js"></script>
  <script src="./assets/graph.js"></script>
</body>
</html>
