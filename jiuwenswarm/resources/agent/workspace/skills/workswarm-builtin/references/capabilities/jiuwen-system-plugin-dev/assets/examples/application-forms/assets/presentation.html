<!doctype html>
<html lang="zh" data-window-transition>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Application forms</title>
  <link rel="stylesheet" href="presentation.css">
  <link rel="stylesheet" href="bee-controls.css">
</head>
<body>
  <main id="forms" data-mode="bee">
    <section id="capsule-deck" class="capsule-deck" hidden>
      <header class="deck-tools"><span id="deck-count"></span><span class="deck-actions"><button id="deck-new" type="button" data-text="newConversation"></button><button id="deck-collapse" type="button" data-text="collapse"></button></span></header>
      <div id="deck-pages" class="deck-pages"></div>
      <footer id="deck-pagination"><span><button id="deck-prev" data-title="previousPage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><span id="deck-position"></span><button id="deck-next" data-title="nextPage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></span></footer>
    </section>
    <section id="card" class="card" hidden aria-label="Conversation">
      <header class="card-head">
        <details id="conversation-menu" class="heading conversation-menu">
          <summary id="conversation-title"><span id="selected-title"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></summary>
          <div class="conversation-options" role="menu">
            <div id="sessions" role="group" aria-label="Conversation"></div>
            <hr>
            <button id="workspace" type="button" role="menuitem" data-text="workspace"></button>
          </div>
        </details>
        <button id="card-workspace" type="button" class="icon" data-title="workspace" aria-label="Workspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5m0-5L10 14m9-1v6H5V5h6"/></svg></button>
        <button id="collapse" class="icon" data-title="collapse" aria-label="Collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button>
        <button id="card-close" type="button" class="icon" data-title="closePanel" aria-label="Close panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </header>
      <div class="state-line"><span id="activity-dot" class="state-dot"></span><span id="activity"></span></div>
      <div id="reply" class="reply" role="region" tabindex="0" data-title="lastReply" aria-live="polite"></div>
      <div id="running" class="running" hidden></div>
      <label class="model-row"><span data-text="model"></span><select id="model" data-title="model" data-testid="application-forms-model"></select></label>
      <form id="composer" class="composer">
        <input id="input" maxlength="16000" autocomplete="off" data-placeholder="placeholder" aria-label="Reply">
        <button id="send" type="submit" class="send" data-title="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
      <div id="confirmation" class="confirmation" hidden><span data-text="confirmation"></span><button id="confirm-workspace" data-text="workspace"></button></div>
      <div id="error" class="error" role="alert" hidden></div>
      <footer><span id="target"></span><button id="capsule-workspace" data-text="workspace"></button></footer>
    </section>
    <section id="notices" class="notices" hidden>
      <header class="bee-list-head"><span id="bee-list-title" role="status"></span><button id="bee-list-close" type="button" class="summary-toggle" data-title="closePanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
      <div id="bee-list-rows" class="bee-list-rows"></div>
      <p id="bee-list-empty" class="bee-list-empty" data-text="noRecent" hidden></p>
      <div id="bee-list-error" class="error" role="alert" hidden></div>
      <footer class="bee-list-foot"><div id="bee-pagination"><button id="bee-prev" type="button" class="summary-toggle" data-title="previousPage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><span id="bee-page" role="status"></span><button id="bee-next" type="button" class="summary-toggle" data-title="nextPage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div><button id="bee-all" type="button" class="bee-all" data-text="allConversations" hidden></button></footer>
    </section>
    <div class="dock">
      <div id="bee-shell" class="bee-shell">
        <button id="bee" class="bee" data-title="beeHelp" aria-label="Bee"><canvas id="bee-canvas" width="512" height="512" role="img" aria-label="Bee"></canvas><img id="sprite" alt="Bee" hidden></button>
        <div id="bee-actions" class="bee-actions">
          <button id="badge" type="button" class="bee-action" hidden><span></span></button>
          <button id="bee-new" type="button" class="bee-action" data-title="newConversation"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
        </div>
      </div>
      <div id="capsule" class="capsule" hidden><span class="pulse"></span><button id="capsule-open" class="capsule-open" type="button"><span id="capsule-title"></span></button><span id="capsule-status"></span><span id="capsule-count" class="count" hidden></span><button id="settings-workspace" type="button" class="summary-toggle" data-title="workspace" aria-label="Workspace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5m0-5L10 14m9-1v6H5V5h6"/></svg></button><button id="capsule-expand" class="summary-toggle" type="button" data-title="expandList" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
    </div>
  </main>
  <script src="bee-mesh.js"></script>
  <script src="bee-animation.js"></script>
  <script src="recall-motion.js"></script>
  <script src="form-geometry.js"></script>
  <script src="transition-sound.js"></script>
  <script src="presentation.js"></script>
</body>
</html>
