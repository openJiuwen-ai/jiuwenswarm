<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>流光极昼 · 开场</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f3fb; color: #23213a;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    .stage { position: fixed; inset: 0; display: grid; place-items: center; }
    .glow { position: absolute; width: 140vmax; height: 40vmax; left: -20vmax; top: calc(50% - 20vmax);
      background: linear-gradient(90deg, rgba(137,120,230,0), rgba(137,120,230,.35), rgba(94,196,214,.3), rgba(236,160,200,.28), rgba(236,160,200,0));
      filter: blur(40px); transform: translateX(-60%) rotate(-6deg); opacity: 0; }
    .run .glow { animation: sweep 2.4s cubic-bezier(.45,0,.2,1) forwards; }
    .text { position: relative; text-align: center; }
    .hello { font-size: 40px; font-weight: 600; letter-spacing: .18em; opacity: 0; transform: translateY(10px); }
    .date { margin-top: 14px; font-size: 13px; letter-spacing: .4em; color: #6b6890; opacity: 0; }
    .run .hello { animation: rise .8s cubic-bezier(.16,1,.3,1) .35s forwards; }
    .run .date { animation: fade .8s ease .7s forwards; }
    .run .stage { animation: out .5s ease 2.3s forwards; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(-60%) rotate(-6deg); } 30% { opacity: 1; } 100% { opacity: .9; transform: translateX(20%) rotate(-6deg); } }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes out { to { opacity: 0; transform: scale(1.02); } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="text">
      <div class="hello" id="hello">你好</div>
      <div class="date" id="date"></div>
    </div>
  </div>
  <script src="../_workswarm/theme-sdk.js"></script>
  <script>
    (function () {
      var played = false;
      function greeting(hour) {
        if (hour < 5) return '夜深了';
        if (hour < 11) return '早上好';
        if (hour < 14) return '中午好';
        if (hour < 18) return '下午好';
        return '晚上好';
      }
      function play(context) {
        if (played) return;
        played = true;
        var now = new Date();
        document.getElementById('hello').textContent = greeting(now.getHours()) + '，' + (context.operator || '你');
        document.getElementById('date').textContent =
          now.getFullYear() + ' · ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日';
        document.documentElement.classList.add('run');
        setTimeout(function () { WorkSwarmThemeSDK.complete(); }, 2750);
      }
      WorkSwarmThemeSDK.onStart(play);
    })();
  </script>
</body>
</html>
