version: 2
purpose: >-
  版面骨架库。每一项是一种可复用的版面骨架。
  设计页面前先通读全部 name，建立"有哪些骨架可选"的认识，再按内容挑一个。
  带 image 字段的条目可以打开对应图片确认细节；没有 image 的条目只有文字描述，
  按 skeleton 的分区图、rules 和 variants 理解即可，不要去找不存在的配图。
  骨架是选型参考，不是强制模板：它给出分区、比例和填满方式的参考方案，
  不规定坐标、颜色、数量和具体内容。内容需要时可以偏离骨架，
  但 common_rules 对所有页面硬性生效。


common_rules:
  - 标准内容页必须填满内容区，不得出现大块空白；内容不足时扩写正文或合并页面，不靠留白撑版面
  - 所有区域顶端、底端、左右边界对齐到同一组轴线，区域之间只留必要的间距沟
  - 内容必须结束在底部总结条上方，不得侵入页脚
  - 骨架只描述空间关系；比例、区域数量和分组数量都随内容变化，不得当作固定模板
  - 以上五条对所有页面硬性生效；layouts 里各项的 skeleton / rules / variants 是参考，可按内容偏离
  - 同一 deck 内跨页复用同一套字号角色、颜色角色和对齐轴线

layouts:
  - id: problem-diagram-analysis
    name: 左图右文 · 满版
    image: problem-diagram-analysis.jpg
    summary: 主图占左侧大半，右侧文字列与之等高，两栏都顶到页面边界
    skeleton: |
      +---------------- 通栏标题 ----------------+
      +----------------------+  +--------------+
      |                      |  | 小标题        |
      |                      |  | 正文段        |
      |      主图  ~55%      |  | 小标题        |
      |                      |  | 正文段        |
      |                      |  | 小标题        |
      +----------------------+  +--------------+
      +--------------- 总结条 ---------------+
    rules:
      - 左右约 55:40，中间留一条约 5% 的空白沟
      - 两栏顶端对齐、底端也对齐，共同结束在总结条上方
      - 主图撑满左栏，宽度不够就压缩图内元素间距，不要在图周围留边
      - 右栏各段均分栏高，文字不足时把每段写长，而不是让下半栏空着
      - 右栏写完整论证段（每段 3-4 行），不是短标签
      - 图内可用有限彩色区分状态类别，连接线一律灰色
    use_when:
      - 结构关系和文字判断都要展示，且两边内容量都够撑满
    avoid_when:
      - 只有图或只有文字
      - 文字只有三五个短标签，撑不满右栏
    variants:
      - 图文左右互换
      - 主图换成照片、论文原图或数据图表
      - 右栏两段或四段，段数由内容定

  - id: evolution-landscape
    name: 散点版图 · 曲线串联
    image: evolution-landscape.jpg
    summary: 多个信息卡自由散布在整版，用曲线串成一条时间或演进主线
    skeleton: |
      +---------------- 通栏标题 ----------------+
        +------+                       +------+
        | 卡片 |    +------+           | 卡片 |
        +------+    | 卡片 |           +------+
           \        +------+          /
        [节点]-------\      +------+  /
             \        [节点]-| 卡片 |
        +------+  \          +------+   +----+
        | 卡片 |   +------+               图例
        +------+   | 卡片 |
                   +------+
      +--------------- 总结条 ---------------+
    rules:
      - 卡片位置服从主线走向，不排成栅格；主线可以是曲线而非直线
      - 卡片大小随条目数变化，不强制等宽等高
      - 主线上标注时间区间或阶段名，卡片内不重复标注
      - 卡片之间保持足够间距，但整版四角都要有内容，不留空象限
      - 需要区分类别时用一两种颜色，右下角配小图例
    use_when:
      - 跨时间的技术、机构或产品演进，条目数量多且分布不均
      - 条目本身（名称、Logo）就是证据
    avoid_when:
      - 只有三到五步的简单流程
      - 事件没有可靠时间顺序
    variants:
      - 主线横向、斜向或蛇形
      - 卡片内用实体 Logo 或纯文字列表

  - id: paper-reproduction
    name: 左双图 · 右表加长文
    image: paper-reproduction.jpg
    summary: 左栏上下叠放两张结构图，右栏上方放数据表、下方放长文说明
    skeleton: |
      +---------------- 通栏标题 ----------------+
      +------------------+  +-------------------+
      |     结构图 1     |  |      数据表       |
      +------------------+  +-------------------+
      | 图题（加粗）     |  | 小标题            |
      +------------------+  | 正文条目          |
      |     结构图 2     |  | 正文条目          |
      +------------------+  | 正文条目          |
      | 图题（加粗）     |  | 正文条目          |
      +------------------+  +-------------------+
    rules:
      - 左右约 45:52；左栏两图上下等分，各自带一行加粗图题
      - 图按原始宽高比缩放，宁可左右留窄边也不拉伸
      - 右栏表格只占上部约三分之一，其余留给长文条目
      - 长文条目用主题色标签词起头，后接完整句子，逐条撑满右栏高度
      - 两栏底端对齐
    use_when:
      - 同时需要展示原始结构图和量化结果
      - 有两张同族结构图需要对照
    avoid_when:
      - 只有一张图（改用左图右文）
      - 没有可验证的数据表
    variants:
      - 左栏改为一张大图加一张小图
      - 右栏表格换成数据图表

  - id: evidence-workflow
    name: 编号流程 · 不等宽多列
    image: evidence-workflow.jpg
    summary: 若干带编号的步骤块横向排布，宽度按证据量分配，箭头只负责导读
    skeleton: |
      +---------------- 通栏标题 ----------------+
      +-------------+ > +-------------+  +------+
      | (1) 步骤名  |   | (2) 步骤名  |  | (6)  |
      | +---------+ |   | +---------+ |  +------+
      | | 截图/码 | |   | | 截图/码 | |     ^
      | +---------+ |   | +---------+ |     |
      | +---------+ |   +-------------+  +------+
      | | 截图/码 | |   +-------------+  | (5)  |
      | +---------+ |   | (3) 步骤名  |  |      |
      +-------------+   +-------------+  +------+
    rules:
      - 列宽按该步的证据体量分配，不等宽是常态
      - 编号用主题色圆形徽章置于步骤名左侧，编号连续贯穿全页
      - 截图、代码块按原比例嵌入，暗色截图与白底形成对比，不加装饰边框
      - 步骤块用浅灰虚线框分组，箭头只做相邻指向，不画长距离连线
      - 允许折行排布（上排从左到右，下排从右到左），保持阅读连贯
    use_when:
      - 有真实的截图、代码或运行结果串成一条处理链路
      - 步骤数在 4-6 之间
    avoid_when:
      - 只有抽象流程，没有真实过程材料
      - 步骤超过 6 个（拆页或改用管线图）
    variants:
      - 单排横向或双排折行
      - 末尾加一个"结果/入库"终点块

  - id: architecture-evidence
    name: 外框内左文右图
    image: architecture-evidence.jpg
    summary: 整页套一个大圆角外框，框内左侧写论证、右侧放图表与数据解读
    skeleton: |
      +---------------- 通栏标题 ----------------+
      +-----------------------------------------+
      |           框内居中副标题                |
      | [] 小标题       | +-------------------+ |
      |  > 论点段落     | |     数据图表      | |
      |  > 论点段落     | +-------------------+ |
      | [] 小标题       | 数据解读条目          |
      |    论述段落     | 数据解读条目          |
      | [] 小标题       | 数据解读条目          |
      |    论述段落     | 主题色结论句            |
      +-----------------------------------------+
      +--------------- 总结条 ---------------+
    rules:
      - 大外框包住整个论证，框内不再给每段套小框
      - 框内左右约 50:45；左文右图，文字与图表权重接近
      - 左侧用主题色小方块加主题色小标题分节，节内用箭头符号列论点
      - 右侧图表下方紧跟数据解读条目，末行用主题色写出结论
      - 术语强调与结论强调各用一种固定处理（如术语加粗、结论用主题色），两者不混用
    use_when:
      - 需要机制解释、优劣分析和实验证据同时出现
      - 一张原始图表是结论的关键证据
    avoid_when:
      - 只有架构关系或只有实验图
      - 内容量撑不满一个整页外框
    variants:
      - 左右互换
      - 左侧分节数量随内容增减

  - id: taxonomy-matrix
    name: 双栏并列 · 三层嵌套
    image: taxonomy-matrix.jpg
    summary: 左右两个大框各承载一个分类体系，框内色块分组，组内白色节点
    skeleton: |
      +---------------- 通栏标题 ----------------+
      +-------------------+  +------------------+
      |    体系 A 标题    |  |    体系 B 标题   |
      | +---------------+ |  | +--------------+ |
      | | 分组名（色块）| |  | | 分组名（色块）| |
      | | [节点][节点]  | |  | | [节点][节点] | |
      | | [节点][节点]  | |  | +--------------+ |
      | +---------------+ |  | +--------------+ |
      | +---------------+ |  | | 分组名（色块）| |
      | | 分组名（色块）| |  | | [节点][节点] | |
      | | [节点][节点]  | |  | +--------------+ |
      +-------------------+  +------------------+
    rules:
      - 左右等宽并列，各自套一个白底细边外框
      - 框内分组用浅色块承载，组名居中；组内条目用白色小节点
      - 同一层级的节点等高，一行放 2-3 个，行数随条目数增加
      - 两栏的分组数量可以不同，但底端必须齐平
      - 浅色只用于区分分组语义，节点一律白底
    use_when:
      - 两个体系需要并列对照，且各自有明确的层级
      - 条目总数较多但可归入少数分组
    avoid_when:
      - 内容只是平级要点或简单对比
      - 只有一个体系（改用整页单栏分组）
    variants:
      - 两栏改三栏
      - 分组内节点单列排布

  - id: conclusion-editorial
    name: 通栏双块 · 长文条目
    image: conclusion-editorial.jpg
    summary: 两个通栏圆角框上下排布，每框内是主题色标题加数条 2-3 行的长句
    skeleton: |
      +---------------- 通栏标题 ----------------+
      +-----------------------------------------+
      | 主题色小标题                              |
      |  · 加粗引导词：完整长句，占 2-3 行 ..... |
      |  · 加粗引导词：完整长句，占 2-3 行 ..... |
      |  · 加粗引导词：完整长句，占 2-3 行 ..... |
      +-----------------------------------------+
      +-----------------------------------------+
      | 主题色小标题                              |
      |  · 加粗引导词：完整长句，占 2-3 行 ..... |
      |  · 加粗引导词：完整长句，占 2-3 行 ..... |
      +-----------------------------------------+
    rules:
      - 两块都是通栏宽度，上下堆叠，块间留一道等距间隙
      - 每条必须是 2-3 行的完整长句，用加粗引导词起头再接冒号
      - 块高按条目数分配，两块加起来撑满内容区
      - 纯文字页，不放图标、卡片和装饰图形
      - 字号保持正文级，不靠放大字号填充版面
    use_when:
      - 章节末整合洞察与机会，视觉证据已在前文建立
      - 内容以完整判断为主
    avoid_when:
      - 仍需展示关键数据、关系或图像证据
      - 只有短标签，写不出长句
    variants:
      - 两块改三块
      - 每块内条目数随内容增减

  - id: timeline-slide
    name: 横向时间轴 · 图文三层
    summary: 顶部导语段，中间一条横向时间轴，下方一排等高照片，底部引语
    skeleton: |
      +---------------- 通栏标题 ----------------+
      | 导语段落（3-4 行通栏）           +------+ |
      |                                  | 小图 | |
      |  说明   说明   说明   说明   说明 +------+ |
      |----o------o------o------o------o------o->|
      | 日期   日期   日期   日期   日期   日期   |
      | +----+ +----+ +----+ +----+ +----+ +----+|
      | |照片| |照片| |照片| |照片| |照片| |照片||
      | +----+ +----+ +----+ +----+ +----+ +----+|
      | " 引语段落 ................."            |
      |                        — 署名 / 来源      |
    rules:
      - 时间轴通栏贯穿，节点等距，主题色圆点标注
      - 节点说明在轴上方、日期在轴下方，两者垂直对齐到同一节点
      - 照片一排等高等宽，紧贴轴下方，之间留窄缝
      - 顶部导语通栏 3-4 行，右上角可放一个小配图补足空白
      - 底部引语用引号符号起止，署名右对齐
    use_when:
      - 内容按真实时间演进，且每个节点都有照片或凭证
      - 里程碑数量在 5-7 个
    avoid_when:
      - 只是流程而非时间演进
      - 没有可用的过程照片
    variants:
      - 去掉底部引语，照片放大
      - 节点数变化，但保持等距

  - id: achievement-slide
    name: 斜切主图 · 底部指标
    summary: 上部左图右文以斜切边分割，下部一排图标加大数字
    skeleton: |
      +---------------- 通栏标题 ----------------+
      +------------------\   +------------------+
      |                   \  |  小标题          |
      |     主照片         \ |  ---             |
      |                     \|  大字号陈述句    |
      |                      |  占 2 行         |
      +----------------------+------------------+
       (icon)    (icon)    (icon)    (icon)
       20.8万员工 54%占比  170+国家  30亿+联接
    rules:
      - 上部约占内容区三分之二，下部指标带占三分之一
      - 主图与文字块之间用斜切边分隔，斜边角度全 deck 统一
      - 右侧文字块只放一个小标题、一条主题色短线和一段大字号陈述
      - 底部指标等距排布，图标在上、数字加标签在下，数字用主题色
      - 指标带通栏，左右两端与上部区块对齐
    use_when:
      - 有一张高质量主照片，且有 3-5 个真实指标
      - 需要定性叙述与定量证据同时出现
    avoid_when:
      - 没有真实照片或可靠指标
      - 指标之间有复杂关系（应改用图表）
    variants:
      - 斜切改为直切
      - 图文左右互换

  - id: highlight-slide
    name: 2x2 卡片 · 卡内图文
    summary: 四个等大灰底卡片排成两行两列，每张卡内左图右文加底部数字
    skeleton: |
      +---------------- 通栏标题 ----------------+
      +--------------------+ +------------------+
      | 主题色卡标题         | | 主题色卡标题       |
      | +-----+ 说明段落   | | +-----+ 说明段落 |
      | | 图片| 说明段落   | | | 图片| 说明段落 |
      | +-----+ ---------  | | +-----+ -------- |
      |        2 场 20+ 场 | |        1 场 1 个 |
      +--------------------+ +------------------+
      +--------------------+ +------------------+
      | 主题色卡标题         | | 主题色卡标题       |
      | +-----+ 说明段落   | | +-----+ 说明段落 |
      | | 图片| 说明段落   | | | 图片| 说明段落 |
      +--------------------+ +------------------+
    rules:
      - 四卡等大、严格对齐，卡间留等距缝隙，整体撑满内容区
      - 卡内左图右文，图片按原比例，宽度约占卡宽三分之一
      - 卡标题主题色加粗置于卡片左上，说明段落 4-6 行
      - 卡底用一条细主题色线分隔，线下放主题色大数字加灰色单位标签
      - 只有内容真正平级时才用；权重不同的内容不要硬塞进等大卡片
    use_when:
      - 四个平级主题，各自都有图片、说明和量化结果
      - 内容确实适合矩阵化扫描
    avoid_when:
      - 各项权重明显不同
      - 内容之间有流程、因果或时间关系
      - 为凑数量而拆分内容
    variants:
      - 改为 1x3 或 1x2
      - 去掉图片，仅文字加数字

  - id: toc-slide
    name: 单列目录 · 居中
    summary: 浅灰底，左上角标题配主题色短线，中央偏左一列主题色方块编号加章节名
    skeleton: |
      +-----------------------------------------+
      | 目录                                    |
      | ====                                    |
      |                                         |
      |          [1]  章节名称                  |
      |                                         |
      |          [2]  章节名称                  |
      |                                         |
      |          [3]  章节名称                  |
      |                                         |
      |          [4]  章节名称                  |
      +-----------------------------------------+
    rules:
      - 整页浅灰底，区别于白底内容页
      - 标题置左上，下方一条主题色短粗线
      - 编号用主题色实心方块加白字，方块与章节名基线对齐
      - 条目整体在页面中央偏左，条目间距均等，随条目数自适应
      - 不加页码、进度条和装饰图形
    use_when:
      - Deck 需要正式目录或章节导航
      - 一级章节 3-7 个
    avoid_when:
      - 页数很少，目录不增加导航价值
      - 用户模板提供了不同的目录结构
    variants:
      - 章节名后加一行灰色小字说明
      - 当前章节高亮（分节页复用时）

  - id: complex-slide
    name: 矩阵分组 · 漏斗汇聚 · 路径带
    image: complex-slide.jpg
    summary: 上部行标签加多族群矩阵，中间大箭头汇聚，下部三段横向路径带
    skeleton: |
      +---------------- 通栏标题 ----------------+
      | 导语句（主题色强调关键词）                |
      |[标签]| 族群A |    族群B    |族群C |族群D |
      |[标签]| 类1|类2| 类3|类4|类5| 类6|类7|类8 |
      |[标签]| [] | [] | [] | []| []| [] | []|[]|
      |       \___________  ____________/       |
      |                   \/  (汇聚箭头)        |
      |           ---- 路径带标题 ----          |
      |  [ 阶段一 ] > [ 阶段二 ] > [ 阶段三 ]   |
      |  +---------+  +---------+  +---------+  |
      |  |  卡片   |  |  卡片   |  |  卡片   |  |
      +-----------------------------------------+
    rules:
      - 上部用最左一列窄标签列标注每行含义，右侧族群列宽按子类数量分配
      - 族群表头用浅色块区分，子类和条目一律白底
      - 中部用一个大号浅灰箭头把上部整体汇聚到下部，箭头跨越多列
      - 下部路径带用箭头形色块表示阶段，阶段下方挂卡片
      - 上下两部分左右边界对齐，整页无空白象限
    use_when:
      - 需要同时表达分类体系和它导出的路径或结论
      - 内容量足以填满一个高密度整页
    avoid_when:
      - 信息只是简单线性流程
      - 缺少足够内容支撑两层结构
    variants:
      - 去掉汇聚箭头，两部分用细线分隔
      - 路径带阶段数变化

  - id: explanation-slide
    name: 顶部阶段带 · 中部因素列 · 底部结论带
    summary: 顶部箭头形阶段带，中部大框内多列图标加长文，底部箭头形结论带
    skeleton: |
      +---------------- 通栏标题 ----------------+
      | [ 阶段一 >][ 阶段二 >][ 阶段三 >]        |
      | +-------------------------------------+ |
      | | (icon) (icon) (icon) (icon) (icon)  | |
      | | 标题 标题 标题 标题 标题          | |
      | | ----- ----- ----- ----- -----       | |
      | | 正文段 正文段 正文段 正文段 正文段  | |
      | | 正文段 正文段 正文段 正文段 正文段  | |
      | +-------------------------------------+ |
      | [ ...... 底部结论带（箭头形） ...... ]  |
      +-----------------------------------------+
    rules:
      - 顶部阶段带和底部结论带都用箭头形色块，宽度通栏
      - 中部一个大浅灰框包住所有因素列，列间不再加分隔框
      - 每列结构固定：圆形图标、主题色标题、一条细主题色线、多行正文
      - 各列等宽，正文行数尽量接近，共同撑满框高
      - 图标只作识别锚点，正文承担全部信息
    use_when:
      - 多个平级驱动因素共同支持一个结论
      - 每个因素都能写出 3-5 行完整解释
    avoid_when:
      - 因素之间有明确先后或因果链
      - 各因素权重不平级
      - 只能写出短标签
    variants:
      - 因素列 3-5 列，由内容定
      - 去掉顶部阶段带，只保留因素区和结论带

  - id: product-slide
    name: 左版图 · 右侧栏 · 底部指标行
    summary: 左侧多行分层版图，右侧一条竖向侧栏，底部圆环数字加标签带
    skeleton: |
      +---------------- 通栏标题 ----------------+
      | [层名] | 域名 | [][][][][]  |P| +------+ |
      |        |      |             |M| | 认证 | |
      | [层名] | 域名 | [][][][]    | | +------+ |
      |        |      |             | | | 认证 | |
      | [层名] | 域名 | [][][][][]  | | +------+ |
      |        | 域名 | [][][]      | | | 认证 | |
      |        | 域名 | [][]        | | +------+ |
      |  (o)     (o)     (o)     (o)     (o)     |
      |  23      110+    5,000+  100万+  37,000+ |
      | +-------------------------------------+  |
      | | 标签   标签    标签    标签   标签   |  |
      +-----------------------------------------+
    rules:
      - 左侧版图分三列：层名标签列、领域名列、条目块区，层名用主题色
      - 同层内的领域行数不等，条目块等高不等宽，按名称长度自适应
      - 右侧窄竖栏承载贯穿性内容，最右侧单独一栏放徽章类图形
      - 底部指标用浅灰圆环衬底加主题色数字，下方一条通栏浅灰标签带
      - 数据口径注释放右下角小字斜体
    use_when:
      - 展示复杂产品或能力版图，并配套规模指标
      - 页面核心是体系覆盖范围
    avoid_when:
      - 内容只是少数平级要点
      - 没有真实层级或分类依据
    variants:
      - 去掉右侧徽章栏
      - 底部指标数量随内容变化
