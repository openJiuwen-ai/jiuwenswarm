    enabled: false
  wecom:
    # 企业微信 AI 机器人配置
    bot_id:
    secret:
    ws_url: wss://openws.work.weixin.qq.com
    allow_from: []
    enable_streaming: true
    send_thinking_message: false
    enabled: false
    send_file_allowed: true
    # 群聊数字分身（默认关闭）
    group_digital_avatar: false
    my_user_id: ""
    bot_name: ""
    enable_memory: false

# ========== 细粒度权限管控（tiered_policy）==========
#
# schema: tiered_policy（或兼容 v_cc / v4.2）时由 tiered_policy.evaluate_tiered_policy 求值；
# permission_mode: normal|strict 决定 severity 映射，见 agentserver/permissions/tiered_policy.py。
# severity（normal）：LOW/MEDIUM→allow，HIGH/CRITICAL→ask；strict 下 MEDIUM→ask、CRITICAL→deny。
# rules[*].action: 可选显式动作 allow|ask|deny；配置后优先于 severity 映射，适合敏感文件读取、
# 系统控制等不希望随 permission_mode 漂移的规则。
# 内置参数规则 > 用户 rules；整工具存在则不用 defaults；详见 tiered_policy 模块说明。
#
# 三种动作: allow / ask / deny
permissions:
  enabled: false
  schema: tiered_policy
  permission_mode: normal

  defaults:
    "*": "allow"

  tools:
    bash: ask
    mcp_exec_command: ask
    create_terminal: ask
    write: allow
    write_file: allow
    edit_file: allow
    search_replace: allow
    write_memory: allow
    edit_memory: allow
    read_memory: allow
    memory_search: allow
    memory_get: allow
    todo_create: allow
    todo_insert: allow
    todo_complete: allow
    todo_remove: allow
    todo_list: allow
    # Coding Memory 工具权限
    coding_memory_write: allow
    coding_memory_edit: allow
    coding_memory_read: allow
    # 外接记忆工具（External Memory — OpenJiuwen / Mem0 / OpenViking）
    ltm_search: allow
    ltm_search_summary: allow
    mem0_profile: allow
    mem0_search: allow
    mem0_conclude: allow
    viking_search: allow
    viking_read: allow
    viking_browse: allow
    viking_remember: allow
    viking_add_resource: allow
    mcp_free_search: allow
    mcp_paid_search: allow
    mcp_fetch_webpage: allow
    cron_list_jobs: allow
    cron_get_job: allow
    cron_create_job: allow
    cron_update_job: allow
    cron_delete_job: allow
    cron_toggle_job: allow
    cron_preview_job: allow
    heartbeat_list_jobs: allow
    heartbeat_get_job: allow
    heartbeat_create_job: allow
    heartbeat_update_job: allow
    heartbeat_delete_job: allow
    heartbeat_toggle_job: allow
    heartbeat_preview_job: allow
    heartbeat_run_now: allow
    heartbeat_cancel_run: allow

  rules:
    - id: shell_allow_dir
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "dir *"
      severity: LOW
    - id: shell_allow_ls
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "ls *"
      severity: LOW
    - id: shell_allow_pwd
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "pwd *"
      severity: LOW
    - id: shell_allow_cd
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "cd *"
      severity: LOW
    - id: shell_allow_echo
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "echo *"
      severity: LOW
    - id: shell_allow_cat
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "cat *"
      severity: LOW
    - id: shell_allow_type
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "type *"
      severity: LOW
    - id: shell_allow_head
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "head *"
      severity: LOW
    - id: shell_allow_tail
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "tail *"
      severity: LOW
    - id: shell_allow_git_status
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "git status *"
      severity: LOW
    - id: shell_allow_git_log
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "git log *"
      severity: LOW
    - id: shell_allow_git_diff
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "git diff *"
      severity: LOW
    - id: shell_allow_git_branch
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "git branch *"
      severity: LOW
    - id: shell_ask_rm
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "rm *"
      severity: HIGH
    - id: shell_ask_del
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "del *"
      severity: HIGH
    - id: shell_ask_rd
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "rd *"
      severity: HIGH
    - id: shell_ask_mv
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "mv *"
      severity: HIGH
    - id: shell_ask_cp
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "cp *"
      severity: HIGH
    - id: shell_ask_chmod
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "chmod *"
      severity: HIGH
    - id: shell_ask_chown
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: "chown *"
      severity: HIGH
    - id: shell_ask_sensitive_file_reads
      tools: [bash, mcp_exec_command, create_terminal]
      pattern: 're:(?i)(^|[\s;&|()])((cat|type|less|more|head|tail|grep|find|Get-Content|Select-String)\b[^;&|]*(id_rsa|id_ed25519|\.pem\b|\.pfx\b|\.key\b|\.kube/config|\.aws/(credentials|config)|\.npmrc\b|\.env(\.[A-Za-z0-9_-]+)?\b|authorized_keys|\.ssh/))'
      severity: HIGH
    # path_ask_* → file_guard.paths（match: glob）

  # 数字分身 owner-scoped 权限（默认空，不生效）
  owner_scopes: {}
  deny_guidance_message: ""

  file_guard:
    enabled: true
    defaults:
      read: ask
      write: ask
      exec: ask
    workspace:
      read: allow
      write: allow
      exec: ask
    paths:
      - path: "**/.ssh/**"
        match: glob
        read: ask
        write: ask
        exec: ask
      - path: "**/.env*"
        match: glob
        read: ask
        write: ask
        exec: ask

  # Legacy external_directory（Native file_guard 启用后 "*" 不驱动路径层）
  external_directory:
    "*": "ask"

browser:
  # chrome_path can be a string or per-OS map.
  # Example:
  # chrome_path:
  #   windows: "C:\\Users\\YOUR_USER\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe"
  #   macos: "/Applications/Google Chrome.app"
  #   linux: "/usr/bin/google-chrome"
  chrome_path: ""
  # true runs Chrome without a visible window; false opens a managed window.
  headless: true

updater:
  enabled: true
  repo_owner: openJiuwen
  repo_name: jiuwenclaw
  release_api_url: ""
  # Windows/macOS use .exe/.dmg; multiple candidates prefer a unique WorkSwarm name.
  asset_name_pattern_linux: "JiuwenSwarm-{version}.tar.gz"
  timeout_seconds: 20

extensions:
  # 扩展包搜索目录（字符串），用 ';' 分割多个目录：
  # EXTENSION_DIRS="E:/a;D:/b"
  extension_dirs: ${EXTENSION_DIRS:-}


team:
  # 默认：单机 local + inprocess。双机 pyzmq 示例见 tmp/team-leader.yaml、tmp/team-teammate.yaml（与 .tmp/leader_home、.tmp/teammate_home 内 config 同步）。
  runtime:
    mode: local
    role: leader

  team_name: jiuwen_team
  lifecycle: persistent
  teammate_mode: build_mode
  spawn_mode: inprocess

  leader:
    member_name: team_leader
    display_name: 团队领导
    persona: "天才项目管理专家，擅长任务分解和团队协调"

  agents:
    leader:
      workspace:
        stable_base: true
      max_iterations: 200
      completion_timeout: 600.0
    teammate:
      workspace:
        stable_base: true
      max_iterations: 200
      completion_timeout: 600.0

  workspace:
    enabled: true

  transport:
    type: inprocess

  storage:
    type: sqlite

mcp:
  servers: []
  # 示例：
  # servers:
  #   - name: playwright
  #     enabled: true
  #     transport: stdio
  #     command: python
  #     args: ["path/to/server.py", "--transport", "stdio"]
  #     cwd: .
  #     env:
  #       LOG_LEVEL: INFO
  #   - name: local-sse
  #     enabled: false
  #     transport: sse
  #     url: http://127.0.0.1:9000/sse
  #     headers:
  #       Authorization: Bearer ${MCP_TOKEN}
  #     timeout_s: 30

modes:
  # 一级模式 agent / code / team
  agent:
    # plan / fast 已合并为单一 agent 模式：记忆固定被动（is_proactive 开关已下线）。
    memory:
      enabled: true
    rails:
    tools:
  code:
    # 动态 Rails — 列表中出现的 = 启用；不出现的 = 不启用
    # 固定 Rails（以下 Rails 已在代码中固定挂载，无需在此配置）：
    #   RuntimePromptRail, ResponsePromptRail, JiuClawStreamEventRail, SecurityRail,
    #   PermissionInterruptRail, SysOperationRail(FileSystemRail), LspRail,
    #   ProjectMemoryRail, CodingMemoryRail, AgentModeRail, StructuredAskUserRail,
    #   ConfirmInterruptRail, ContextProcessorRail
    rails:
      - SkillUseRail
      - WorktreeRail

    # 动态 Tools — 列表中出现的 = 启用
    # send_file_to_user 由运行时 _update_session_tools 注册，不在此配置
    # coding_memory_read/write/edit 由 CodingMemoryRail 在 subagent 内部注册，不在此配置
    tools:
      - web_free_search
      - web_fetch_webpage
      - web_paid_search
      - user_todos
      - skill_toolkit

    embedding_config:
      model_name: null
      base_url: null
      api_key: null
  team:
    jiuwen_team:
      team_name: jiuwen_team
      lifecycle: persistent
      teammate_mode: build_mode
      spawn_mode: inprocess

      leader:
        member_name: team_leader
        display_name: 团队领导
        persona: "天才项目管理专家，擅长任务分解和团队协调"

      agents:
        leader:
          workspace:
            stable_base: true
          max_iterations: 200
          completion_timeout: 600.0

      workspace:
        enabled: true

      transport:
        type: inprocess

      storage:
        type: sqlite
