# secret_registry.enterprise.yaml — 企业版模板（logical key 与个人版相同）
#
# 部署时拷贝为 {config_dir}/secret_registry.yaml（文件名不变，SecretRegistry 不读本文件名）。
# 与个人版差异示例：minio.* 绑 K8s 注入 env（OBS_*），非 config.yaml 字段。

# =============================================================================
# LLM / 主模型 / 多模态（Web config.set → .env）
# =============================================================================

llm.api_key:
  medium: env
  path: API_KEY

llm.custom_headers:
  medium: env
  path: CUSTOM_HEADERS

embed.api_key:
  medium: env
  path: EMBED_API_KEY

video.api_key:
  medium: env
  path: VIDEO_API_KEY

audio.api_key:
  medium: env
  path: AUDIO_API_KEY

vision.api_key:
  medium: env
  path: VISION_API_KEY

image_gen.api_key:
  medium: env
  path: IMAGE_GEN_API_KEY

# =============================================================================
# 搜索 / 外部 API
# =============================================================================

search.bocha.api_key:
  medium: env
  path: BOCHA_API_KEY

search.jina.api_key:
  medium: env
  path: JINA_API_KEY

search.serper.api_key:
  medium: env
  path: SERPER_API_KEY

search.perplexity.api_key:
  medium: env
  path: PERPLEXITY_API_KEY

search.petal.headers:
  medium: env
  path: PETAL_SEARCH_HEADERS

github.token:
  medium: env
  path: GITHUB_TOKEN

# =============================================================================
# 邮件 / TeamSkills / GitCode / Browser
# =============================================================================

email.token:
  medium: env
  path: EMAIL_TOKEN

teamskills.user_token:
  medium: env
  path: TEAM_SKILLS_HUB_USER_TOKEN

teamskills.system_token:
  medium: env
  path: TEAM_SKILLS_HUB_SYSTEM_TOKEN

gitcode.access_token:
  medium: env
  path: GITCODE_ACCESS_TOKEN

updater.gitcode.token:
  medium: env
  path: GITCODE_TOKEN

browser.extension_token:
  medium: env
  path: PLAYWRIGHT_MCP_EXTENSION_TOKEN

# =============================================================================
# 记忆 / 任务记忆 / Redis
# =============================================================================

memory.mem0.api_key:
  medium: env
  path: MEM0_API_KEY

memory.openviking.api_key:
  medium: env
  path: OPENVIKING_API_KEY

memory.lakebase.api_key:
  medium: env
  path: LAKEBASE_API_KEY

task_memory.api_key:
  medium: env
  path: TASK_MEMORY_API_KEY

redis.password:
  medium: env
  path: REDIS_PASSWORD

# =============================================================================
# DeepSearch / ACR / OpenAI 子进程
# =============================================================================

deepsearch.llm.api_key:
  medium: env
  path: LLM_API_KEY

deepsearch.web_search.api_key:
  medium: env
  path: WEB_SEARCH_API_KEY

deepsearch.tavily.api_key:
  medium: env
  path: TAVILY_API_KEY

acr.access_key:
  medium: env
  path: ACR_ACCESS_KEY

acr.access_secret:
  medium: env
  path: ACR_ACCESS_SECRET

acp.openai.api_key:
  medium: env
  path: OPENAI_API_KEY

# =============================================================================
# OfficeClaw / Skill 下载 / SecretStore 主密钥
# =============================================================================

office_claw.callback_token:
  medium: env
  path: OFFICE_CLAW_CALLBACK_TOKEN

office_claw.maas_headers:
  medium: env
  path: OFFICE_CLAW_HUAWEI_MAAS_HEADERS_JSON

skill.download.hmac_secret:
  medium: env
  path: SKILL_DOWNLOAD_HMAC_SECRET

crypto.master_key:
  medium: env
  path: JIUWEN_SECRET_MASTER_KEY

# =============================================================================
# config.yaml 明文段
# =============================================================================

react.a2x.api_key:
  medium: file
  path: config.yaml
  field: react.a2x_registry.api_key
  format: yaml

modes.code.embedding.api_key:
  medium: file
  path: config.yaml
  field: modes.code.embedding_config.api_key
  format: yaml

# 企业版：对象存储来自 K8s Secret / Pod env（部署契约为 OBS_*）
minio.access_key:
  medium: env
  path: OBS_ACCESS_KEY

minio.secret_key:
  medium: env
  path: OBS_SECRET_KEY

