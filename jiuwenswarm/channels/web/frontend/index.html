<!DOCTYPE html>
<html lang="zh-CN" data-theme="default" data-color-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f9" />
    <title>WorkSwarm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      启动中性层（Gateway S_09）：与 Electron 加载页一致，首帧即显示，由前端门控接管后移除。
      上次判定没有开场或本次启动已完成开场时不显示；脚本始终未接管时 20 秒后自动隐藏。
    -->
    <style>
      #workswarm-neutral { position: fixed; inset: 0; z-index: 2147483646; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px; background: #0f172a; color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        animation: workswarm-neutral-timeout 0s linear 20s forwards; }
      #workswarm-neutral img { width: 64px; height: 64px; border-radius: 16px; }
      #workswarm-neutral .workswarm-neutral__name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
      #workswarm-neutral .workswarm-neutral__spinner { width: 32px; height: 32px; border-radius: 50%;
        border: 3px solid rgba(148, 163, 184, 0.2); border-top-color: #60a5fa; animation: workswarm-neutral-spin 1.5s linear infinite; }
      @keyframes workswarm-neutral-spin { to { transform: rotate(360deg); } }
      @keyframes workswarm-neutral-timeout { to { visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="workswarm-neutral" aria-hidden="true">
      <img src="/logo.svg" alt="" />
      <div class="workswarm-neutral__name">WorkSwarm</div>
      <div class="workswarm-neutral__spinner"></div>
    </div>
    <script>
      (function () {
        try {
          // The completion record shares the launch identifier's storage (splash/launch.ts).
          var desktop = window.jiuwenDesktop && window.jiuwenDesktop.launchId;
          var launch = desktop || sessionStorage.getItem('workswarm.launch');
          var completed = (desktop ? localStorage : sessionStorage).getItem('workswarm.splash.completedLaunch');
          if (localStorage.getItem('workswarm.splash.expected') === '0' || (launch && completed === launch)) {
            document.getElementById('workswarm-neutral').remove();
          }
        } catch (error) {
          // Storage may be unavailable; the gate still removes the layer.
        }
      })();
    </script>
    <div id="root">
    </div>
    <!--
      ES2022 运行时 API 兜底（必须在 /src/main.tsx 之前以同步脚本执行）：
      依赖（es-toolkit / mermaid 等）与部分应用源码直接调用 Object.hasOwn /
      structuredClone / Array.prototype.at，老版本浏览器/内嵌 WebView 不支持会抛
      "Object.hasOwn is not a function"。ES module 的 import 求值在依赖图加载后
      才发生，无法保证早于依赖顶层执行，故用同步内联脚本先注入 polyfill。
    -->
    <script>
      (function () {
        if (!Object.hasOwn) {
          Object.hasOwn = function (obj, prop) {
            if (obj == null) {
              throw new TypeError('Cannot convert undefined or null to object');
            }
            return Object.prototype.hasOwnProperty.call(Object(obj), prop);
          };
        }
        if (typeof structuredClone !== 'function') {
          // 深拷贝兜底：满足 a2uiContent 消息克隆用途（可序列化对象）。
          window.structuredClone = function (value) {
            return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
          };
        }
        if (!Array.prototype.at) {
          Array.prototype.at = function (index) {
            var len = this.length >>> 0;
            var i = index >= 0 ? index : len + index;
            return i >= 0 && i < len ? this[i] : undefined;
          };
        }
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function (search, replacement) {
            if (search instanceof RegExp) {
              if (!search.global) {
                throw new TypeError('String.prototype.replaceAll called with a non-global RegExp argument');
              }
              return this.replace(search, replacement);
            }
            var escaped = String(search).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return this.replace(new RegExp(escaped, 'g'), replacement);
          };
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
