<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TokenWeather integration preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        document.getElementById('root').textContent = event.message;
      });
      window.addEventListener('unhandledrejection', function (event) {
        document.getElementById('root').textContent = String(event.reason);
      });
    </script>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
