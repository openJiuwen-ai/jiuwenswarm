schemaVersion: 1
package:
  id: webui.plugin-manager
  version: 1.0.0
  displayName: Plugin Manager / 插件管理
  description: A top-level WebUI plugin that renders a plugin-manager page in the navigation rail.
extensions:
  - id: plugin-manager
    runtime: backend
    module: webui_plugin_manager/extension.py
ui:
  apiVersion: 1
  items:
    - type: web.slot.contribution
      id: plugin-manager.menu
      slot: application.menu
      order: 5
      panel:
        title: Plugin Manager
      renderer:
        kind: webui-tree
    - type: web.slot.contribution
      id: plugin-manager.main
      slot: application.menu.main
      order: 5
      panel:
        title: Plugin Manager
      renderer:
        kind: webui-tree
