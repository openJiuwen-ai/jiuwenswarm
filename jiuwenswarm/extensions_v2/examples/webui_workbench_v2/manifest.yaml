schemaVersion: 1
package:
  id: webui.workbench-v2
  version: 1.0.9
  displayName: Plugin Workbench / 插件交互工作台
  description: A plugin demo with workspace files, webpage tabs, and session-scoped WebUI slot contributions.
extensions:
  - id: workbench-v2
    runtime: backend
    module: webui_workbench_v2/extension.py
ui:
  apiVersion: 1
  items:
    - {type: web.slot.contribution, id: workbench.entry, slot: application.entry, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.user, slot: application.sidebar.footer, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.menu, slot: application.menu, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.main, slot: application.menu.main, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.task, slot: task.function, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.task.main, slot: task.function.main, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.settings, slot: application.settings, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.above, slot: conversation.input.above, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.below, slot: conversation.input.below, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.details, slot: conversation.panel.right, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.iframe, slot: conversation.panel.right, order: 41, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.turn, slot: conversation.session.content.after, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.turn.actions, slot: conversation.turn.footer.actions, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.title, slot: conversation.header.title.after, order: 40, renderer: {kind: webui-tree}}
    - {type: web.slot.contribution, id: workbench.actions, slot: conversation.header.actions, order: 40, renderer: {kind: webui-tree}}
