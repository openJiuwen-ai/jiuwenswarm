schemaVersion: 1
package:
  domain: gateway
  id: webui.login-demo
  version: 1.0.0
  displayName: WorkSwarm Login Example
  description: Plugin-owned login page and avatar menu with local mock credentials.
extensions:
  - id: login-demo
    runtime: backend
    module: auth_login_demo/extension.py
ui:
  apiVersion: 1
  items:
    - type: web.slot.contribution
      id: login-demo.entry
      slot: application.entry
      renderer: {kind: webui-tree}
    - type: web.slot.contribution
      id: login-demo.user
      slot: application.sidebar.footer
      renderer: {kind: webui-tree}
client:
  requestBindings:
    - type: http
      source: {key: login, path: [accessToken]}
      target: {location: header, name: Authorization, prefix: 'Bearer '}
    - type: websocket
      source: {key: login, path: [accessToken]}
      target:
        location: message
        path: [request_context, headers, Authorization]
        prefix: 'Bearer '
