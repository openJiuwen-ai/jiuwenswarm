schemaVersion: 1
package:
  domain: agentserver
  id: webui.token-weather-glass
  version: 1.2.0
  displayName: TokenWeather
  description: Observed context usage with shared host styling.
extensions:
  - id: token-weather-glass
    runtime: backend
    module: token_weather_glass/extension.py
ui:
  apiVersion: 1
  items:
    - type: web.slot.contribution
      id: weather
      slot: conversation.input.above
      renderer: {kind: webui-tree}
    - type: web.slot.contribution
      slot: application.settings
      kind: item
      scope: application
      id: show-weather
      location: {menu: general, section: display}
      title: {zh: 显示 TokenWeather, en: Show TokenWeather}
      description:
        zh: 在输入框上方显示真实用量，适用于当前客户端的所有会话。
        en: Show observed usage above the input in all conversations on this client.
      renderer: {kind: webui-tree}
    - type: web.slot.contribution
      id: details
      slot: conversation.panel.right
      instanceKey: details
      renderer: {kind: webui-tree}
