[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenswarm-process-sdk"
version = "0.1.0"
description = "Thin, one-command-per-process JiuwenSwarm client"
requires-python = ">=3.11"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jiuwenswarm_sdk = ["py.typed"]
