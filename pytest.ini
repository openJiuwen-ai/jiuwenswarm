[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
# Plugins keep their own tests beside their code (jiuwenswarm/extensions/*/tests),
# so the default run has to reach in there as well or a plugin's suite silently
# stops running the day it moves into the plugin.
testpaths = tests jiuwenswarm/extensions/*/tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=jiuwenswarm
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --asyncio-mode=auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    system: System tests
    slow: Slow running tests
    async: Async tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
