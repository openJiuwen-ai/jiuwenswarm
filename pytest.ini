[pytest]
# Pytest configuration file

# Test the checkout rather than an older installed workswarm package.
pythonpath = .

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=jiuwenswarm
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --asyncio-mode=auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    system: System tests
    slow: Slow running tests
    async: Async tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    # 上游依赖源码的已知 SyntaxWarning（编译时触发），scoped 放行避免在
    # filterwarnings=error 下阻断 Python 3.12+/3.13/3.14 测试收集。
    # 规则锚定到消息开头，不匹配消息中任意位置的子串：
    #   - pysbd==0.3.4 的 invalid escape sequence：3.12 消息以
    #     "invalid escape sequence" 开头，3.13+ 以 "\<转义>" 开头，用二分支覆盖
    #   - dingtalk-stream 源码的 'return' in a 'finally' block：消息以 'return' 开头
    ignore:(invalid escape sequence|"[^"]*" is an invalid escape sequence):SyntaxWarning
    ignore:'return'( with value)? in a 'finally' block:SyntaxWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
