schemaVersion: 1
package:
  id: webui.token-weather
  version: 1.0.0
  displayName: Token Weather
  description: Shows the last round's token usage and the session context summary.
extensions:
  - id: token-weather
    runtime: backend
    module: token_weather/extension.py
ui:
  apiVersion: 1
  items:
    - type: web.slot.contribution
      id: token-weather.turn
      slot: message.assistant.meta
      order: 10
      panel:
        title: Turn Usage
      renderer:
        kind: webui-tree
    - type: web.slot.contribution
      id: token-weather.summary
      slot: conversation.input.below
      order: 20
      panel:
        title: Context Usage
      renderer:
        kind: webui-tree
