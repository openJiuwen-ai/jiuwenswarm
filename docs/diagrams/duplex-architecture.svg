<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:483px;height:789px;background:#FFFFFF;" width="483px" height="789px" viewBox="0 0 483 789" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="10"><text x="112.25" y="24.813" fill="#000" font-size="14" textLength="252" font-weight="700" font-family="Microsoft YaHei">双工架构：快模型路由与打断后重新规划</text></g><!--entity sender--><g class="entity" data-qualified-name="sender" id="ent0001" data-source-line="11"><ellipse cx="223.715" cy="59.978" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M223.715,67.978 L223.715,94.978 M210.715,75.978 L236.715,75.978 M223.715,94.978 L210.715,109.978 M223.715,94.978 L236.715,109.978" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="158" y="128.407" fill="#000" font-size="16" textLength="131.43" font-family="Microsoft YaHei">用户 / 其他 Agent</text></g><!--entity inlet--><g class="entity" data-qualified-name="inlet" id="ent0002" data-source-line="12"><rect x="141.5" y="193.478" width="164" height="62.234" fill="#F2F5F8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="151.5" y="220.407" fill="#000" font-size="16" textLength="132.938" font-family="Microsoft YaHei">原 A2A / 用户入口</text><text x="151.5" y="241.524" fill="#000" font-size="16" textLength="144" font-family="Microsoft YaHei">消息接收与已读确认</text></g><!--entity router--><g class="entity" data-qualified-name="router" id="ent0003" data-source-line="13"><rect x="82.5" y="292.478" width="281.734" height="83.352" fill="#D9ECFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="92.5" y="319.407" fill="#000" font-size="16" textLength="261.734" font-family="Microsoft YaHei">监工：SDK / Jev / MindsHub / Clef</text><text x="92.5" y="340.524" fill="#000" font-size="16" textLength="181.641" font-family="Microsoft YaHei">原消息 + 已有任务 / 计划</text><text x="92.5" y="361.642" fill="#000" font-size="16" textLength="144" font-family="Microsoft YaHei">每条消息只判断一次</text></g><!--entity steer--><g class="entity" data-qualified-name="steer" id="ent0004" data-source-line="14"><rect x="50.5" y="457.478" width="132" height="62.234" fill="#F2F5F8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="60.5" y="484.407" fill="#000" font-size="16" textLength="58.367" font-family="Microsoft YaHei">原 steer</text><text x="60.5" y="505.524" fill="#000" font-size="16" textLength="112" font-family="Microsoft YaHei">不取消当前计算</text></g><!--entity pause--><g class="entity" data-qualified-name="pause" id="ent0005" data-source-line="15"><rect x="202.5" y="457.478" width="260" height="62.234" fill="#F2F5F8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="212.5" y="484.407" fill="#000" font-size="16" textLength="121.047" font-family="Microsoft YaHei">原 SDK 安全暂停</text><text x="212.5" y="505.524" fill="#000" font-size="16" textLength="240" font-family="Microsoft YaHei">适配层作废旧计划，要求重新规划</text></g><!--entity slow--><g class="entity" data-qualified-name="slow" id="ent0006" data-source-line="16"><rect x="126.5" y="601.478" width="196" height="62.234" fill="#F2F5F8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="136.5" y="628.407" fill="#000" font-size="16" textLength="67.125" font-family="Microsoft YaHei">慢 Agent</text><text x="136.5" y="649.524" fill="#000" font-size="16" textLength="176" font-family="Microsoft YaHei">原任务、原提示、原工具</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="24"><path d="M6,700.478 L6,773.829 A0,0 0 0 0 6,773.829 L443.305,773.829 A0,0 0 0 0 443.305,773.829 L443.305,710.478 L433.305,700.478 L228.5,700.478 L224.5,663.677 L220.5,700.478 L6,700.478 A0,0 0 0 0 6,700.478" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M433.305,700.478 L433.305,710.478 L443.305,710.478 L433.305,700.478" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="722.407" fill="#000" font-size="16" textLength="279.859" font-family="Microsoft YaHei">快模型判断期间，慢 Agent 继续运行。</text><text x="12" y="743.524" fill="#000" font-size="16" textLength="416.305" font-family="Microsoft YaHei">哈希变化不拒绝判断；暂停 / 停止和重复消息保护仍有效。</text><text x="12" y="764.642" fill="#000" font-size="16" textLength="361.047" font-family="Microsoft YaHei">模型阶段可取消；已开始的工具由 SDK 等待完成。</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="223.5,193.223,227.5,184.223,223.5,188.223,219.5,184.223,223.5,193.223" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M223.5,132.486 C223.5,151.991 223.5,170.15 223.5,188.223" style="stroke:#52647A;stroke-width:1;" fill="none"/><text x="225.5" y="169.407" fill="#000" font-size="16" textLength="48" font-family="Microsoft YaHei">新消息</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-link-type="dependency"><polygon points="223.5,292.144,227.5,283.144,223.5,287.144,219.5,283.144,223.5,292.144" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M223.5,255.708 C223.5,267.011 223.5,275.041 223.5,287.144" style="stroke:#52647A;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk9" data-link-type="dependency"><polygon points="112.722,457.299,116.288,448.118,112.483,452.304,108.297,448.499,112.722,457.299" fill="#52647A" style="stroke:#52647A;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M140.536,375.741 C134.778,381.048 129.631,386.947 125.5,393.478 C113.58,412.32 111.547,432.677 112.483,452.304" style="stroke:#52647A;stroke-width:1;" fill="none"/><text x="183.391" y="412.407" fill="#000" font-size="16" textLength="64.828" 