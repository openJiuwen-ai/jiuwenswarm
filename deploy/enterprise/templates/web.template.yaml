apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<WEB_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<WEB_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<WEB_NAME>>
  template:
    metadata:
      labels:
        app: <<WEB_NAME>>
    spec:
      containers:
        - name: web
          image: <<WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: <<WEB_HTTP_PORT>>
              protocol: TCP
            - name: websocket
              containerPort: <<WEB_WS_PORT>>
              protocol: TCP
          envFrom:
            - secretRef:
                name: <<SECRET_CM_NAME>>
          env:
            - name: JIUWENCLAW_WEB_HOST
              value: "0.0.0.0"
            - name: FRONTEND_HOST
              value: "0.0.0.0"
            - name: JIUWENSWARM_EDITION
              value: "enterprise"
            - name: LOGIN_AUTH_SIMULATE
              value: "<<APPLY_PATCH>>"
            - name: FRONTEND_PORT
              value: "<<WEB_HTTP_PORT>>"
            - name: WEB_TRANSPORT
              value: "http"
            - name: ENTERPRISE_WEB_WS_HOST
              value: "0.0.0.0"
            - name: ENTERPRISE_WEB_WS_PORT
              value: "<<WEB_WS_PORT>>"
            - name: GATEWAY_URL
              value: "http://<<GATEWAY_NAME>>:<<WEB_PORT>>"
            - name: GATEWAY_WEB_HTTP_URL
              value: "http://<<GATEWAY_NAME>>:<<GATEWAY_WEB_HTTP_PORT>>"
            - name: WS_ORIGIN_CHECK_ENABLED
              value: "<<WS_ORIGIN_CHECK_ENABLED>>"
            - name: WS_ALLOWED_ORIGINS
              value: "<<WS_ALLOWED_ORIGINS>>"
            - name: WEB_DB_TYPE
              value: "<<DB_TYPE>>"
            - name: WEB_DB_HOST
              value: "<<DB_HOST>>"
            - name: WEB_DB_PORT
              value: "<<DB_PORT>>"
            - name: WEB_DB_USER
              value: "<<WEB_DB_USER>>"
            - name: WEB_DB_NAME
              value: "<<WEB_DB_NAME>>"
            - name: TZ
              value: "<<TIMEZONE>>"
            - name: OBS_URL
              value: "<<OBS_URL>>"
            - name: OBS_ACCESS_KEY
              value: "<<OBS_ACCESS_KEY>>"
            - name: OBS_BUCKET
              value: "<<OBS_BUCKET>>"
            - name: OBS_SECURE
              value: "<<OBS_SECURE>>"
            - name: OBS_PUBLIC_BASE_URL
              value: "<<OBS_PUBLIC_BASE_URL>>"
            - name: OBS_REGION
              value: "<<OBS_REGION>>"

---
# 集群内部访问： 提供稳定 DNS 域名
apiVersion: v1
kind: Service
metadata:
  name: <<WEB_NAME>>
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: <<WEB_NAME>>
  ports:
    - name: http
      port: <<WEB_HTTP_PORT>>
      targetPort: <<WEB_HTTP_PORT>>
    - name: websocket
      port: <<WEB_WS_PORT>>         # Service 端口
      targetPort: <<WEB_WS_PORT>>   # 容器端口
  type: ClusterIP                             # 集群内部访问，不需要外网

---
# NodePort Service：供外连接
apiVersion: v1
kind: Service
metadata:
  name: <<WEB_NAME>>-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - port: <<WEB_HTTP_PORT>>                    # 集群内部端口
      targetPort: <<WEB_HTTP_PORT>>              # 容器端口
      nodePort: <<WEB_NODE_PORT>>   # 外部访问端口（30000-32767）
  selector:
    app: <<WEB_NAME>>
