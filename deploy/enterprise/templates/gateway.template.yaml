apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<GATEWAY_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<GATEWAY_NAME>>
spec:
  replicas: <<GATEWAY_REPLICAS>>
  selector:
    matchLabels:
      app: <<GATEWAY_NAME>>
  template:
    metadata:
      labels:
        app: <<GATEWAY_NAME>>
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:  # 软限制：优先把pod分开部署，但如果资源紧张、只有一个节点可用的时候，也允许它们挤在同一台机器上
          - weight: 100                                     # 权重范围（1-100），取最高值，优先分开放置
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - <<GATEWAY_NAME>>
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: gateway
          image: <<GATEWAY_IMAGE>>
          imagePullPolicy: IfNotPresent
          # 调试模式：gateway 崩溃后容器不退出（sleep 保活），便于进 Pod 排查。
          # command: ["/bin/sh", "-c"]
          # args: ["jiuwenswarm-gateway; echo '[debug-keepalive] gateway exited rc=$?, sleeping'; sleep infinity"]
          ports:
            - name: web-ws
              containerPort: <<WEB_PORT>>
            - name: http
              containerPort: <<GATEWAY_HTTP_PORT>>
            - name: web-http
              containerPort: <<GATEWAY_WEB_HTTP_PORT>>
            - name: config-http
              containerPort: <<GATEWAY_CONFIG_HTTP_PORT>>
          # active-standby：仅 PRIMARY Ready，保证 ClusterIP 流量打到主
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: config-http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: config-http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: <<SECRET_CM_NAME>>
            - configMapRef:
                name: <<GATEWAY_ENV_FILE_CM_NAME>>
          volumeMounts:
            - name: gateway-config
              mountPath: <<CLAW_HOME>>/.jiuwenswarm/config/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: gateway-config
          configMap:
            name: <<GATEWAY_CONFIG_MAP_NAME>>
            items:
              - key: config.yaml
                path: config.yaml

---
# Service：提供稳定 DNS 域名, 供集群内部访问
apiVersion: v1
kind: Service
metadata:
  name: <<GATEWAY_NAME>>
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: <<GATEWAY_NAME>>
  ports:
    - name: web-ws
      port: <<WEB_PORT>>
      targetPort: <<WEB_PORT>>
    - name: http
      port: <<GATEWAY_HTTP_PORT>>
      targetPort: <<GATEWAY_HTTP_PORT>>
    - name: web-http
      port: <<GATEWAY_WEB_HTTP_PORT>>
      targetPort: <<GATEWAY_WEB_HTTP_PORT>>
    - name: config-http
      port: <<GATEWAY_CONFIG_HTTP_PORT>>
      targetPort: <<GATEWAY_CONFIG_HTTP_PORT>>
  type: ClusterIP                             # 集群内部访问，不需要外网

---
# NodePort Service：供外连接， 只暴露 config-http 端口
apiVersion: v1
kind: Service
metadata:
  name: <<GATEWAY_NAME>>-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - name: config-http
      port: <<GATEWAY_CONFIG_HTTP_PORT>>
      targetPort: <<GATEWAY_CONFIG_HTTP_PORT>>
      nodePort: <<GATEWAY_CONFIG_HTTP_NODE_PORT>>
  selector:
    app: <<GATEWAY_NAME>>
