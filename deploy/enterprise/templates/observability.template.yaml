apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<OBSERVABILITY_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<OBSERVABILITY_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<OBSERVABILITY_NAME>>
  template:
    metadata:
      labels:
        app: <<OBSERVABILITY_NAME>>
    spec:
      enableServiceLinks: false
      containers:
        - name: <<OBSERVABILITY_NAME>>
          image: <<OBSERVABILITY_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5274
              protocol: TCP
          env:
            # nginx 模板 envsubst 变量（docker/observability.nginx.conf.template）
            - name: OBSERVABILITY_PORT
              value: "5274"
            - name: OBSERVABILITY_LOKI_URL
              value: "http://<<LOKI_NAME>>:3100"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: <<OBSERVABILITY_NAME>>
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - name: http
      port: 5274
      targetPort: 5274
      nodePort: <<OBSERVABILITY_NODE_PORT>>
  selector:
    app: <<OBSERVABILITY_NAME>>
