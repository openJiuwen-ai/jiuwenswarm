# Windows 沙箱 policy. 仅含 Windows 相关字段 (Linux 字段用模型默认值, 不必列出).
# 用 JIUWENBOX_POLICY_PATH=<本文件> 指定加载.
version: 1

name: "windows-default"

# 平台无关 env, 注入子进程.
environment: {}

# ---------------------------------------------------------------------------
# Windows 专用配置 (docs/window沙箱.md 6.10)
# ---------------------------------------------------------------------------
windows:
  # 出站代理端口范围: WFP Permit filter 仅放行指向 127.0.0.1:<port_range>
  # 的流量, 沙箱出网必须经此代理做域名/IP 白名单过滤.
  proxy:
    port_range_start: 60080
    port_range_end: 60089

  filesystem:
    # 一次性预装读 ACL 的路径 (安装阶段, 需提权). 只预装 jbx-sandbox 默认读不了且沙箱运行必需的目录.
    # 不预装系统/用户大目录 (USERPROFILE/SystemRoot/ProgramFiles/ProgramData 的默认 DACL 已给 BUILTIN\Users 组授 GR/GE 且继承, jbx-sandbox 在 Users 组能读);
    # 且 USERPROFILE 巨型目录递归 grant ACE 极慢会卡死 install, 沙箱要读的 workspace/venv/产物由会话时 apply_sandbox_acl 精确授权.
    # 实际预装只有 tool_paths 展开的工具目录 (D:\Files\Git 等, owner=Administrators 不在系统目录下, 默认 ACL 不放行 Users → 需预装; 目录小递归快).
    # 由 collect_preinstall_paths 自动合并 read_acl_preinstall + tool_paths, 故这里留空即可.
    read_acl_preinstall: []
    # 沙箱可写路径 (合成 SID 授 Allow Write+Execute+Delete). 第一个路径作为沙箱 workspace 根.
    allow_write:
      - "{{ workspace }}"
    # 沙箱可读路径 (合成 SID + 真实 SID 授 Allow Read+Execute). runner 第一跳用真实 SID, 合成 SID 的 ACE 不生效,
    # apply_sandbox_acl 会给真实 SID 也 grant Read. skill 脚本目录必须列出, 否则 node cli.js 读不到 skill 模板.
    allow_read:
      # skill 脚本目录 (pptx-craft 等), 经 JIUWENBOX_SKILLS_DIR env 注入实际路径. 未注入时跳过 (os.path.exists 守护).
      - "%JIUWENBOX_SKILLS_DIR%"
    # 在 allow 范围内精细化封锁 (Deny Write).
    deny_write:
      - "{{ workspace }}/.git"
      - "{{ workspace }}/.env"
    # 非默认安装路径的工具目录/可执行. 受限 token 默认读不了 → CreateProcessAsUserW 返回 WinError 2/5.
    # 配置后: ① 加进 read ACL 预装 (含 Execute) ② 拼进子进程 PATH. 全部留空则跳过, 依赖系统 PATH + 默认预装目录.
    # 运行时自动检测 (policy_reader._resolve_tool_paths): 留空字段在 load_policy 时用 sys.executable 反推 —
    # OfficeAce 预制 python 跑时 (tools/python/python.exe) 反推 tools 目录填 python_dir/node_dir; git_dir/bash_path 从 PATH 检测.
    # 开发环境: sys.executable 指向 .venv\Scripts\python.exe. 显式填写的字段不被覆盖.
    tool_paths:
      git_dir: ''        # 自动检测; OfficeAce 包未带 git 时留空
      node_dir: ''       # 自动检测 (OfficeAce tools/node)
      python_dir: ''     # 自动检测 (sys.executable 反推)
      bash_path: ''      # git_dir 解析后自动拼 usr/bin/bash.exe

  network:
    # wfp_loopback_proxy: WFP Block 所有出站 + Permit loopback:port_range. disabled: 不装 WFP filter, 沙箱可直接访问外网.
    mode: wfp_loopback_proxy
    egress:
      # 适配期 default: allow — skill 产物 HTML 引用的 CDN 域名 (cdn.digitalhumanai.top/cdnjs/jsdelivr/unpkg/fonts.google) 未穷举进白名单,
      # default:deny 会致 convert 阶段 localize 资源拉不到 CDN 卡死. 待 skill 侧 CDN 资源打包固化后收紧为 default:deny + 完整白名单.
      default: allow
      # 域名白名单 (沙箱可访问的外部域名, 解析后比对 IP).
      # Playwright Chromium 下载: pptx-craft/.npmrc 配 playwright_download_host=npmmirror.com → registry/cdn.npmmirror.com.
      # npm 包源: registry.npmmirror.com (pptx-craft .npmrc). python 包源: pypi.org / files.pythonhosted.org.
      allowed_domains:
        - "pypi.org"
        - "files.pythonhosted.org"
        # P2-34: *.npmmirror.com 通配偏宽, 待确认具体子域后收紧.
        - "registry.npmmirror.com"
        - "cdn.npmmirror.com"
      blocked_domains:
        - "ip.me"
      allowed_ips:
        - "127.0.0.1/32"
        - "::1/128"
      blocked_ips:
        - "169.254.169.254/32"
      allowed_ports:
        - 443
        - 80
      blocked_ports:
        - 22
    ingress:
      default: deny
      allowed_domains:
        - "localhost"
      blocked_domains: []
      allowed_ips:
        - "127.0.0.1/32"
        - "::1/128"
      blocked_ips: []
      allowed_ports: []
      blocked_ports: []

  resource:
    # Job Object 限制 (对齐 Linux cgroup). 全部留空 = 不限制.
    memory_max: 512M
    cpu_rate: 50            # 百分比 (1-100), 对应 Job CpuRate.
    max_processes: 32
