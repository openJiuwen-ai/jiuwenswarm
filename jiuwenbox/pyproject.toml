[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenbox"
version = "0.1.0"
description = "Jiuwen sandbox system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.31,<0.1",  # CVE-2026-42561 MultipartParser DoS
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
jiuwenbox = "jiuwenbox.cli.jiuwenbox:main"
jiuwenbox-server = "jiuwenbox.server.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jiuwenbox*"]

[tool.setuptools.package-data]
jiuwenbox = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "system: System tests",
    "slow: Slow running tests",
    "async: Async tests",
]

[tool.ruff]
src = ["src"]
line-length = 100
